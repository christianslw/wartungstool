<!doctype html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wartungstool – Technik Außeneinsatz</title>
<meta name="color-scheme" content="light dark">
<meta name="description" content="Wartungsdisposition für Techniker im Außeneinsatz – Erledigung und Auskunft">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23161616'/><path d='M8 21.5 13 10.5l3.4 6.6L18.6 14 24 21.5z' fill='none' stroke='%23f4f4f4' stroke-width='2' stroke-linejoin='round'/></svg>">
<style>
/* ==========================================================================
   Wartungstool – IBM Carbon Design System (Redesign /ui)
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}

:root{
  color-scheme:dark;
  --bg:#0f0f0f;
  --layer-01:#1c1c1c;
  --layer-02:#262626;
  --layer-03:#333333;
  --field:#1c1c1c;
  --field-hover:#262626;
  --hover-1:#1c1c1c;
  --hover-2:#262626;
  --sel-bg:#1b2a4a;
  --sel-fg:#dbeafe;
  --scrim:rgba(0,0,0,.55);

  --hdr-bg:#161616; --hdr-hover:#353535; --hdr-active:#4c4c4c;

  --panel:var(--field);
  --row-alt:#141414;
  --muted:var(--text-helper);
  --border-2:#393939;
  --support-info:var(--info);
  --ring:0 0 0 2px var(--interactive);
  --shadow-2:0 4px 14px rgba(0,0,0,.5);

  --border-subtle:#262626;
  --border-strong:#525252;
  --border-inverse:#f4f4f4;

  --text-primary:#f4f4f4;
  --text-secondary:#c6c6c6;
  --text-helper:#8d8d8d;
  --text-disabled:#525252;
  --text-placeholder:#6f6f6f;
  --text-on-color:#ffffff;

  --link:#78a9ff;
  --interactive:#0f62fe;
  --interactive-hover:#0353e9;
  --interactive-active:#002d9c;
  --interactive-light:#4589ff;
  --focus:#ffffff;

  --success:#42be65;
  --warning:#f1c21b;
  --error:#fa4d56;
  --info:#4589ff;

  --tag-green-bg:#044317;  --tag-green-fg:#a7f0ba;
  --tag-red-bg:#750e13;    --tag-red-fg:#ffd7d9;
  --tag-yellow-bg:#684e00; --tag-yellow-fg:#fdd13a;
  --tag-blue-bg:#0043ce;   --tag-blue-fg:#d0e2ff;
  --tag-gray-bg:#333333;   --tag-gray-fg:#f4f4f4;

  --font:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;

  --row-h:40px;
  --ctl-h:36px;
  --hdr-h:48px;
  --tb-h:44px;
  --z-header:60; --z-sticky:20; --z-overlay:90; --z-toast:100;
}

html[data-theme="light"]{
  --bg:#ffffff;
  --layer-01:#f4f4f4;
  --layer-02:#ffffff;
  --layer-03:#e0e0e0;
  --field:#f4f4f4;
  --field-hover:#e8e8e8;
  --hover-1:#f7f7f7;
  --hover-2:#eeeeee;
  --sel-bg:#edf5ff;
  --sel-fg:#0043ce;
  --scrim:rgba(22,22,22,.5);

  --border-subtle:#e0e0e0;
  --border-strong:#8d8d8d;
  --border-inverse:#161616;

  --text-primary:#161616;
  --text-secondary:#525252;
  --text-helper:#6f6f6f;
  --text-disabled:#c6c6c6;
  --text-placeholder:#a8a8a8;
  --text-on-color:#ffffff;

  --link:#0f62fe;
  --interactive:#0f62fe;
  --interactive-hover:#0353e9;
  --interactive-active:#002d9c;
  --interactive-light:#0f62fe;
  --focus:#0f62fe;

  --success:#24a148;
  --warning:#8e6a00;
  --error:#da1e28;
  --info:#0043ce;

  --tag-green-bg:#defbe6;  --tag-green-fg:#044317;
  --tag-red-bg:#ffeef0;    --tag-red-fg:#750e13;
  --tag-yellow-bg:#fdf5d6; --tag-yellow-fg:#4d3b00;
  --tag-blue-bg:#edf5ff;   --tag-blue-fg:#0043ce;
  --tag-gray-bg:#e8e8e8;   --tag-gray-fg:#161616;

  color-scheme:light;
  --hdr-bg:#ffffff; --hdr-hover:#f4f4f4; --hdr-active:#e8e8e8;
  --row-alt:#fbfbfb;
  --border-2:#c6c6c6;
  --shadow-2:0 4px 14px rgba(22,22,22,.12);
}

html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text-primary);font-family:var(--font);
  font-size:13px;line-height:18px;letter-spacing:.16px;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--link);text-decoration:none}
dl,dd,dt,h1,h2,h3,p{margin:0}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
::selection{background:var(--interactive);color:#fff}

@media (prefers-reduced-motion: reduce) {
  *,*::before,*::after{animation:none !important;transition:none !important}
}

.t-label{font-size:11px;line-height:14px;letter-spacing:.32px;color:var(--text-secondary)}
.t-helper{font-size:11px;line-height:14px;letter-spacing:.32px;color:var(--text-helper)}
.t-body{font-size:13px;line-height:18px;letter-spacing:.16px}
.t-strong{font-weight:600}
.t-mono{font-family:var(--mono)}

/* ==========================================================================
   Chrome Zeile 1: App Bar (Höhe 48px)
   ========================================================================== */
.shell-header{
  height:var(--hdr-h);flex:0 0 auto;background:var(--hdr-bg);
  border-bottom:1px solid var(--border-subtle);
  display:flex;align-items:center;gap:12px;padding:0 16px;
  position:relative;z-index:var(--z-header);
}
.hdr-brand{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.hdr-brand svg{color:var(--interactive)}
.hdr-name{font-size:14px;font-weight:600;letter-spacing:.16px;white-space:nowrap}
.hdr-sub{font-size:11px;color:var(--text-helper);white-space:nowrap;display:none}
@media (min-width:980px){.hdr-sub{display:inline}}

.hdr-search{
  flex:1 1 360px;max-width:560px;display:flex;align-items:center;height:34px;
  background:var(--layer-01);border:1px solid var(--border-strong);
  border-bottom:2px solid var(--border-strong);transition:border-color .15s, box-shadow .15s;
  margin:0 8px;position:relative;
}
.hdr-search:focus-within{border-color:var(--interactive);box-shadow:var(--ring)}
.hdr-search > svg{margin:0 8px 0 10px;color:var(--text-secondary);flex:0 0 auto}
.hdr-search input{
  flex:1 1 auto;height:100%;border:0;background:none;outline:none;
  font-size:13px;color:var(--text-primary);min-width:60px;padding-right:28px;
}
.hdr-search input::placeholder{color:var(--text-placeholder)}
.searchkey{
  font:600 10px var(--mono);color:var(--text-helper);background:var(--layer-02);
  border:1px solid var(--border-subtle);border-radius:3px;padding:1px 5px;
  margin-right:8px;pointer-events:none;flex:0 0 auto;
}
.hdr-search .clr{
  position:absolute;right:28px;width:24px;height:100%;display:grid;place-items:center;
  color:var(--text-secondary);
}
.hdr-search .clr:hover{color:var(--text-primary)}
.hdr-search input:placeholder-shown + .clr{display:none}

.hdr-spacer{flex:1 1 auto}

.hdr-user{
  display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 8px;
  font-size:12px;color:var(--text-secondary);border:1px solid transparent;
  max-width:180px;white-space:nowrap;transition:background .1s, border-color .1s;flex:0 0 auto;
}
.hdr-user:hover{background:var(--hdr-hover);color:var(--text-primary);border-color:var(--border-subtle)}
.hdr-user span.uname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-nudge{
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--warning);color:#161616;font-size:10px;font-weight:700;
  width:16px;height:16px;border-radius:50%;margin-left:2px;flex:0 0 auto;
}

.hdr-btn{
  width:32px;height:32px;display:grid;place-items:center;color:var(--text-secondary);
  border:1px solid transparent;flex:0 0 auto;transition:background .1s, color .1s;
}
.hdr-btn:hover{background:var(--hdr-hover);color:var(--text-primary);border-color:var(--border-subtle)}
.hdr-btn:active{background:var(--hdr-active)}

/* ==========================================================================
   Chrome Zeile 2: Toolbar (Höhe 44px)
   ========================================================================== */
.toolbar-row{
  height:var(--tb-h);flex:0 0 auto;background:var(--bg);
  border-bottom:1px solid var(--border-subtle);
  display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px;
  position:relative;z-index:10;
}

.scope-tabs{display:flex;align-items:flex-end;height:100%;gap:4px;flex:0 0 auto}
.scope-tab{
  display:inline-flex;align-items:center;gap:6px;height:100%;padding:0 12px;
  font-size:13px;font-weight:500;color:var(--text-secondary);
  border-bottom:2px solid transparent;transition:color .12s, border-color .12s;
  white-space:nowrap;
}
.scope-tab:hover{color:var(--text-primary)}
.scope-tab[aria-selected="true"]{
  color:var(--text-primary);font-weight:600;border-bottom-color:var(--interactive);
}
.scope-tab .n{
  font-size:11px;font-weight:400;color:var(--text-helper);font-variant-numeric:tabular-nums;
}
.scope-tab[aria-selected="true"] .n{color:var(--text-primary)}

.tb-center{
  display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;
}
.tb-center::-webkit-scrollbar{display:none}

.status-seg{
  display:inline-flex;align-items:center;background:var(--layer-01);
  border:1px solid var(--border-subtle);border-radius:2px;padding:2px;height:28px;
}
.seg-btn{
  display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;
  font-size:11px;font-weight:500;color:var(--text-secondary);border-radius:2px;
  white-space:nowrap;transition:background .1s, color .1s;
}
.seg-btn:hover{color:var(--text-primary)}
.seg-btn[aria-pressed="true"]{
  background:var(--layer-03);color:var(--text-primary);font-weight:600;
}
.seg-btn .n{font-variant-numeric:tabular-nums;color:var(--text-helper)}
.seg-btn[aria-pressed="true"] .n{color:var(--text-primary)}

.seg-btn[data-status="over"][aria-pressed="true"]{background:var(--tag-red-bg);color:var(--tag-red-fg)}
.seg-btn[data-status="soon"][aria-pressed="true"]{background:var(--tag-yellow-bg);color:var(--tag-yellow-fg)}
.seg-btn[data-status="done"][aria-pressed="true"]{background:var(--tag-green-bg);color:var(--tag-green-fg)}

.btn-mine{
  display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 8px;
  font-size:11px;background:var(--layer-01);border:1px solid var(--border-subtle);
  color:var(--text-secondary);border-radius:2px;white-space:nowrap;
}
.btn-mine:hover{color:var(--text-primary);border-color:var(--border-strong)}
.btn-mine.on{background:var(--layer-03);border-color:var(--interactive-light);color:var(--text-primary)}
.btn-mine .n{font-variant-numeric:tabular-nums;color:var(--text-helper)}

.tb-right{display:flex;align-items:center;gap:8px;flex:0 0 auto;margin-left:auto}

.view-switcher{display:inline-flex;height:28px;border:1px solid var(--border-subtle);background:var(--layer-01)}
.view-btn{
  display:inline-flex;align-items:center;gap:5px;padding:0 10px;font-size:11px;
  color:var(--text-secondary);border-right:1px solid var(--border-subtle);white-space:nowrap;
}
.view-btn:last-child{border-right:0}
.view-btn:hover{color:var(--text-primary);background:var(--hover-2)}
.view-btn[aria-pressed="true"]{background:var(--layer-03);color:var(--text-primary);font-weight:600}

.btn-filter-toggle{
  display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;
  font-size:11px;background:var(--layer-01);border:1px solid var(--border-subtle);
  color:var(--text-secondary);white-space:nowrap;
}
.btn-filter-toggle:hover{color:var(--text-primary);border-color:var(--border-strong)}
.btn-filter-toggle.has-active{border-color:var(--interactive);color:var(--interactive)}
.btn-filter-toggle .dot{width:6px;height:6px;border-radius:50%;background:var(--interactive)}

.btn-cta{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;
  background:var(--interactive);color:var(--text-on-color);font-size:12px;
  font-weight:500;white-space:nowrap;border-radius:2px;transition:background .11s;
}
.btn-cta:hover{background:var(--interactive-hover)}
.btn-cta:active{background:var(--interactive-active)}

.filter-drawer{
  display:flex;align-items:center;gap:8px;padding:6px 16px;background:var(--layer-01);
  border-bottom:1px solid var(--border-subtle);flex-wrap:wrap;font-size:12px;
}
.filter-drawer .sel select{
  height:28px;background:var(--layer-02);border:1px solid var(--border-subtle);
  padding:0 24px 0 8px;font-size:11px;color:var(--text-primary);
}
.filter-drawer .summary-info{margin-left:auto;font-size:11px;color:var(--text-helper)}

/* ==========================================================================
   Standort-Arbeitsliste mit Circular Progress Rings
   ========================================================================== */
.locs{padding-bottom:120px}
.loc{border-bottom:1px solid var(--border-subtle)}

.loc-head{
  display:grid;
  grid-template-columns: 52px 60px minmax(180px, 1.8fr) minmax(160px, 1.4fr) 150px 140px 76px;
  align-items:center;gap:8px;
  width:100%;min-height:var(--row-h);padding:0 12px 0 4px;
  background:var(--bg);text-align:left;border-left:3px solid transparent;cursor:pointer;
  transition:background .08s;
}
.locs > .loc:nth-child(even) > .loc-head{background:var(--row-alt)}
.loc-head:hover{background:var(--hover-2)}
.loc.open .loc-head{background:var(--layer-02);border-left-color:var(--interactive-light)}

.loc.is-overdue .loc-head{border-left-color:var(--error) !important}
.loc.is-soon .loc-head{border-left-color:var(--warning)}
.loc.is-finished .loc-head{opacity:.65;border-left-color:var(--success)}

.loc-caret{display:grid;place-items:center;color:var(--text-secondary);transition:transform .15s}
.loc.open .loc-caret{transform:rotate(90deg)}
.loc-nr{font-family:var(--mono);font-size:11px;color:var(--text-helper);padding:1px 4px;background:var(--layer-02);text-align:center;border-radius:2px}

.loc-title-col{display:flex;align-items:center;gap:8px;overflow:hidden;min-width:0}
.loc-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.urgency-badge{
  font-size:10px;font-weight:600;padding:1px 6px;border-radius:2px;white-space:nowrap;letter-spacing:.3px;
}
.urgency-badge.late{background:var(--tag-red-bg);color:var(--tag-red-fg)}
.urgency-badge.soon{background:var(--tag-yellow-bg);color:var(--tag-yellow-fg)}
.urgency-badge.done{background:var(--tag-green-bg);color:var(--tag-green-fg)}

.loc-preview-col{
  font-size:11px;color:var(--text-helper);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.loc-preview-col .more{color:var(--text-secondary);font-weight:500}

.loc-summary-col{
  font-size:11px;color:var(--text-secondary);font-variant-numeric:tabular-nums;white-space:nowrap;
}
.loc-summary-col b{color:var(--text-primary)}
.loc-summary-col .late-count{color:var(--error);font-weight:600}

/* Linearer Mini-Fortschrittsbalken je Standort (aus index2-Layout) */
.loc-progress-col{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-helper);font-variant-numeric:tabular-nums}
.loc-mini-track{flex:1 1 50px;height:4px;background:var(--layer-03);border-radius:2px;overflow:hidden}
.loc-mini-track > i{display:block;height:100%;background:var(--interactive-light)}
.loc.is-finished .loc-mini-track > i{background:var(--success)}

.loc-acts-col{display:flex;align-items:center;justify-content:flex-end;gap:2px}
.td-act{width:32px;height:32px;display:grid;place-items:center;color:var(--text-secondary);border-radius:2px}
.td-act:hover{background:var(--hover-2);color:var(--text-primary)}

/* Kind-Zeile */
.loc-rows{background:var(--bg)}
.loc-row{
  display:grid;
  grid-template-columns: 52px 60px minmax(180px, 1.8fr) minmax(160px, 1.4fr) 150px 140px 76px;
  align-items:center;gap:8px;
  min-height:36px;padding:0 12px 0 4px;
  border-bottom:1px solid var(--border-subtle);
}
.loc-rows > .loc-row:nth-child(even){background:var(--row-alt)}
.loc-row:last-child{border-bottom:0}
.loc-row:hover{background:var(--hover-1)}
.loc-row.done .c-main{color:var(--text-disabled)}
.loc-row.ist-todo{box-shadow:inset 3px 0 0 var(--border-strong)}

.loc-task{overflow:hidden;min-width:0}
.c-main{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.c-sub{display:block;font-size:11px;color:var(--text-helper);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loc-note{font-size:11px;color:var(--text-helper);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loc-due{font-size:11px;font-variant-numeric:tabular-nums;color:var(--text-secondary)}
.loc-user{font-size:11px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.tick{
  width:26px;height:26px;margin:auto;display:grid;place-items:center;
  border:1px solid var(--border-strong);background:transparent;color:transparent;
  border-radius:2px;transition:background .1s, border-color .1s, color .1s;
}
.tick:hover{border-color:var(--text-primary);color:var(--text-secondary);background:var(--hover-2)}
.tick.on{background:var(--interactive);border-color:var(--interactive);color:#ffffff}
.tick.on:hover{background:var(--interactive-hover)}
.tick svg{grid-area:1/1}
.tick .tk-undo{display:none}
.tick.on:hover .tk-check{display:none}
.tick.on:hover .tk-undo{display:block;color:#ffffff}

.ecell{display:flex;flex-direction:column;gap:1px;overflow:hidden}
.ecell-sub{font-size:10px;color:var(--text-helper);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ecell-note{font-size:11px;color:var(--text-secondary);border-left:2px solid var(--support-info);padding-left:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-note{font-size:11px;color:var(--link);display:inline-flex;align-items:center;gap:3px}

/* ==========================================================================
   Tabellen- & Zeitplanansichten
   ========================================================================== */
.tbl-wrap{padding:0 0 96px}
table.cds{width:100%;border-collapse:collapse;background:var(--bg)}
table.cds thead th{
  position:sticky;top:0;z-index:var(--z-sticky);background:var(--layer-02);
  border-bottom:1px solid var(--border-subtle);text-align:left;white-space:nowrap;
  height:36px;padding:0 12px;font-size:12px;font-weight:600;color:var(--text-primary);vertical-align:middle;
}
table.cds thead th.sortable{cursor:pointer}
table.cds thead th.sortable:hover{background:var(--hover-2)}
table.cds thead th .sortic{margin-left:6px;vertical-align:-2px;color:var(--text-helper);opacity:0;transition:opacity .1s}
table.cds thead th.sortable:hover .sortic{opacity:1}
table.cds thead th[aria-sort] .sortic{opacity:1;color:var(--text-primary)}
table.cds tbody tr{background:var(--bg);border-bottom:1px solid var(--border-subtle)}
table.cds tbody tr:nth-child(even){background:var(--row-alt)}
table.cds tbody tr:hover{background:var(--hover-1)}
table.cds td{height:36px;padding:0 12px;vertical-align:middle;font-size:12px}

.plan{padding-bottom:32px}
.plan-sec{border-bottom:1px solid var(--border-subtle)}
.plan-head{
  display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 16px;
  background:var(--layer-01);border-left:3px solid transparent;cursor:pointer;
}
.plan-head:hover{background:var(--hover-2)}
.plan-sec.open .plan-head{border-left-color:var(--interactive-light);background:var(--layer-02)}
.plan-caret{display:grid;place-items:center;color:var(--text-secondary);transition:transform .15s}
.plan-sec.open .plan-caret{transform:rotate(90deg)}
.plan-sub{font-size:11px;color:var(--text-helper);margin-left:auto}

/* ==========================================================================
   Responsive Regeln
   ========================================================================== */
@media (max-width:1240px){
  .loc-head, .loc-row{
    grid-template-columns: 44px 50px minmax(160px, 1.8fr) minmax(130px, 1fr) 130px 110px 76px;
  }
}
@media (max-width:980px){
  .loc-head, .loc-row{
    grid-template-columns: 44px 50px 1fr 120px 100px 76px;
  }
  .loc-preview-col, .loc-note{display:none}
}
@media (max-width:768px){
  .shell-header{padding:0 8px;gap:6px}
  .toolbar-row{padding:0 8px;gap:6px}
  .loc-head, .loc-row{
    grid-template-columns: 36px 44px 1fr 90px 40px;
  }
  .loc-summary-col, .loc-user, .loc-acts-col > .td-act:first-child{display:none}
  
  .btn-cta{
    position:fixed;bottom:20px;right:20px;z-index:var(--z-overlay);
    height:44px;padding:0 16px;border-radius:22px;box-shadow:var(--shadow-2);
  }
}

/* Carbon Overlays, Dialoge & Drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:var(--z-overlay)}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--layer-01);
  border-left:1px solid var(--border-subtle);z-index:calc(var(--z-overlay) + 1);display:flex;flex-direction:column}
.panel > header{height:var(--hdr-h);display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--border-subtle);background:var(--layer-01)}
.panel > header h2{font-size:15px;font-weight:600;flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel .body{flex:1 1 auto;overflow:auto;padding:16px}
.panel .foot{flex:0 0 auto;border-top:1px solid var(--border-subtle);padding:12px 16px;display:flex;gap:8px;align-items:center;background:var(--layer-01)}
.sect{margin-bottom:20px}
.sect > h3{font-size:11px;color:var(--text-helper);margin-bottom:8px;display:flex;align-items:center;gap:12px}
.sect > h3::after{content:"";flex:1 1 auto;height:1px;background:var(--border-subtle)}
.row{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:6px 0;border-bottom:1px solid var(--border-subtle);font-size:12px}
.row dt{color:var(--text-helper)}
.row dd{font-size:13px;word-break:break-word}
.row dd.empty-val{color:var(--text-placeholder)}
.notice{display:flex;gap:10px;padding:10px 12px;background:var(--hover-1);border-left:3px solid var(--info);font-size:12px;color:var(--text-secondary);margin-bottom:14px}
.notice svg{flex:0 0 auto;color:var(--info);margin-top:2px}

.fld{margin-bottom:12px}
.fld > label{display:block;font-size:11px;color:var(--text-secondary);margin-bottom:4px}
.inp{width:100%;height:32px;padding:0 10px;background:var(--field);border:0;border-bottom:1px solid var(--border-strong);color:var(--text-primary);font-size:12px;outline:none}
.inp:focus{outline:2px solid var(--focus);outline-offset:-2px}
textarea.inp{height:auto;min-height:64px;padding:8px 10px;resize:vertical}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.tgl-row{display:flex;align-items:flex-start;gap:16px;padding:12px 0}
.tgl-row .t{flex:1 1 auto}
.tgl-row .t b{display:block;font-size:13px;line-height:18px}
.tgl-row .t span{font-size:11px;color:var(--text-helper)}
.tgl{position:relative;width:44px;height:22px;background:var(--layer-03);border-radius:11px;flex:0 0 auto;transition:background .15s;margin-top:2px}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--text-primary);transition:transform .15s}
.tgl[aria-checked="true"]{background:var(--interactive)}
.tgl[aria-checked="true"]::after{transform:translateX(22px)}

.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.preset{height:28px;padding:0 10px;background:var(--layer-03);border:1px solid var(--border-subtle);font-size:11px;color:var(--text-secondary);text-align:left}
.preset:hover{border-color:var(--interactive-light);color:var(--text-primary)}
.preset.on{background:var(--sel-bg);border-color:var(--interactive-light);color:var(--sel-fg)}

.modal-scrim{position:fixed;inset:0;background:var(--scrim);z-index:calc(var(--z-overlay) + 2);display:grid;place-items:center;padding:16px}
.modal{background:var(--layer-02);border:1px solid var(--border-subtle);width:min(500px,100%);display:flex;flex-direction:column;box-shadow:var(--shadow-2);max-height:100%}
.modal > header{display:flex;align-items:center;gap:16px;padding:12px 16px;border-bottom:1px solid var(--border-subtle)}
.modal > header h3{font-size:16px;font-weight:600;flex:1 1 auto}
.modal .body{padding:16px;overflow:auto}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--border-subtle)}
.modal .close{width:32px;height:32px;display:grid;place-items:center;color:var(--text-secondary)}
.modal .close:hover{background:var(--hover-2);color:var(--text-primary)}

.toasts{position:fixed;right:16px;bottom:16px;z-index:var(--z-toast);display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{pointer-events:auto;width:min(360px,calc(100vw - 32px));background:var(--layer-02);border:1px solid var(--border-subtle);border-left:3px solid var(--info);padding:10px 12px;display:flex;gap:8px;align-items:flex-start;box-shadow:var(--shadow-2)}
.toast.success{border-left-color:var(--success)}
.toast.warning{border-left-color:var(--warning)}
.toast.error{border-left-color:var(--error)}
.toast .txt{flex:1 1 auto;font-size:12px}
.toast .txt small{display:block;font-size:11px;color:var(--text-helper);margin-top:2px}
.toast .x{color:var(--text-secondary);width:20px;height:20px;display:grid;place-items:center}

.app-foot{flex:0 0 auto;height:24px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-top:1px solid var(--border-subtle)}
.app-foot .hdr-status{display:flex;align-items:center;gap:6px}
.app-foot .hdr-status .led{width:6px;height:6px;border-radius:50%;background:var(--success)}
.app-foot .hdr-status.api .led{background:var(--info)}
.app-foot .hdr-status.offline .led{background:var(--error)}
.app-foot .hdr-status.busy .led{background:var(--warning)}
.app-foot .hdr-status span{font-size:11px;color:var(--text-helper)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;font-size:12px;border:1px solid transparent;white-space:nowrap}
.btn-primary{background:var(--interactive);color:var(--text-on-color)}
.btn-primary:hover{background:var(--interactive-hover)}
.btn-secondary{background:var(--layer-03);color:var(--text-on-color)}
.btn-secondary:hover{background:var(--hover-2)}
.btn-tertiary{background:transparent;border-color:var(--interactive-light);color:var(--link)}
.btn-tertiary:hover{background:var(--interactive);border-color:var(--interactive);color:var(--text-on-color)}
.btn-ghost{background:transparent;color:var(--link)}
.btn-ghost:hover{background:var(--hover-2);color:var(--text-primary)}
.btn-sm{height:28px;padding:0 8px;font-size:11px}
.btn-danger{background:#da1e28;color:#fff}
.btn[disabled]{opacity:.4;pointer-events:none}

.combo{position:relative;width:100%}
.combo-field{display:flex;align-items:center;flex-wrap:wrap;gap:4px;min-height:30px;padding:2px 28px 2px 8px;background:var(--field);border-bottom:1px solid var(--border-strong);cursor:text}
.combo-input{flex:1 1 60px;border:0;background:none;outline:none;font-size:11px;color:var(--text-primary)}
.combo-chips{display:flex;flex-wrap:wrap;gap:4px}
.combo-chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 4px 0 6px;background:var(--interactive);color:#fff;font-size:10px;border-radius:10px}
.combo-x{display:grid;place-items:center;width:12px;height:12px;border-radius:50%;color:inherit}
.combo-list{position:absolute;left:0;right:0;top:100%;z-index:30;max-height:200px;overflow:auto;background:var(--layer-02);border:1px solid var(--border-subtle);box-shadow:var(--shadow-2)}
.combo-opt{display:block;width:100%;text-align:left;padding:6px 10px;font-size:11px;color:var(--text-primary)}
.combo-opt:hover,.combo-opt.on{background:var(--hover-2)}
.combo-carets{position:absolute;right:8px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--text-secondary)}

.menu{position:absolute;top:var(--hdr-h);right:12px;min-width:220px;background:var(--layer-02);border:1px solid var(--border-subtle);z-index:var(--z-header);padding:4px 0;box-shadow:var(--shadow-2)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 14px;font-size:12px;color:var(--text-primary);text-align:left}
.menu button:hover{background:var(--hover-2)}
.menu .sep{height:1px;background:var(--border-subtle);margin:4px 0}

.atts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.atts li{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--layer-01);border:1px solid var(--border-subtle);flex-wrap:wrap}
.att{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--link);min-width:0;flex:1 1 auto}
.att span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-meta{font-size:11px;color:var(--text-helper);white-space:nowrap}
</style>
</head>

  if (n <= CONFIG.soonDays) return { text: 'noch ' + n + ' T', cls: 'soon' };
  return { text: 'noch ' + n + ' T', cls: 'ok' };
}

function statusOf(it) {
  if (it.erledigt) return 'done';
  const bis = parseDate(it.bis), ab = parseDate(it.ab), t = today();
  if (bis && bis < t) return 'over';
  if (bis && dayDiff(bis, t) <= CONFIG.soonDays) return 'soon';
  if (ab && ab > t) return 'plan';
  return 'open';
}

const uniq = (a) => Array.from(new Set(a.filter(v => v !== undefined && v !== null && String(v).trim() !== '')))
  .sort((x, y) => String(x).localeCompare(String(y), 'de'));

function download(name, text, mime = 'application/json') {
  const url = URL.createObjectURL(new Blob([text], { type: mime + ';charset=utf-8' }));
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

function toast(text, { tone = 'info', detail = '', ms = 4000, action, actionLabel } = {}) {
  const el = document.createElement('div');
  el.className = 'toast ' + tone;
  const ico = { success: ICON.check, warning: ICON.warn, error: ICON.warn, info: ICON.info }[tone] || ICON.info;
  el.innerHTML = '<span class="ti">' + svg(ico, 14) + '</span>' +

    '<button class="x" aria-label="Schließen">' + svg(ICON.close, 12) + '</button>';
  if (action) el.querySelector('.act').onclick = () => { action(); el.remove(); };

function modal({ title, bodyHtml, primary = 'Speichern', secondary = 'Abbrechen', danger = false,
                 collect, validate, onMount, tertiary, onTertiary }) {
  return new Promise(resolve => {
    const scrim = document.createElement('div');
    scrim.className = 'modal-scrim';
    scrim.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true">' +
        '<header><h3>' + esc(title) + '</h3>' +
          '<button class="close" data-x aria-label="Schließen">' + svg(ICON.close, 16) + '</button></header>' +
        '<div class="body">' + bodyHtml + '</div>' +
        '<div class="foot">' +
          (tertiary ? '<button class="btn btn-ghost" data-tertiary>' + esc(tertiary) + '</button>' : '') +
          '<span style="flex:1"></span>' +
          (secondary ? '<button class="btn btn-tertiary" data-cancel>' + esc(secondary) + '</button>' : '') +
          '<button class="btn ' + (danger ? 'btn-danger' : 'btn-primary') + '" data-ok>' + esc(primary) + '</button>' +
        '</div>' +
      '</div>';
    const done = (v) => { scrim.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
    const tryOk = () => {
      const data = collect ? collect(scrim) : null;
      const err = validate ? validate(data) : null;
      if (err) { toast(err, { tone: 'warning' }); return; }
      done(data);
    };
    const onKey = (e) => {
      if (e.key === 'Escape') { e.stopPropagation(); done(null); }
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); tryOk(); }
    };
    scrim.addEventListener('click', e => {
      if (e.target === scrim || e.target.closest('[data-x]') || e.target.closest('[data-cancel]')) done(null);
      else if (e.target.closest('[data-tertiary]')) {
        if (onTertiary && onTertiary(scrim) === false) return;
        tryOk();
      }
      else if (e.target.closest('[data-ok]')) tryOk();
    });
    document.addEventListener('keydown', onKey);
    $('#overlay').appendChild(scrim);
    if (onMount) onMount(scrim);
    else { const f = scrim.querySelector('input,textarea'); if (f) setTimeout(() => f.focus(), 30); }
  });
}

const DEFAULT_FIELDS = {
  objekt_art: 'Standorte', objekt_nr: '', objekt_name: '', beschreibung: '', taetigkeit: '',
  kommentar: '', intervall: '', ab: '', bis: '', zustaendig: '', erledigt: false, erledigt_am: '',
  erledigt_durch: '', erledigt_notiz: '', external_id: '', hash_key: ''
};

const normalize = (r, idx) => Object.assign({}, DEFAULT_FIELDS, r, {
  id: r.id ?? (idx + 1),
  erledigt: r.erledigt === true || r.erledigt === 1 || r.erledigt === '1' || r.erledigt === 'true'
});

const asRecords = (x) => Array.isArray(x) ? x : (x && Array.isArray(x.records) ? x.records : null);
const isoToDe = (s) => {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s ?? '').trim());
  return m ? m[3] + '.' + m[2] + '.' + m[1] : '';
};
const intervallText = (monate, typ) => {
  if (!monate) return '';
  const t = monate % 12 === 0 ? (monate / 12) + (monate === 12 ? ' Jahr' : ' Jahre') : monate + ' Monate';
  return 'alle ' + t + (typ === 'fest' ? ' (fest)' : ' (variabel)');
};
/** Verschachtelter Export (site/task/schedule/execution) → flaches Arbeitsmodell. */
function fromExport(r, idx) {
  const site = r.site || {}, task = r.task || {}, sch = r.schedule || {}, ex = r.execution || {};
  const done = String(ex.status || 'OPEN').toUpperCase() !== 'OPEN';
  return normalize({
    id: idx + 1,
    objekt_art: site.type || 'Standorte',
    objekt_nr: site.id || '',
    objekt_name: site.name || '',
    beschreibung: '',
    taetigkeit: task.activity || '',
    kommentar: task.maintenanceComment || '',
    intervall: intervallText(task.intervalMonths, task.intervalType),
    ab: isoToDe(sch.dueDateStart),
    bis: isoToDe(sch.dueDateEnd),
    zustaendig: sch.assignedTo || '',
    erledigt: done,
    erledigt_am: isoToDe(ex.completedAt),
    erledigt_durch: ex.completedBy || '',
    erledigt_notiz: ex.completionComment || '',
    external_id: r.id || '',
    hash_key: r.hashKey || ''
  });
}
const seedData = () => {
  const ext = asRecords(globalThis.WARTUNGSDATEN);
  if (ext && ext.length) {
    const nested = !!(ext[0] && ext[0].site && ext[0].task && ext[0].schedule);
    return nested ? ext.map(fromExport) : ext.map(normalize);
  }
  try { return JSON.parse($('#seed').textContent).map(normalize); } catch (e) { return []; }
};
const hasDataFile = () => { const e = asRecords(globalThis.WARTUNGSDATEN); return !!(e && e.length); };

/** Signatur der Stammdaten, um den Cache bei geaenderten Daten zu verwerfen. */
const dataSignature = () => {
  const d = globalThis.WARTUNGSDATEN;
  if (!d || typeof d !== 'object') return '';
  const arr = asRecords(d) || [];
  return [d.exportedAt || '', d.totalRecords || arr.length, arr.length].join('|');
};

/** Schluessel zum Abgleich alter/neuer Datensaetze (Erledigungsstand uebernehmen). */
const matchKey = (r) => {
  if (r.external_id) return 'ext:' + r.external_id;
  if (r.hash_key) return 'hash:' + r.hash_key;
  const k = [r.objekt_nr, r.taetigkeit, r.ab].join('||');
  return k.replace(/\|/g, '') ? 'cmp:' + k : '';
};

/** Nutzerseitige Erledigungen aus dem alten Cache auf die neuen Datensaetze uebertragen. */
function carryCompletion(oldItems, newItems) {
  const byKey = new Map();
  for (const o of oldItems) {
    const k = matchKey(o);
    if (k) byKey.set(k, o);
  }
  for (const n of newItems) {
    const o = byKey.get(matchKey(n));
    if (!o || o.erledigt !== true) continue;
    n.erledigt = true;
    n.erledigt_am = o.erledigt_am || n.erledigt_am;
    n.erledigt_durch = o.erledigt_durch || n.erledigt_durch;
    n.erledigt_notiz = o.erledigt_notiz || n.erledigt_notiz;
  }
  return newItems;
}

const LocalStore = {
  label: 'Lokaler Testbestand',
  persist(items, sig) {
    try {
      localStorage.setItem(CONFIG.storageKey, JSON.stringify({
        v: 4, quelle: hasDataFile() ? 'datei' : 'test', sig: sig || '',
        saved: new Date().toISOString(), items
      }));
    } catch (e) {}
  },
  async load() {
    let cached = null;
    try {
      const raw = localStorage.getItem(CONFIG.storageKey);
      if (raw) {
        const p = JSON.parse(raw);
        if (p && Array.isArray(p.items)) cached = p;
      }
    } catch (e) {}
    const sig = dataSignature();
    // Ohne Stammdatendatei bleibt der Cache massgeblich (reiner Testbestand).
    if (cached && !sig) return { items: cached.items.map(normalize), fresh: false };
    // Daten unveraendert -> Cache verwenden.
    if (cached && cached.sig === sig) return { items: cached.items.map(normalize), fresh: false };
    // Erstbezug oder Datenquelle geaendert -> neu einlesen, Erledigungen retten.
    const items = cached ? carryCompletion(cached.items.map(normalize), seedData()) : seedData();
    this.persist(items, sig);
    return { items, fresh: true };
  },
  async complete(id, patch) {
    const raw = localStorage.getItem(CONFIG.storageKey);
    let p;
    try { p = JSON.parse(raw); } catch { p = null; }
    if (!p || !Array.isArray(p.items)) p = { items: seedData() };
    const it = p.items.find(x => String(x.id) === String(id));
    if (!it) throw new Error('Position nicht gefunden');
    Object.assign(it, patch);
    this.persist(p.items, dataSignature());
    return normalize(it);
  },
  async loadTodos() {
    try {
      const a = JSON.parse(localStorage.getItem(CONFIG.storageKey + '.todos') || '[]');
      if (Array.isArray(a)) return a.map(normalizeTodo);
    } catch (e) {}
    return [];
  },
  async saveTodo(t) {
    const list = await this.loadTodos();
    const i = list.findIndex(x => String(x.id) === String(t.id));
    const rec = Object.assign({}, t);
    if (t.id == null || i < 0) {
      rec.id = list.reduce((m, x) => Math.max(m, Number(x.id) || 0), 0) + 1;
      list.push(rec);
    } else {
      list[i] = Object.assign(list[i], rec);
    }
    localStorage.setItem(CONFIG.storageKey + '.todos', JSON.stringify(list));
    return list.find(x => String(x.id) === String(rec.id));
  },
  async removeTodo(id) {
    const list = (await this.loadTodos()).filter(x => String(x.id) !== String(id));
    localStorage.setItem(CONFIG.storageKey + '.todos', JSON.stringify(list));
    return true;
  }
};

const ApiStore = {
  label: 'SQL-Backend',
  url: (p) => CONFIG.apiBase.replace(/\/$/, '') + p,

    const res = await fetch(this.url(path), { headers: { 'Content-Type': 'application/json' }, ...opts });

  },

    const items = await this.req('/items');

  },

        }).then(resolve, reject);
      };
      fr.readAsDataURL(file);
    });
  },
  removeAttachment(art, id, anhangId) {

      '/anhaenge/' + encodeURIComponent(anhangId), { method: 'DELETE' });

  attachmentUrl(art, id, anhangId) {

      '/anhaenge/' + encodeURIComponent(anhangId) + '/datei');
  },
  async loadTodos() {
    const a = await this.req('/todos');
    return (Array.isArray(a) ? a : []).map(normalizeTodo);
  },
  async saveTodo(t) {
    const body = JSON.stringify(t);
    const r = t.id == null
      ? await this.req('/todos', { method: 'POST', body })
      : await this.req('/todos/' + encodeURIComponent(t.id), { method: 'PUT', body });
    return normalizeTodo(r);
  },

  }
};

const TODO_MARK = '__toDo';
function markToDo(t) {
  if (t) Object.defineProperty(t, TODO_MARK, { value: true, enumerable: false, writable: true, configurable: true });
  return t;
}
const istToDo = (x) => !!(x && x[TODO_MARK]);
const keyOf = (x) => (istToDo(x) ? 't' : 'w') + ':' + x.id;
function findByKey(key) {
  const s = String(key || ''), id = s.slice(2);
  return s.slice(0, 1) === 't'
    ? state.todos.find(x => String(x.id) === id)
    : state.items.find(x => String(x.id) === id);
}

function statusMatch(it, s) {
  if (s === 'alle') return true;
  if (s === 'open') return !it.erledigt;
  if (s === 'done') return !!it.erledigt;
  return statusOf(it) === s;
}

function filtered(srcList) {
  const q = norm(state.query);
  return srcList.filter(it => {
    if (!matchesQuery(it, q)) return false;
    if (state.art && it.objekt_art !== state.art) return false;
    if (state.objekt && it.objekt_name !== state.objekt) return false;
    if (state.taetigkeit && it.taetigkeit !== state.taetigkeit) return false;
    if (state.personen.length && !state.personen.includes(it.zustaendig)) return false;
    if (state.mine && (!state.user || norm(it.zustaendig) !== norm(state.user))) return false;
    if (!statusMatch(it, state.status)) return false;
    return true;
  });
}

function aktuelleListe() {
  let list = [];
  if (state.bereich === 'todo') list = state.todos.map(markToDo);
  else if (state.bereich === 'wartung') list = state.items;
  else list = state.items.concat(state.todos.map(markToDo));
  return filtered(list);
}

function countsForScope(scope) {
  let list = [];
  if (scope === 'todo') list = state.todos;
  else if (scope === 'wartung') list = state.items;
  else list = state.items.concat(state.todos);

  const c = { alle: list.length, done: 0, over: 0, soon: 0, open: 0, mine: 0 };
  for (const it of list) {
    const s = statusOf(it);
    if (s === 'over') c.over++;
    else if (s === 'soon') c.soon++;
    if (it.erledigt) c.done++;
    else c.open++;
    if (!it.erledigt && state.user && norm(it.zustaendig) === norm(state.user)) c.mine++;
  }
  return c;
}

const groupKey = (it) => (it.objekt_nr || '') + '|' + (it.objekt_name || '');
function filteredGroups(list) {
  const m = new Map();
  for (const it of list) {
    const k = (it.objekt_nr || it.objekt_name) ? groupKey(it) : '~ohne';
    if (!m.has(k)) m.set(k, { nr: it.objekt_nr || '', name: it.objekt_name || 'Ohne Standortbezug', items: [] });
    m.get(k).items.push(it);
  }
  return Array.from(m.entries());
}

function locRank(g) {
  let over = 0, soon = 0, open = 0;
  for (const it of g.items) {
    if (it.erledigt) continue;
    const s = statusOf(it);
    if (s === 'over') over++; else if (s === 'soon') soon++; else open++;
  }
  return { over, soon, open };
}

function erledigtInfo(it) {
  if (!it.erledigt) return '<span class="loc-user">' + esc(it.zustaendig || '–') + '</span>';
  const note = String(it.erledigt_notiz || '').trim();
  return '<div class="ecell"><span class="ecell-sub">' + esc(it.erledigt_am || '') + ' · ' + esc(it.erledigt_durch || 'Erledigt') + '</span>' +
    (note ? '<span class="ecell-note" title="' + esc(note) + '">' + esc(note) + '</span>' : '<button class="btn-note" data-note="' + esc(keyOf(it)) + '">' + svg(ICON.notes, 11) + ' Notiz</button>') +
    '</div>';

function dueCell(it) {
  const s = statusOf(it), d = dueInfo(it.bis);
  return '<div class="loc-due"><span class="c-main">' + esc(it.bis || '–') + '</span><span class="c-sub ' + (s === 'over' ? 'due late' : (s === 'soon' ? 'due soon' : '')) + '">' + esc(d.text) + '</span></div>';
}

function linearProgress(pct) {
  const w = Math.max(0, Math.min(100, pct));
  return '<div class="loc-mini-track"><i style="width:' + w + '%"></i></div>';
}

function viewLocations(list) {
  const groups = filteredGroups(list);
  const byNr = (a, b) => (a[1].nr || '').localeCompare(b[1].nr || '', 'de', { numeric: true });
  
  if (state.sort === 'loc-nr') groups.sort(byNr);
  else groups.sort((a, b) => {
    const ra = locRank(a[1]), rb = locRank(b[1]);
    const aDone = (ra.open + ra.over + ra.soon === 0) ? 1 : 0;
    const bDone = (rb.open + rb.over + rb.soon === 0) ? 1 : 0;
    if (aDone !== bDone) return aDone - bDone;
    return (rb.over - ra.over) || (rb.soon - ra.soon) || (rb.open - ra.open) || byNr(a, b);
  });

  return '<div class="locs">' + groups.map(([k, g]) => {
    const r = locRank(g);
    const done = g.items.filter(i => i.erledigt).length;
    const pct = Math.round(done / g.items.length * 100);
    const isOpen = state.expanded.has(k);
    const isFinished = done === g.items.length;
    const isOverdue = r.over > 0;
    const isSoon = !isOverdue && r.soon > 0;

    let cls = 'loc';
    if (isOpen) cls += ' open';
    if (isOverdue) cls += ' is-overdue';
    else if (isSoon) cls += ' is-soon';
    else if (isFinished) cls += ' is-finished';

    const openTasks = g.items.filter(i => !i.erledigt && i.taetigkeit).map(i => i.taetigkeit);
    const preview = openTasks.length ? esc(openTasks.slice(0, 2).join(' · ')) + (openTasks.length > 2 ? ' <span class="more">+' + (openTasks.length - 2) + '</span>' : '') : 'Alle erledigt';
    const rows = g.items.map(it => workRow(it, false)).join('');

    return '<section class="' + cls + '">' +
      '<div class="loc-head" data-loc="' + esc(k) + '" role="button" tabindex="0">' +
        '<span class="loc-caret">' + svg(ICON.chevR, 14) + '</span>' +
        '<span class="loc-nr">' + esc(g.nr || '–') + '</span>' +
        '<div class="loc-title-col">' +
          '<span class="loc-name">' + esc(g.name) + '</span>' +
          (isOverdue ? '<span class="urgency-badge late">' + r.over + ' überfällig</span>' : '') +
          (isSoon ? '<span class="urgency-badge soon">' + r.soon + ' bald</span>' : '') +
          (isFinished ? '<span class="urgency-badge done">Erledigt</span>' : '') +
        '</div>' +
        '<span class="loc-preview-col">' + preview + '</span>' +
        '<div class="loc-summary-col"><b>' + (g.items.length - done) + '/' + g.items.length + ' offen</b>' + (r.over ? ' · <span class="late-count">' + r.over + ' überfällig</span>' : '') + '</div>' +
        '<div class="loc-progress-col">' + linearProgress(pct) + '<span>' + done + '/' + g.items.length + '</span></div>' +
        '<div class="loc-acts-col"><button class="td-act" data-termloc="' + esc(k) + '" title="Sammeltermin disponieren">' + svg(ICON.calendar, 15) + '</button></div>' +
      '</div>' +
      (isOpen ? '<div class="loc-rows">' + rows + '</div>' : '') +
    '</section>';
  }).join('') + '</div>';
}

function workRow(it, showObject) {
  const k = esc(keyOf(it));
  return '<div class="loc-row' + (it.erledigt ? ' done' : '') + (istToDo(it) ? ' ist-todo' : '') + '" data-id="' + k + '">' +
    tickControl(it) +
    '<span class="loc-nr" style="opacity:.6">' + esc(it.objekt_nr || '') + '</span>' +
    '<div class="loc-task"><span class="c-main" title="' + esc(it.taetigkeit) + '">' + esc(it.taetigkeit || '–') + '</span>' + (showObject ? '<span class="c-sub">' + esc(it.objekt_name) + '</span>' : '') + '</div>' +
    '<span class="loc-note" title="' + esc(it.kommentar) + '">' + esc(it.kommentar || '–') + '</span>' +
    dueCell(it) +
    erledigtInfo(it) +
    '<div class="loc-acts-col">' +
      '<button class="td-act" data-term="' + k + '" title="Termin planen">' + svg(ICON.calendar, 14) + '</button>' +
      (istToDo(it) ? '<button class="td-act" data-todoedit="' + k + '" title="Bearbeiten">' + svg(ICON.edit, 14) + '</button>' : '<button class="td-act" data-open="' + k + '" title="Details">' + svg(ICON.chevR, 14) + '</button>') +

}

function viewTable(list) {
  const rows = list.map(it => {
    const k = esc(keyOf(it));
    return '<tr data-id="' + k + '" class="' + (it.erledigt ? 'done' : '') + '">' +

const PLAN_GROUPS = [
  { key: 'over', label: 'Überfällig', tone: 'late' },
  { key: 'soon', label: 'Bald fällig', tone: 'soon' },
  { key: 'open', label: 'Im Zeitraum', tone: '' },
  { key: 'done', label: 'Erledigt', tone: 'done' }
];

function viewTimeline(list) {
  const buckets = new Map();
  for (const it of list) {
    const k = statusOf(it);
    if (!buckets.has(k)) buckets.set(k, []);
    buckets.get(k).push(it);
  }
  return '<div class="plan">' + PLAN_GROUPS.filter(g => buckets.has(g.key)).map(g => {
    const items = buckets.get(g.key);
    const open = !state.collapsed.has('plan:' + g.key);
    return '<section class="plan-sec' + (open ? ' open' : '') + '">' +
      '<button class="plan-head" data-plan="' + g.key + '"><span class="plan-caret">' + svg(ICON.chevR, 14) + '</span><span class="urgency-badge ' + g.tone + '">' + g.label + '</span><span class="plan-sub">' + items.length + ' Positionen</span></button>' +
      (open ? '<div class="loc-rows">' + items.map(i => workRow(i, true)).join('') + '</div>' : '') +
    '</section>';
  }).join('') + '</div>';
}

function openPanel(id, opts = {}) {
  const it = state.items.find(x => String(x.id) === String(id));
  if (!it) return;
  state.panelId = String(id);

  const s = statusOf(it), d = dueInfo(it.bis);
  const val = (v, mono) => v ? '<dd' + (mono ? ' class="t-mono"' : '') + '>' + esc(v) + '</dd>' : '<dd class="empty-val">nicht angegeben</dd>';
  const line = (label, v, mono) => '<div class="row"><dt>' + label + '</dt>' + val(v, mono) + '</div>';

  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML =
    '<div class="panel" role="dialog" aria-modal="true" aria-label="Details zur Wartungsposition">' +
      '<header>' +
        '<h2>' + esc(it.objekt_name || 'Wartungsposition') + '</h2>' +
        '<button class="td-act" data-x aria-label="Schließen">' + svg(ICON.close, 16) + '</button>' +
      '</header>' +
      '<div class="body">' +
        '<div class="notice">' + svg(ICON.info, 16) + '<span>Stammdaten sind schreibgeschützt und werden in der Datenbank gepflegt. Änderbar sind Erledigung und Notiz.</span></div>' +
        '<div class="sect"><h3>Objekt</h3>' +
          line('Objektart', it.objekt_art) +
          line('Objekt-Nr.', it.objekt_nr, true) +
          line('Objektname', it.objekt_name) +
        '</div>' +
        '<div class="sect"><h3>Auftrag</h3>' +
          line('Tätigkeit', it.taetigkeit) +
          line('Beschreibung', it.beschreibung) +
          line('Kommentar', it.kommentar) +
          line('Frist bis', it.bis, true) +
          '<div class="row"><dt>Friststatus</dt><dd><span class="due ' + d.cls + '">' + esc(d.text) + '</span></dd></div>' +
          line('Zuständig', it.zustaendig) +
        '</div>' +
        '<div class="sect"><h3>Erledigung</h3>' +
          '<div class="tgl-row">' +
            '<div class="t"><b>Erledigt</b><span>Datum und Person werden protokolliert</span></div>' +
            '<button class="tgl" role="switch" aria-checked="' + !!it.erledigt + '" id="panelDone"></button>' +
          '</div>' +
          '<div id="doneFields" style="display:' + (it.erledigt ? 'block' : 'none') + '">' +
            '<div class="row"><dt>Erledigt am</dt><dd id="pDoneAm" class="t-mono">' + esc(it.erledigt_am || '–') + '</dd></div>' +
            '<div class="row"><dt>Erledigt durch</dt><dd id="pDoneBy">' + esc(it.erledigt_durch || '–') + '</dd></div>' +
            '<div class="fld" style="margin-top:12px">' +
              '<label for="panelNote">Notiz / Feststellung</label>' +
              '<textarea class="inp" id="panelNote" placeholder="z. B. RCD defekt">' + esc(it.erledigt_notiz || '') + '</textarea>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="sect"><h3>Anhänge</h3><div id="panelAtt"></div></div>' +
      '</div>' +
      '<div class="foot">' +
        '<button class="btn btn-tertiary" id="panelTermin">' + svg(ICON.calendar, 14) + 'Termin planen</button>' +
        '<span style="flex:1"></span>' +
        '<button class="btn btn-tertiary" data-x>Schließen</button>' +
        '<button class="btn btn-primary" id="panelSave" disabled>Notiz speichern</button>' +
      '</div>' +
    '</div>';

  const close = () => { scrim.remove(); state.panelId = null; document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
  document.addEventListener('keydown', onKey);

  scrim.addEventListener('click', async (e) => {
    if (e.target === scrim || e.target.closest('[data-x]')) return close();
    if (e.target.closest('#panelDone')) {
      const now = !state.items.find(x => String(x.id) === String(id)).erledigt;
      if (now && !await ensureUser()) return;
      if (now) {
        const data = await completionDialog(state.items.find(x => String(x.id) === String(id)));
        if (!data) return;
        await apply(id, data, scrim);
      } else {
        await apply(id, { erledigt: false, erledigt_am: '', erledigt_durch: '' }, scrim);
      }
    }
    if (e.target.closest('#panelSave')) {
      const v = scrim.querySelector('#panelNote').value;
      await finish(id, { erledigt_notiz: v });
      scrim.querySelector('#panelSave').disabled = true;
    }
    if (e.target.closest('#panelTermin')) dispatchTermin(findByKey('w:' + id));
  });

  async function apply(pid, patch, scope) {
    const updated = await finish(pid, patch);
    if (!updated) return;
    scope.querySelector('#panelDone').setAttribute('aria-checked', String(!!updated.erledigt));
    scope.querySelector('#doneFields').style.display = updated.erledigt ? 'block' : 'none';
    scope.querySelector('#pDoneAm').textContent = updated.erledigt_am || '–';
    scope.querySelector('#pDoneBy').textContent = updated.erledigt_durch || '–';
    if (!updated.erledigt) scope.querySelector('#panelNote').value = '';
    scope.querySelector('#panelSave').disabled = true;
  }

  const ta = scrim.querySelector('#panelNote');
  ta.addEventListener('input', () => { scrim.querySelector('#panelSave').disabled = ta.value === (it.erledigt_notiz || ''); });

  $('#overlay').appendChild(scrim);
  renderAttachments(scrim, 'wartung', id);
  setTimeout(() => {
    if (opts.focusNote && it.erledigt) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  }, 30);
}

const fmtBytes = (n) => {
  n = Number(n) || 0;
  return n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(0) + ' kB' : (n / 1048576).toFixed(1) + ' MB';
};

async function renderAttachments(scope, art, id) {
  const host = scope.querySelector('#panelAtt');
  if (!host) return;

  if (!store.supportsAttachments) {
    host.innerHTML = '<div class="t-helper">Anhänge benötigen das SQL-Backend.</div>';
    return;
  }
  host.innerHTML = '<div class="t-helper">Lade Anhänge …</div>';
  let list;
  try { list = (await store.listAttachments(art, id)) || []; } catch (e) { list = []; }

  host.innerHTML = (list.length
    ? '<ul class="atts">' + list.map(a =>
        '<li><a class="att" href="' + esc(store.attachmentUrl(art, id, a.id)) + '" target="_blank" rel="noopener">' +
        svg(ICON.notes, 14) + '<span>' + esc(a.dateiname) + '</span></a>' +
        '<span class="att-meta">' + fmtBytes(a.groesse) + '</span>' +
        '<button class="btn btn-sm btn-ghost" data-attdel="' + esc(a.id) + '">' + svg(ICON.close, 12) + '</button></li>').join('') + '</ul>'
    : '<div class="t-helper">Noch keine Anhänge hinterlegt.</div>') +
    '<label class="btn btn-sm btn-tertiary" style="margin-top:8px">' +
      svg(ICON.plus, 14) + 'Datei anhängen' +
      '<input type="file" id="panelFile" hidden></label>';

  const fileEl = host.querySelector('#panelFile');
  fileEl.addEventListener('change', async e => {
    const f = e.target.files[0];
    if (!f) return;
    try {
      await store.uploadAttachment(art, id, f, '');
      toast('Anhang hinzugefügt', { tone: 'success' });
      renderAttachments(scope, art, id);
    } catch (err) { toast('Fehler beim Hochladen', { tone: 'error' }); }
  });

  host.querySelectorAll('[data-attdel]').forEach(b => b.addEventListener('click', async () => {
    try {
      await store.removeAttachment(art, id, b.dataset.attdel);
      toast('Anhang gelöscht', { tone: 'success' });
      renderAttachments(scope, art, id);
    } catch (err) { toast('Fehler beim Löschen', { tone: 'error' }); }
  }));
}

function comboBox(host, { options = [], selected = [], multi = false, placeholder = 'suchen …', onChange }) {
  if (!host) return;
  if (host.__comboCleanup) host.__comboCleanup();
  const sel = multi ? (Array.isArray(selected) ? selected.slice() : []) : [];
  let single = multi ? '' : (Array.isArray(selected) ? (selected[0] || '') : (selected || ''));
  let query = '', active = -1;

  host.innerHTML =
    '<div class="combo">' +
      '<div class="combo-field">' +
        '<span class="combo-chips"></span>' +
        '<input class="combo-input" type="text" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false">' +
        '<span class="combo-carets">' + svg(ICON.chevD, 14) + '</span>' +
      '</div>' +
      '<div class="combo-list" role="listbox" hidden></div>' +
    '</div>';

  const field = host.querySelector('.combo-field');
  const input = host.querySelector('.combo-input');
  const list = host.querySelector('.combo-list');
  const chips = host.querySelector('.combo-chips');

  const currentValues = () => multi ? sel : (single ? [single] : []);
  const filtered = () => {
    const q = norm(query);
    return options.filter(o => !currentValues().includes(o) && (!q || norm(o).includes(q)));
  };

  const syncValue = () => {
    host.dataset.value = multi ? sel.join(' | ') : single;
    input.placeholder = multi && sel.length ? '' : (single ? '' : placeholder);
  };

  function renderChips() {
    chips.innerHTML = currentValues().map(v =>
      '<span class="combo-chip" data-v="' + esc(v) + '">' + esc(v) +
      '<button type="button" class="combo-x" data-del="' + esc(v) + '">' + svg(ICON.close, 10) + '</button></span>').join('');
  }

  function renderList() {
    const f = filtered();
    active = Math.max(-1, Math.min(f.length - 1, active));
    list.innerHTML = f.length
      ? f.map((o, i) => '<button type="button" class="combo-opt' + (i === active ? ' on' : '') + '" data-i="' + i + '">' + esc(o) + '</button>').join('')
      : '<div style="padding:6px 10px;font-size:11px;color:var(--text-helper)">kein Treffer</div>';
  }

  function open() {
    if (!list.hidden) return;
    list.hidden = false;
    input.setAttribute('aria-expanded', 'true');
    host.dataset.open = '1';
    renderList();
  }
  function close() {
    list.hidden = true;
    input.setAttribute('aria-expanded', 'false');
    host.dataset.open = '';
    query = ''; input.value = ''; active = -1;
  }
  const commit = (vals) => {
    if (multi) { sel.length = 0; sel.push(...vals); }
    else single = vals[0] || '';
    syncValue(); renderChips(); renderList();
    if (onChange) onChange(multi ? sel.slice() : single);
  };

  field.addEventListener('click', e => {
    const del = e.target.closest('[data-del]');
    if (del) { e.stopPropagation(); commit(currentValues().filter(v => v !== del.dataset.del)); return; }
    if (!e.target.closest('.combo-x')) { open(); input.focus(); }
  });
  input.addEventListener('focus', open);
  input.addEventListener('input', () => { query = input.value; active = -1; open(); renderList(); });
  input.addEventListener('keydown', e => {
    const f = filtered();
    if (e.key === 'ArrowDown') { e.preventDefault(); open(); active = Math.min(f.length - 1, active + 1); renderList(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(0, active - 1); renderList(); }
    else if (e.key === 'Enter') {
      e.preventDefault(); e.stopPropagation();
      if (active >= 0 && f[active]) commit(multi ? sel.concat([f[active]]) : [f[active]]);
      else if (input.value.trim()) commit(multi ? sel.concat([input.value.trim()]) : [input.value.trim()]);
      if (!multi) close(); else { query = ''; input.value = ''; renderList(); }
    }
    else if (e.key === 'Escape') { e.stopPropagation(); close(); }
    else if (e.key === 'Backspace' && !input.value && currentValues().length) {
      const v = currentValues(); v.pop(); commit(v);
    }
  });
  list.addEventListener('mousedown', e => {
    const o = e.target.closest('.combo-opt');
    if (!o) return;
    e.preventDefault();
    commit(multi ? sel.concat([filtered()[+o.dataset.i]]) : [filtered()[+o.dataset.i]]);
    if (!multi) close(); else { query = ''; input.value = ''; input.focus(); renderList(); }
  });

  const onDoc = (e) => { if (!host.contains(e.target)) close(); };
  document.addEventListener('mousedown', onDoc);
  host.__comboCleanup = () => document.removeEventListener('mousedown', onDoc);
  syncValue(); renderChips();
}

/* ==========================================================================
   Termin-Disposition (Outlook Web + ICS für Desktop)
   ========================================================================== */
const localIso = (d) => d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) +
  'T' + p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':00';
const fmtIso = (d) => d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
const icsTime = (d) => d.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
const icsDay = (d) => String(d.getFullYear()) + p2(d.getMonth() + 1) + p2(d.getDate());

function terminBody(it) {
  return [
    'Zuständig: ' + (it.zustaendig || '-'),
    it.kommentar ? 'Hinweis: ' + it.kommentar : null,
    it.intervall ? 'Intervall: ' + it.intervall : null
  ].filter(Boolean).join('\n');
}
const terminOrt = (it) => (it.ort || ((it.objekt_nr || '') + ' ' + (it.objekt_name || ''))).trim();
const terminSubject = (it) => it.subject || it.taetigkeit || 'Wartung';

function outlookWebUrl(it, o) {
  const params = new URLSearchParams({
    path: '/calendar/action/compose', rru: 'addevent',
    subject: terminSubject(it), location: terminOrt(it),
    startdt: o.allDay ? fmtIso(o.start) : localIso(o.start),
    enddt: o.allDay ? fmtIso(o.ende) : localIso(o.ende),
    body: terminBody(it)
  });
  if (o.allDay) params.append('allday', 'true');
  const to = (o.attendees || []).filter(Boolean);
  if (to.length) params.append('to', to.join(';'));
  return 'https://outlook.office.com/calendar/deeplink/compose?' + params.toString();
}

function icsText(it, o) {
  const esc1 = (s) => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
  const uid = ((it.external_id || String(it.id)) + '-' + Date.now()) + '@wartungstool';
  const dtstart = o.allDay ? 'DTSTART;VALUE=DATE:' + icsDay(o.start) : 'DTSTART:' + icsTime(o.start);
  const dtend = o.allDay ? 'DTEND;VALUE=DATE:' + icsDay(o.ende) : 'DTEND:' + icsTime(o.ende);
  return [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Wartungstool//DE', 'CALSCALE:GREGORIAN', 'METHOD:REQUEST',
    'BEGIN:VEVENT', 'UID:' + uid, 'DTSTAMP:' + icsTime(new Date()),
    'SUMMARY:' + esc1(terminSubject(it)), 'LOCATION:' + esc1(terminOrt(it)),
    'DESCRIPTION:' + esc1(terminBody(it)), dtstart, dtend, 'END:VEVENT', 'END:VCALENDAR'
  ].join('\r\n');
}

function terminZielStandort(g) {
  return {
    key: 'loc:' + (g.nr || g.name), subject: 'Wartungsarbeiten Sammeltermin',
    ort: ((g.nr || '') + ' ' + (g.name || '')).trim(),
    zustaendig: uniq(g.items.map(i => i.zustaendig)).join(', '),
    extra: g.items.length + ' Positionen'
  };
}
function terminZielPosition(it) {
  return {
    key: keyOf(it), subject: it.taetigkeit || 'Wartung',
    ort: terminOrt(it), zustaendig: it.zustaendig, kommentar: it.kommentar,
    ab: it.ab, bis: it.bis
  };
}

function terminDialog(ziel) {
  const heute = new Date(); heute.setHours(0, 0, 0, 0);
  const ab = parseDate(ziel.ab);
  const tag = (ab && ab > heute) ? ab : heute;
  const mails = (settings.dispoMail || CONFIG.dispoMail).split(',').map(x => x.trim()).filter(Boolean);

  return new Promise(resolve => {
    const scrim = document.createElement('div');
    scrim.className = 'modal-scrim';
    scrim.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true">' +
        '<header><h3>Termin disponieren</h3><button class="close" data-x>' + svg(ICON.close, 16) + '</button></header>' +
        '<div class="body">' +
          '<div class="fld"><label for="dBetreff">Betreff</label>' +
            '<input class="inp" id="dBetreff" value="' + esc(ziel.subject) + '"></div>' +
          '<div class="row"><dt>Ort</dt><dd class="t-mono">' + esc(ziel.ort || '–') + '</dd></div>' +
          (ziel.zustaendig ? '<div class="row"><dt>Zuständig</dt><dd>' + esc(ziel.zustaendig) + '</dd></div>' : '') +
          '<div class="fld" style="margin-top:12px"><label>Art</label>' +
            '<div class="status-seg" id="dArt">' +
              '<button type="button" class="seg-btn" data-art="all" aria-pressed="true">Ganztägig</button>' +
              '<button type="button" class="seg-btn" data-art="time" aria-pressed="false">Mit Uhrzeit</button>' +
            '</div></div>' +
          '<div class="fld" id="dDayWrap"><label for="dTag">Datum</label>' +
            '<input class="inp" id="dTag" type="date" value="' + fmtIso(tag) + '"></div>' +
          '<div class="fgrid" id="dTimeWrap" hidden>' +
            '<div><label>Beginn</label><input class="inp" id="dStart" type="datetime-local" value="' + toLocalInput(zeitAm(tag)) + '"></div>' +
            '<div><label>Ende</label><input class="inp" id="dEnde" type="datetime-local" value="' + toLocalInput(endeAm(tag)) + '"></div>' +
          '</div>' +
          '<div class="fld"><label>Teilnehmer</label><div class="combo-host" id="dTeil"></div></div>' +
        '</div>' +
        '<div class="foot">' +
          '<button class="btn btn-ghost" data-ics>' + svg(ICON.download, 14) + 'ICS für Outlook</button>' +
          '<span style="flex:1"></span>' +
          '<button class="btn btn-tertiary" data-x>Abbrechen</button>' +
          '<button class="btn btn-primary" data-web>' + svg(ICON.calendar, 14) + 'In Outlook Web öffnen</button>' +
        '</div>' +
      '</div>';

    const art = () => scrim.querySelector('#dArt button[aria-pressed="true"]').dataset.art;
    scrim.querySelector('#dArt').addEventListener('click', e => {
      const b = e.target.closest('[data-art]'); if (!b) return;
      scrim.querySelectorAll('#dArt button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      const isAll = b.dataset.art === 'all';
      scrim.querySelector('#dDayWrap').hidden = !isAll;
      scrim.querySelector('#dTimeWrap').hidden = isAll;
    });

    comboBox(scrim.querySelector('#dTeil'), {
      options: uniq(mails.concat([CONFIG.dispoMail, settings.dispoMail])), selected: mails,
      multi: true, placeholder: 'E-Mail eingeben'
    });

    const collect = () => {
      const att = scrim.querySelector('#dTeil').dataset.value.split('|').map(x => x.trim()).filter(Boolean);
      const isAll = art() === 'all';
      const it = { subject: scrim.querySelector('#dBetreff').value.trim() || ziel.subject, ort: ziel.ort, zustaendig: ziel.zustaendig, kommentar: ziel.kommentar, external_id: ziel.key };
      if (isAll) {
        const d = scrim.querySelector('#dTag').value;
        const start = new Date(d + 'T00:00:00');
        return { allDay: true, start, ende: new Date(start.getTime() + 86400000), attendees: att, it };
      }
      const s1 = new Date(scrim.querySelector('#dStart').value), e1 = new Date(scrim.querySelector('#dEnde').value);
      return { allDay: false, start: s1, ende: e1, attendees: att, it };
    };

    const done = (v) => { scrim.remove(); resolve(v); };
    scrim.addEventListener('click', e => {
      if (e.target === scrim || e.target.closest('[data-x]')) return done(null);
      const isWeb = !!e.target.closest('[data-web]'), isIcs = !!e.target.closest('[data-ics]');
      if (!isWeb && !isIcs) return;
      const o = collect();
      if (o.attendees.length) { settings.dispoMail = o.attendees.join(', '); saveSettings(); }
      done({ action: isWeb ? 'web' : 'ics', o });
    });
    $('#overlay').appendChild(scrim);
  });
}

function zeitAm(tag) { const d = new Date(tag.getTime()); d.setHours(8, 30, 0, 0); return d; }
function endeAm(tag) { const d = new Date(tag.getTime()); d.setHours(11, 30, 0, 0); return d; }
function toLocalInput(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + 'T' + p2(d.getHours()) + ':' + p2(d.getMinutes()); }

async function dispatchTermin(rec) {
  if (!rec) return;
  const ziel = rec.key ? rec : terminZielPosition(rec);
  const res = await terminDialog(ziel);
  if (!res) return;
  const it = res.o.it;
  if (res.action === 'web') {
    window.open(outlookWebUrl(it, res.o), '_blank', 'noopener,noreferrer');
    toast('Outlook Web geöffnet', { tone: 'success' });
  } else {
    download('Termin_' + ((it.ort || '') + '_' + (it.subject || 'Wartung')).replace(/[^\w.-]+/g, '_').slice(0, 50) + '.ics', icsText(it, res.o), 'text/calendar');
    toast('ICS-Datei erstellt', { tone: 'success' });
  }
}

const TODO_FIELDS = {

};
const normalizeTodo = (r) => markToDo(Object.assign({}, TODO_FIELDS, r, {
  id: r.id ?? null,
  erledigt: r.erledigt === true || r.erledigt === 1 || r.erledigt === '1' || r.erledigt === 'true'

const istBereichTodo = () => state.bereich === 'todo';
const istBereichAlle = () => state.bereich === 'alle';

function todoDialog(key) {

      return {
        id: t ? t.id : null,

        objekt_name: nr[2] || '',

      };
    },

      });

  });

function objects() {
  const m = new Map();
  for (const it of state.items) {
    const k = groupKey(it);
    if (!m.has(k)) m.set(k, { nr: it.objekt_nr, name: it.objekt_name });
  }
  return Array.from(m.values()).sort((a, b) => (a.nr || '').localeCompare(b.nr || '', 'de', { numeric: true }));
}

async function saveTodo(data) {
  const saved = await store.saveTodo(data);
  const n = normalizeTodo(saved);
  const i = state.todos.findIndex(x => String(x.id) === String(n.id));
  if (i >= 0) state.todos[i] = n; else state.todos.push(n);
  render();
  return n;
}

async function deleteTodo(id) {
  await store.removeTodo(id);
  state.todos = state.todos.filter(x => String(x.id) !== String(id));
  render();
  toast('To-Do gelöscht', { tone: 'warning' });
}

async function todoDone(key, on) {
  const t = findByKey(key);
  if (!t) return;
  if (on && !await ensureUser()) return;
  await saveTodo(Object.assign({}, t, on
    ? { erledigt: true, erledigt_am: fmtDate(new Date()), erledigt_durch: state.user }
    : { erledigt: false, erledigt_am: '', erledigt_durch: '' }));
  toast(on ? 'To-Do erledigt' : 'To-Do wieder offen', { tone: on ? 'success' : 'warning' });
}

function completionDialog(it) {
  const known = uniq(state.items.map(i => i.zustaendig));

  return modal({

    }),

      comboBox(s.querySelector('#mBy'), { options: persons, selected: state.user, multi: false });
    }

}

async function finish(id, patch) {
  const it = state.items.find(x => String(x.id) === String(id));
  if (!it) return null;
  const before = Object.assign({}, it);
  Object.assign(it, patch);
  render();
  try {
    const saved = await store.complete(id, patch);
    Object.assign(it, saved);
    state.online = true;
  } catch (e) {
    Object.assign(it, before);
    state.online = false;
    render();
    toast('Fehler beim Speichern', { tone: 'error' });
    return null;
  }
  return it;
}

async function markDone(id) {
  const it = state.items.find(x => String(x.id) === String(id));
  if (!it) return;
  if (!await ensureUser()) return;
  const data = await completionDialog(it);
  if (!data) return;
  await finish(id, data);
  toast('Wartung abgeschlossen', { tone: 'success' });
}

async function reopen(id) {
  await finish(id, { erledigt: false, erledigt_am: '', erledigt_durch: '' });
  toast('Erledigung zurückgenommen', { tone: 'warning' });
}

$('#tableHost').addEventListener('click', async e => {
  const termLoc = e.target.closest('[data-termloc]');
  if (termLoc) {
    e.stopPropagation();
    const g = filteredGroups(aktuelleListe()).find(([k]) => k === termLoc.dataset.termloc);
    if (g) dispatchTermin(terminZielStandort(g[1]));
    return;
  }
  const loc = e.target.closest('[data-loc]');
  if (loc && !e.target.closest('.td-act')) {
    const k = loc.dataset.loc;
    state.expanded.has(k) ? state.expanded.delete(k) : state.expanded.add(k);
    return render();
  }
  const plan = e.target.closest('[data-plan]');
  if (plan) {
    const k = 'plan:' + plan.dataset.plan;
    state.collapsed.has(k) ? state.collapsed.delete(k) : state.collapsed.add(k);
    return render();
  }
  const tick = e.target.closest('[data-tick]');
  if (tick) {
    const rec = findByKey(tick.dataset.tick);
    if (!rec) return;
    if (istToDo(rec)) return todoDone(keyOf(rec), !rec.erledigt);
    return rec.erledigt ? reopen(rec.id) : markDone(rec.id);
  }
  const term = e.target.closest('[data-term]');
  if (term) return dispatchTermin(findByKey(term.dataset.term));
  const todoEdit = e.target.closest('[data-todoedit]');
  if (todoEdit) {
    const d = await todoDialog(todoEdit.dataset.todoedit);
    if (d) { await saveTodo(d); toast('To-Do gespeichert', { tone: 'success' }); }
    return;
  }
  const note = e.target.closest('[data-note]');
  if (note) {
    const rec = findByKey(note.dataset.note);
    if (!rec) return;
    return istToDo(rec) ? todoDialog(keyOf(rec)) : openPanel(rec.id, { focusNote: true });
  }
  const open = e.target.closest('[data-open]');
  if (open) return openPanel(findByKey(open.dataset.open).id);
});

document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if (e.key === 'Escape') {
    if (typing) { e.target.blur(); return; }
    if ($('#overlay').children.length) return;
    state.query = ''; state.status = 'alle'; $('#search').value = ''; render();
    return;
  }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); $('#search').focus(); }
  if (e.key === 'p') { window.print(); }
  if (e.key === 'm') {
    const order = ['objects', 'plan', 'table'];
    state.view = order[(order.indexOf(state.view) + 1) % order.length];
    $$('#viewSwitch button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.view === state.view)));
    render();
  }
});

async function init() {
  applyTheme();
  try { state.user = localStorage.getItem(CONFIG.userKey) || ''; } catch {}
  store = CONFIG.dataSource === 'api' ? ApiStore : LocalStore;
  state.loading = true; render();

  try {
    const { items } = await store.load();
    state.items = items;
    state.online = true;
    try { state.todos = await store.loadTodos(); } catch (e2) { state.todos = []; }
  } catch (e) {
    store = LocalStore;
    const { items } = await LocalStore.load();
    state.items = items;
    state.todos = await LocalStore.loadTodos();
    state.online = false;
  }
  state.loading = false;
  render();
}

init();
</script>
</body>
</html>
