<script>
'use strict';
/* Wartungstool · JS · Tabs (benannte Ansichten, clientseitig)
   ---------------------------------------------------------------------------
   Der Home-Tab (Landing) ist Vorgabe-Standard und beim Aufruf aktiv. Dazu die
   Standard-Tabs (Zuhause · Alle · Wartungen · Eigene To-Dos) und beliebig viele
   eigene Tabs. Jeder Tab merkt sich seine Filter- und Ansichtseinstellungen;
   alles liegt in localStorage und bleibt ueber Sitzungen erhalten.

   Tabs sind frei verschiebbar (der Standard-Tab bleibt ganz links) und - mit
   Ausnahme des Standard-Tabs - alle schliessbar. Die vier Standard-Tabs sind
   immer im "+"-Menue unter "Standard Tabs" aufrufbar; eigene Tabs lassen sich
   per "Tab speichern" in eine Ablage (max. 5) legen, die letzten geschlossenen
   stehen unter "Zuletzt geschlossen". */

const TABS_KEY = CONFIG.storageKey + '.tabs';
const MAX_SAVED_TABS = 5;
const MAX_RECENT_TABS = 5;

/* Felder, die ein Tab als Einstellungen speichert. */
const TAB_SETTING_KEYS = [
  'bereich', 'status', 'query', 'art', 'objekt', 'taetigkeit', 'personen', 'mine',
  'zeitraumJahr', 'von', 'bis', 'group', 'view', 'sortKey', 'sortDir'
];

const HOME_TAB = { id: 'home', name: 'Zuhause', home: true, icon: 'home' };
const STANDARD_TABS = [
  { id: 'all', name: 'Alle', bereich: 'alle', icon: 'list' },
  { id: 'wartung', name: 'Wartungen', bereich: 'wartung', icon: 'bolt' },
  { id: 'todo', name: 'Eigene To-Dos', bereich: 'todo', icon: 'check' }
];

const TAB_DEFAULTS = {
  status: 'alle', query: '', art: '', objekt: '', taetigkeit: '', personen: [], mine: false,
  zeitraumJahr: '', von: '', bis: '', group: 'object', view: 'list', sortKey: 'status', sortDir: 'asc'
};

const tabSettings = (bereich, extra) =>
  Object.assign({}, TAB_DEFAULTS, { bereich, personen: [] }, extra || {});

const standardTabDef = (id) => (id === 'home' ? HOME_TAB : STANDARD_TABS.find((t) => t.id === id));

function normalizeTab(t) {
  t.builtin = !!t.builtin;
  t.home = !!t.home;
  t.fav = !!t.fav;
  t.color = t.color || '';
  if (!t.icon || !TAB_ICONS[t.icon]) {
    t.icon = t.home ? 'home'
      : t.id === 'all' ? 'list'
        : t.id === 'wartung' ? 'bolt'
          : t.id === 'todo' ? 'check' : 'list';
  }
  t.settings = Object.assign({}, TAB_DEFAULTS, t.settings || {});
  if (!Array.isArray(t.settings.personen)) t.settings.personen = [];
  return t;
}

const tabRecord = (t) => ({ name: t.name, fav: !!t.fav, home: !!t.home, color: t.color || '', icon: t.icon || '', settings: Object.assign({}, t.settings) });

/** Standard-Tab (Zuhause/Alle/…) neu anlegen. */
function makeStandardTab(def) {
  return normalizeTab({
    id: def.id, name: def.name, home: !!def.home, builtin: true, icon: def.icon,
    settings: tabSettings(def.bereich || 'alle', def.home ? { view: 'home', group: 'none' } : null)
  });
}

function defaultTabs() {
  return {
    active: 'home', def: 'home',
    list: [makeStandardTab(HOME_TAB)].concat(STANDARD_TABS.map(makeStandardTab)),
    saved: [], recent: []
  };
}

function dedupeList(arr, max) {
  const out = [];
  for (const s of arr || []) {
    if (!s || !s.name) continue;
    if (!out.some((x) => x.name === s.name)) out.push(s);
    if (out.length >= max) break;
  }
  return out;
}

function loadTabs() {
  let p = null;
  try { p = JSON.parse(localStorage.getItem(TABS_KEY) || 'null'); } catch (e) {}
  if (!p || !Array.isArray(p.list) || !p.list.length) return defaultTabs();

  const recent = (Array.isArray(p.recent) ? p.recent : []).slice();
  // Migration: frueher geschlossene Tabs in "Zuletzt geschlossen" uebernehmen.
  for (const t of p.list) if (t && t.closed) recent.unshift(tabRecord(t));
  p.list = p.list.filter((t) => t && !t.closed).map(normalizeTab);
  p.saved = dedupeList(p.saved, MAX_SAVED_TABS);
  p.recent = dedupeList(recent, MAX_RECENT_TABS);

  if (!p.list.length) p.list.push(makeStandardTab(HOME_TAB));
  if (!p.def || !standardTabDef(p.def)) p.def = p.list.some((t) => t.home) ? 'home' : p.list[0].id;
  if (!p.active || !p.list.some((t) => t.id === p.active)) p.active = p.list[0].id;
  return p;
}

let TABS = loadTabs();

function saveTabs() {
  try { localStorage.setItem(TABS_KEY, JSON.stringify(TABS)); } catch (e) {}
}

function activeTab() {
  return TABS.list.find((t) => t.id === TABS.active) || TABS.list[0];
}
const homeOpen = () => TABS.list.some((t) => t.home);

/** Aktuellen Zustand in den aktiven Tab schreiben (bei jedem Rendern). */
function syncActiveTab() {
  const t = activeTab();
  if (!t) return;
  t.settings = tabSnapshot();
  saveTabs();
}

/** Momentane Filter-/Ansichtseinstellungen als flaches Objekt. */
function tabSnapshot(src = state) {
  const s = {};
  for (const k of TAB_SETTING_KEYS) s[k] = Array.isArray(src[k]) ? src[k].slice() : src[k];
  return s;
}

/** Zustand aus einem Tab uebernehmen (ohne rendern). */
function applyTabState(t) {
  if (!t) return;
  const s = Object.assign({}, TAB_DEFAULTS, t.settings);
  for (const k of TAB_SETTING_KEYS) state[k] = Array.isArray(s[k]) ? s[k].slice() : s[k];
  state.expanded = new Set();
  state.collapsed = new Set();
  TABS.active = t.id;
  saveTabs();
}

function applyTab(id) {
  const t = TABS.list.find((x) => x.id === id);
  if (!t) return;
  applyTabState(t);
  render();
}

/** Standard-Tab oeffnen (anlegen, falls geschlossen) und aktivieren. */
function openStandard(id) {
  const def = standardTabDef(id);
  if (!def) return;
  let t = TABS.list.find((x) => x.id === id);
  if (!t) { t = makeStandardTab(def); TABS.list.push(t); }
  applyTabState(t);
  saveTabs();
  render();
  return id;
}
/** Home-Tab oeffnen/aktivieren (Komfort-Alias). */
function addHomeTab() { return openStandard('home'); }

/** Intern: Tab entfernen; aktiven Tab weiterziehen, nie ganz leer lassen. */
function removeTabInternal(id) {
  TABS.list = TABS.list.filter((x) => x.id !== id);
  if (TABS.active === id) {
    const next = TABS.list[0];
    if (next) applyTabState(next);
  }
  if (!TABS.list.length) openStandard('home');
  else saveTabs();
}

/** Tab schliessen (alle schliessbar; Standard-Tabs bleiben im "+"-Menue). */
function closeTab(id) {
  const t = TABS.list.find((x) => x.id === id);
  if (!t) return;
  if (!standardTabDef(id)) {
    const rec = tabRecord(t);
    TABS.recent = [rec].concat((TABS.recent || []).filter((s) => s.name !== rec.name)).slice(0, MAX_RECENT_TABS);
  }
  removeTabInternal(id);
  render();
}

/** Tab speichern: in die Ablage (max. 5) legen, dann entfernen. */
function saveTab(id) {
  const t = TABS.list.find((x) => x.id === id);
  if (!t) return;
  const rec = tabRecord(t);
  TABS.saved = [rec].concat((TABS.saved || []).filter((s) => s.name !== rec.name)).slice(0, MAX_SAVED_TABS);
  removeTabInternal(id);
  render();
}

/** Neuen, eigenen Tab anlegen: uebernimmt die aktuellen Einstellungen; ein als
    Standard markiertes Preset gibt Gruppe/Sortierung/Ansicht vor. */
function addTab(name) {
  syncActiveTab();
  const clean = String(name || '').trim() || 'Neue Ansicht';
  const id = newTabId(clean);
  const settings = tabSnapshot();
  const ps = loadPresets();
  const def = (ps.list || []).find((p) => p.name === ps.def);
  if (def) {
    settings.group = def.group || settings.group;
    settings.view = def.view || settings.view;
    settings.sortKey = def.sortKey || settings.sortKey;
    settings.sortDir = def.sortDir || settings.sortDir;
  }
  TABS.list.push(normalizeTab({ id, name: clean, settings }));
  TABS.active = id;
  saveTabs();
  render();
  return id;
}

function newTabId(_name) {
  let id = 't' + Date.now().toString(36);
  while (TABS.list.some((t) => t.id === id)) id += 'x';
  return id;
}

/** Einen gespeicherten (oder zuletzt geschlossenen) Tab wieder oeffnen. */
function openRecord(rec) {
  if (!rec) return;
  const id = newTabId(rec.name);
  const t = normalizeTab({ id, name: rec.name, home: !!rec.home, fav: !!rec.fav, color: rec.color || '', icon: rec.icon || '', settings: Object.assign({}, rec.settings) });
  TABS.list.push(t);
  applyTabState(t);
  saveTabs();
  render();
  return id;
}
function reopenSaved(name) {
  const i = (TABS.saved || []).findIndex((s) => s.name === name);
  if (i < 0) return;
  const rec = TABS.saved[i];
  TABS.saved.splice(i, 1);
  saveTabs();
  return openRecord(rec);
}
function reopenRecent(name) {
  const i = (TABS.recent || []).findIndex((s) => s.name === name);
  if (i < 0) return;
  const rec = TABS.recent[i];
  TABS.recent.splice(i, 1);
  saveTabs();
  return openRecord(rec);
}

function renameTab(id, name) {
  const t = TABS.list.find((x) => x.id === id);
  const clean = String(name || '').trim();
  if (!t || !clean) return;
  t.name = clean;
  saveTabs();
  render();
}

/** Tabs frei verschieben; der Standard-Tab bleibt ganz links. */
function moveTab(dragId, targetId, after) {
  if (!dragId || !targetId || dragId === targetId) return;
  if (dragId === TABS.def) return;
  const arr = TABS.list.slice();
  const from = arr.findIndex((t) => t.id === dragId);
  if (from < 0) return;
  if (targetId === TABS.def) after = false;
  const [item] = arr.splice(from, 1);
  const to = arr.findIndex((t) => t.id === targetId);
  if (to < 0) { arr.splice(from, 0, item); return; }
  arr.splice(after ? to + 1 : to, 0, item);
  const di = arr.findIndex((t) => t.id === TABS.def);
  if (di > 0) { const [d] = arr.splice(di, 1); arr.unshift(d); }
  TABS.list = arr;
  saveTabs();
  render();
}

function toggleFavTab(id) {
  const t = TABS.list.find((x) => x.id === id);
  if (!t) return;
  t.fav = !t.fav;
  saveTabs();
  render();
}

/** Akzentfarbe eines Tabs setzen ('' = Standard/Blau). */
function setTabColor(id, color) {
  const t = TABS.list.find((x) => x.id === id);
  if (!t) return;
  t.color = color || '';
  saveTabs();
  render();
}

/** Symbol eines Tabs setzen (Schluessel aus TAB_ICONS). */
function setTabIcon(id, icon) {
  const t = TABS.list.find((x) => x.id === id);
  if (!t || !TAB_ICONS[icon]) return;
  t.icon = icon;
  saveTabs();
  render();
}

/** Tab als Standard festlegen (nur einer; erneutes Setzen hebt auf). */
function setDefaultTab(id) {
  const t = TABS.list.find((x) => x.id === id);
  if (!t) return;
  TABS.def = TABS.def === id ? '' : id;
  saveTabs();
  render();
}

/** Sichtbare Tabs: Standard-Tab ganz links, sonst freie Reihenfolge. */
function orderedTabs() {
  const def = TABS.def;
  return TABS.list.slice().sort((a, b) => (a.id === def ? -1 : 0) - (b.id === def ? -1 : 0));
}

/** Anzahl Positionen in einem Tab (Home zeigt die offenen Wartungen). */
function tabCount(t) {
  if (t.home) { const f = fortschritt(); return f.total - f.done; }
  return filtered(bereichListe(t.settings.bereich), t.settings).length;
}

/** Verfuegbare Jahre fuer den Zeitraumfilter (aus den Fristen). */
function tabYears() {
  const years = new Set();
  for (const it of state.items.concat(state.todos)) {
    const d = parseDate(it.bis);
    if (d) years.add(d.getFullYear());
  }
  return Array.from(years).sort((a, b) => a - b);
}

</script>

<script>
'use strict';
/* Wartungstool · JS · Rendering der Ansichten */
/* ==========================================================================
   UI-Rendering mit Circular Progress Rings
   ========================================================================== */
function render() {
  renderSource();
  renderHead();
  renderToolbar();
  renderProgress();
  renderBody();
}

/** Gesamtfortschritt der Wartungen oben als Balken. */
function renderProgress() {
  const f = fortschritt();
  const el = $('#progressStrip');
  if (!el) return;
  $('#psBar').style.width = f.pct + '%';
  $('#psLabel').textContent = f.personal ? 'Meine Wartungen' : 'Alle Wartungen';
  $('#psValue').textContent = f.done + ' / ' + f.total + ' · ' + f.pct + '%';
  el.classList.toggle('done', f.total > 0 && f.done === f.total);
}

/** Datenquelle dezent in der Fußzeile anzeigen (statt prominent im Kopf). */
function renderSource() {
  const el = $('#srcStatus');
  el.classList.toggle('api', store === ApiStore);
  el.classList.toggle('offline', !state.online);
  el.classList.toggle('busy', state.loading);
  $('#srcText').textContent = state.loading ? 'Lade …'
    : (!state.online ? 'Offline'
      : (store === ApiStore ? 'SQL-Backend'
        : (hasDataFile() ? 'Stammdaten: daten.js' : 'Testbestand')));
}

function renderHead() {
  $('#userName').textContent = state.user || 'Name hinterlegen';
  $('#userNudge').hidden = !!state.user;
  renderTabs();
}

/** Tab-Leiste: Standard- und eigene Tabs, Favoriten zuerst. */
function renderTabs() {
  syncActiveTab();
  const host = $('#tabBar');
  if (!host) return;
  host.innerHTML = orderedTabs().map(t => {
    const act = t.id === TABS.active;
    const cls = 'scope-tab' + (t.fav ? ' fav' : '') + (t.color ? ' has-accent' : '') + (TABS.def === t.id ? ' is-default' : '');
    const style = t.color ? ' style="--tab-accent:' + esc(t.color) + '"' : '';
    const ico = TAB_ICONS[t.icon] ? svg(TAB_ICONS[t.icon], 13) : '';
    return '<div class="' + cls + '" role="tab" tabindex="0" draggable="true"' + style +
      ' data-tab="' + esc(t.id) + '" aria-selected="' + act + '" title="' + esc(t.name) + '">' +
      (TABS.def === t.id ? '<span class="tab-def" title="Standard-Ansicht"></span>' : '') +
      '<span class="tab-ic">' + ico + '</span>' +
      '<span class="tab-name">' + esc(t.name) + '</span>' +
      (t.fav ? '<span class="tab-star" title="Favorit">★</span>' : '') +
      '<span class="n">' + tabCount(t) + '</span>' +
      '<button type="button" class="tab-menu" data-tabmenu="' + esc(t.id) + '" title="Tab-Optionen" aria-label="Tab-Optionen">⋯</button>' +
    '</div>';
  }).join('') + '<button type="button" class="scope-add" id="tabAdd" title="Neue Ansicht hinzufügen">＋</button>';
}

function renderToolbar() {
  const c = countsForScope(state.bereich);
  const searchEl = $('#search');
  if (document.activeElement !== searchEl) searchEl.value = state.query || '';
  const segs = [
    { key: 'alle', label: 'Alle' },
    { key: 'over', label: 'Überfällig' },
    { key: 'soon', label: 'Bald' },
    { key: 'open', label: 'Offen' },
    { key: 'done', label: 'Erledigt' }
  ];
  $('#statusChips').innerHTML = segs.map(s => {
    const isAct = state.status === s.key;
    const count = c[s.key] ?? 0;
    return '<button class="seg-btn" data-status="' + s.key + '" aria-pressed="' + isAct + '">' +
      s.label + ' <span class="n">' + count + '</span></button>';
  }).join('');

  $('#chipMineN').textContent = c.mine;
  $('#chipMineN').hidden = !state.user;
  $('#chipMine').classList.toggle('on', state.mine);

  // Zusammenfassen: ein Knopf, darunter die Leiste mit allen Optionen.
  const anyFilter = !!(state.query || state.taetigkeit || state.personen.length || state.mine ||
    state.status !== 'alle' || state.zeitraumJahr || state.von || state.bis);
  $('#viewActiveDot').hidden = !anyFilter;
  $('#btnViewPanel').classList.toggle('has-active', anyFilter);
  $('#btnViewPanel').setAttribute('aria-expanded', String(state.filterOpen));
  $('#viewPanel').hidden = !state.filterOpen;

  const fill = (sel, values, current, placeholder) => {
    const el = $(sel);
    el.innerHTML = '<option value="">' + placeholder + '</option>' + values.map(v =>
      '<option value="' + esc(v) + '"' + (v === current ? ' selected' : '') + '>' + esc(v) + '</option>').join('');
  };
  fill('#fltTask', uniq(bereichListe(state.bereich).map(i => i.taetigkeit)), state.taetigkeit, 'alle Tätigkeiten');

  const jsel = $('#fltJahr');
  jsel.innerHTML = '<option value="">alle Jahre</option>' + tabYears().map(y =>
    '<option value="' + y + '"' + (String(y) === String(state.zeitraumJahr) ? ' selected' : '') + '>' + y + '</option>').join('');
  const von = $('#fltVon'), bis = $('#fltBis');
  if (document.activeElement !== von) von.value = state.von || '';
  if (document.activeElement !== bis) bis.value = state.bis || '';

  // Drei Schritte: Gruppieren · Sortieren · Ansicht (+ Presets)
  $('#groupSel').innerHTML = GROUP_DEFS.map(g =>
    '<option value="' + g.key + '"' + (g.key === state.group ? ' selected' : '') + '>' + g.label + '</option>').join('');
  $('#sortSel').innerHTML = SORT_DEFS.map(s =>
    '<option value="' + s.key + '"' + (s.key === state.sortKey ? ' selected' : '') + '>' + s.label + '</option>').join('');
  const dirBtn = $('#sortDir');
  dirBtn.textContent = state.sortDir === 'asc' ? '↑' : '↓';
  dirBtn.title = state.sortDir === 'asc' ? 'aufsteigend (klicken: absteigend)' : 'absteigend (klicken: aufsteigend)';
  $$('#viewSwitch button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === state.view)));

  const ps = loadPresets();
  $('#presetSel').innerHTML = '<option value="">Preset …</option>' + ps.list.map(p =>
    '<option value="' + esc(p.name) + '">' + (p.name === ps.def ? '★ ' : '') + esc(p.name) + '</option>').join('');
  $('#presetDefault').classList.toggle('on', !!ps.def);

  const personHost = $('#fltUser');
  if (personHost && personHost.dataset.open !== '1') {
    comboBox(personHost, {
      options: uniq(bereichListe(state.bereich).map(i => i.zustaendig)),
      selected: state.personen, multi: true,
      placeholder: state.personen.length ? '' : 'alle Personen',
      onChange: (vals) => { state.personen = vals; render(); }
    });
  }

  const any = state.query || state.taetigkeit || state.status !== 'alle' || state.mine ||
    state.personen.length || state.zeitraumJahr || state.von || state.bis;
  $('#btnReset').hidden = !any;
  $('#resultInfo').textContent = aktuelleListe().length + ' Positionen sichtbar';

  const act = $('#viewAction');
  if (state.view === 'list' && (state.group === 'object' || state.group === 'task')) {
    const groups = groupItems(aktuelleListe(), state.group);
    const allOpen = groups.length > 0 && groups.every(g => state.expanded.has(g.key));
    act.innerHTML = '<button class="btn btn-sm btn-ghost" data-expand="' + (allOpen ? 'none' : 'all') + '">' +
      (allOpen ? 'Alle einklappen' : 'Alle ausklappen') + '</button>';
  } else {
    act.innerHTML = '';
  }
}

function renderBody() {
  const host = $('#tableHost');
  if (state.loading) {
    host.innerHTML = Array.from({ length: 10 }, () => '<div style="height:38px;border-bottom:1px solid var(--border-subtle);background:var(--layer-01);opacity:.4"></div>').join('');
    return;
  }
  const list = aktuelleListe();
  const at = activeTab();
  if (at && at.home) { host.innerHTML = renderHome(); return; }
  if (!list.length) {
    host.innerHTML = '<div style="padding:48px 16px;text-align:center;color:var(--text-helper)"><h3>Keine Positionen gefunden</h3><p style="font-size:12px;margin-top:6px">Überprüfen Sie die Filter oder das Suchfeld.</p></div>';
    return;
  }
  if (state.view === 'tiles') { host.innerHTML = viewTiles(list); return; }
  if (state.view === 'blobs') { host.innerHTML = viewBlobs(list); return; }
  if (state.group === 'none') { host.innerHTML = viewTable(list); return; }
  if (state.group === 'status') { host.innerHTML = viewTimeline(list); return; }
  host.innerHTML = viewGroupedList(list);
}

function tickControl(it) {
  const done = !!it.erledigt;
  return '<button class="tick' + (done ? ' on' : '') + '" data-tick="' + esc(keyOf(it)) + '" title="' + (done ? 'Erledigung zurücknehmen' : 'Als erledigt protokollieren') + '">' +
    svg(ICON.check, 14, 'tk-check') + svg(ICON.undo, 12, 'tk-undo') + '</button>';
}

function erledigtInfo(it) {
  if (!it.erledigt) return '<span class="loc-user">' + esc(it.zustaendig || '–') + '</span>';
  const note = String(it.erledigt_notiz || '').trim();
  return '<div class="ecell"><span class="ecell-sub">' + esc(it.erledigt_am || '') + ' · ' + esc(it.erledigt_durch || 'Erledigt') + '</span>' +
    (note ? '<span class="ecell-note" title="' + esc(note) + '">' + esc(note) + '</span>' : '<button class="btn-note" data-note="' + esc(keyOf(it)) + '">' + svg(ICON.notes, 11) + ' Notiz</button>') +
    '</div>';
}

function dueCell(it) {
  const s = statusOf(it), d = dueInfo(it.bis);
  return '<div class="loc-due"><span class="c-main">' + esc(it.bis || '–') + '</span><span class="c-sub ' + (s === 'over' ? 'due late' : (s === 'soon' ? 'due soon' : '')) + '">' + esc(d.text) + '</span></div>';
}

function linearProgress(pct) {
  const w = Math.max(0, Math.min(100, pct));
  return '<div class="loc-mini-track"><i style="width:' + w + '%"></i></div>';
}

function viewGroupedList(list) {
  const groups = sortGroups(groupItems(list, state.group));
  return '<div class="locs">' + groups.map(g => {
    const st = groupStats(g);
    const isOpen = state.expanded.has(g.key);
    let cls = 'loc';
    if (isOpen) cls += ' open';
    if (st.over) cls += ' is-overdue';
    else if (st.soon) cls += ' is-soon';
    else if (st.open === 0) cls += ' is-finished';

    const rows = sortItems(g.items).map(it => workRow(it, state.group === 'task')).join('');
    const nrCell = state.group === 'object'
      ? '<span class="loc-nr">' + esc(g.nr || '–') + '</span>'
      : '<span class="loc-nr"><span class="tag gray mini">' + (state.group === 'task' ? 'Tätigkeit' : 'Gruppe') + '</span></span>';

    return '<section class="' + cls + '">' +
      '<div class="loc-head" data-loc="' + esc(g.key) + '" role="button" tabindex="0">' +
        '<span class="loc-caret">' + svg(ICON.chevR, 14) + '</span>' +
        nrCell +
        '<div class="loc-title-col">' +
          '<span class="loc-name">' + esc(g.label) + '</span>' +
          (st.over ? '<span class="urgency-badge late">' + st.over + ' überfällig</span>' : '') +
          (st.open === 0 ? '<span class="urgency-badge done">Erledigt</span>' : '') +
        '</div>' +
        '<span class="loc-preview-col">' + esc(groupPreview(g)) + '</span>' +
        '<div class="loc-summary-col"><b>' + st.open + '/' + st.total + ' offen</b></div>' +
        '<div class="loc-progress-col">' + linearProgress(st.pct) + '<span>' + st.done + '/' + st.total + '</span></div>' +
        '<div class="loc-acts-col">' + (state.group === 'object' ? '<button class="td-act" data-termloc="' + esc(g.key) + '" title="Sammeltermin disponieren">' + svg(ICON.calendar, 15) + '</button>' : '') + '</div>' +
      '</div>' +
      (isOpen ? '<div class="loc-rows">' + rows + '</div>' : '') +
    '</section>';
  }).join('') + '</div>';
}

/** Kacheln: eine Karte je Gruppe mit Fortschrittsring und offenen Positionen. */
function viewTiles(list) {
  const groups = state.group === 'status' ? groupItems(list, 'status') : sortGroups(groupItems(list, state.group));
  return '<div class="tiles">' + groups.map(g => {
    const st = groupStats(g);
    const isOpen = state.expanded.has(g.key);
    const rows = isOpen ? sortItems(g.items).map(it => workRow(it, true)).join('') : '';
    return '<section class="tile' + (isOpen ? ' open' : '') + (st.open === 0 ? ' done' : '') + (st.over ? ' over' : '') + '">' +
      '<button class="tile-head" data-loc="' + esc(g.key) + '">' +
        '<span class="tile-ring" style="--pct:' + st.pct + '"><b>' + st.pct + '%</b></span>' +
        '<span class="tile-label" title="' + esc(g.label) + '">' + esc(g.label) + '</span>' +
        '<span class="tile-sub">' + st.open + ' offen · ' + st.done + '/' + st.total + '</span>' +
        (st.over ? '<span class="urgency-badge late">' + st.over + ' überfällig</span>' : '') +
      '</button>' +
      (isOpen ? '<div class="tile-rows">' + rows + '</div>' : '') +
    '</section>';
  }).join('') + '</div>';
}

/** Blasen: Kreis je Gruppe, Größe = Anzahl, Füllung = Fortschritt. */
function viewBlobs(list) {
  const groups = state.group === 'status' ? groupItems(list, 'status') : sortGroups(groupItems(list, state.group));
  const max = Math.max(1, groups.map(g => g.items.length).reduce((m, n) => Math.max(m, n), 1));
  const blobs = groups.map(g => {
    const st = groupStats(g);
    const size = 76 + Math.round(Math.sqrt(g.items.length / max) * 60);
    const isOpen = state.expanded.has(g.key);
    return '<button class="blob' + (isOpen ? ' open' : '') + (st.open === 0 ? ' done' : '') + (st.over ? ' over' : '') + '"' +
      ' data-loc="' + esc(g.key) + '" style="--size:' + size + 'px;--pct:' + st.pct + '" title="' + esc(g.label) + '">' +
      '<span class="blob-pct">' + st.pct + '%</span>' +
      '<span class="blob-label">' + esc(g.label) + '</span>' +
      '<span class="blob-sub">' + st.open + '/' + st.total + '</span>' +
    '</button>';
  }).join('');
  const detail = groups.filter(g => state.expanded.has(g.key)).map(g => {
    const st = groupStats(g);
    return '<section class="blob-detail"><h3>' + esc(g.label) + ' <span class="t-helper">' + st.open + ' offen</span></h3>' +
      sortItems(g.items).map(it => workRow(it, true)).join('') + '</section>';
  }).join('');
  return '<div class="blobs">' + blobs + '</div>' + detail;
}

/** Landing (Home-Tab): Begruessung, Kennzahlen und das Wichtigste auf einen Blick. */
const HOME_LIMIT = 6;
function renderHome() {
  const f = fortschritt();
  const offen = f.total - f.done;
  const offenPct = f.total ? Math.round(offen / f.total * 100) : 0;
  const c = countsForScope('wartung');
  const ueber = sortItems(state.items.filter(i => !i.erledigt && statusOf(i) === 'over'), 'due', 'asc');
  const bald = sortItems(state.items.filter(i => !i.erledigt && statusOf(i) === 'soon'), 'due', 'asc');
  const todos = state.todos.filter(t => !t.erledigt).map(markToDo);

  const kpi = (v, l, tone) => '<div class="kpi' + (tone ? ' ' + tone : '') + '"><b>' + v + '</b><span>' + esc(l) + '</span></div>';
  const sec = (titel, items, tone, leer) => '<section class="home-sec' + (tone ? ' ' + tone : '') + '">' +
    '<h2>' + esc(titel) + ' <span class="n">' + items.length + '</span></h2>' +
    (items.length
      ? '<div class="loc-rows">' + items.slice(0, HOME_LIMIT).map(it => workRow(it, true)).join('') + '</div>' +
        (items.length > HOME_LIMIT ? '<p class="home-more t-helper">+' + (items.length - HOME_LIMIT) + ' weitere</p>' : '')
      : '<p class="t-helper">' + esc(leer) + '</p>') +
    '</section>';

  return '<div class="home">' +
    '<header class="home-hero">' +
      '<h1>' + esc(gruss()) + '</h1>' +
      '<p class="home-sub">Es sind noch <b>' + offen + '</b> von <b>' + f.total + '</b> Wartungen offen – das entspricht <b>' + offenPct + ' %</b>. ' +
        'In diesem Jahr verbleiben noch <b>' + arbeitstageImJahr() + '</b> Arbeitstage.</p>' +
      '<div class="home-bar"><div class="home-track"><i style="width:' + f.pct + '%"></i></div>' +
        '<span>' + f.done + '/' + f.total + ' erledigt · ' + f.pct + ' %' + (f.personal ? ' (meine)' : '') + '</span></div>' +
    '</header>' +
    '<div class="home-kpis">' +
      kpi(offen, 'offen') + kpi(c.over, 'überfällig', 'over') + kpi(c.soon, 'bald fällig', 'soon') + kpi(c.done, 'erledigt', 'done') +
    '</div>' +
    sec('Überfällig', ueber, 'over', 'Nichts überfällig – gut.') +
    sec('Bald fällig', bald, 'soon', 'Nichts in Kürze fällig.') +
    sec('Eigene To-Dos', todos, 'todo', 'Keine offenen To-Dos.') +
  '</div>';
}

function workRow(it, showObject) {
  const k = esc(keyOf(it));
  return '<div class="loc-row' + (it.erledigt ? ' done' : '') + (istToDo(it) ? ' ist-todo' : '') + '" data-id="' + k + '">' +
    tickControl(it) +
    '<span class="loc-nr" style="opacity:.6">' + esc(it.objekt_nr || '') + '</span>' +
    '<div class="loc-task"><span class="c-main" title="' + esc(it.taetigkeit) + '">' + esc(it.taetigkeit || '–') + '</span>' + (showObject ? '<span class="c-sub">' + esc(it.objekt_name) + '</span>' : '') + '</div>' +
    '<span class="loc-note" title="' + esc(it.kommentar) + '">' + esc(it.kommentar || '–') + '</span>' +
    dueCell(it) +
    erledigtInfo(it) +
    '<div class="loc-acts-col">' +
      '<button class="td-act" data-term="' + k + '" title="Termin planen">' + svg(ICON.calendar, 14) + '</button>' +
      (istToDo(it) ? '<button class="td-act" data-todoedit="' + k + '" title="Bearbeiten">' + svg(ICON.edit, 14) + '</button>' : '<button class="td-act" data-open="' + k + '" title="Details">' + svg(ICON.chevR, 14) + '</button>') +
    '</div>' +
  '</div>';
}

function viewTable(list) {
  const rows = list.map(it => {
    const k = esc(keyOf(it));
    return '<tr data-id="' + k + '" class="' + (it.erledigt ? 'done' : '') + '">' +
      '<td style="width:36px">' + tickControl(it) + '</td>' +
      '<td><span class="c-main">' + esc(it.objekt_name || '–') + '</span><span class="c-sub">' + esc(it.objekt_nr || '') + '</span></td>' +
      '<td><span class="c-main">' + esc(it.taetigkeit || '–') + '</span></td>' +
      '<td>' + dueCell(it) + '</td>' +
      '<td>' + erledigtInfo(it) + '</td>' +
      '<td style="text-align:right"><button class="td-act" data-term="' + k + '">' + svg(ICON.calendar, 14) + '</button></td>' +
    '</tr>';
  }).join('');
  return '<div class="tbl-wrap"><table class="cds"><thead><tr><th></th><th>Standort</th><th>Tätigkeit</th><th>Frist</th><th>Zuständig / Erledigt</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function viewTimeline(list) {
  const groups = groupItems(list, 'status');
  return '<div class="plan">' + groups.map(g => {
    const isOpen = !state.collapsed.has('plan:' + g.key);
    const st = groupStats(g);
    const items = sortItems(g.items);
    return '<section class="plan-sec' + (isOpen ? ' open' : '') + '">' +
      '<button class="plan-head" data-plan="' + esc(g.key) + '"><span class="plan-caret">' + svg(ICON.chevR, 14) + '</span>' +
      '<span class="urgency-badge ' + statusTone(g.key.slice(3)) + '">' + g.label + '</span>' +
      '<span class="plan-sub">' + st.open + '/' + st.total + ' offen</span></button>' +
      (isOpen ? '<div class="loc-rows">' + items.map(i => workRow(i, true)).join('') + '</div>' : '') +
    '</section>';
  }).join('') + '</div>';
}

</script>

<script>
'use strict';
/* Wartungstool · JS · Detailpanel, Anhänge, Combo-Box */
/* ==========================================================================
   Details, Dialoge & Outlook/ICS Dispatch
   ========================================================================== */
function openPanel(id, opts = {}) {
  const it = state.items.find(x => String(x.id) === String(id));
  if (!it) return;
  state.panelId = String(id);

  const s = statusOf(it), d = dueInfo(it.bis);
  const val = (v, mono) => v ? '<dd' + (mono ? ' class="t-mono"' : '') + '>' + esc(v) + '</dd>' : '<dd class="empty-val">nicht angegeben</dd>';
  const line = (label, v, mono) => '<div class="row"><dt>' + label + '</dt>' + val(v, mono) + '</div>';

  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML =
    '<div class="panel" role="dialog" aria-modal="true" aria-label="Details zur Wartungsposition">' +
      '<header>' +
        '<h2>' + esc(it.objekt_name || 'Wartungsposition') + '</h2>' +
        '<button class="td-act" data-x aria-label="Schließen">' + svg(ICON.close, 16) + '</button>' +
      '</header>' +
      '<div class="body">' +
        '<div class="notice">' + svg(ICON.info, 16) + '<span>Stammdaten sind schreibgeschützt und werden in der Datenbank gepflegt. Änderbar sind Erledigung und Notiz.</span></div>' +
        '<div class="sect"><h3>Objekt</h3>' +
          line('Objektart', it.objekt_art) +
          line('Objekt-Nr.', it.objekt_nr, true) +
          line('Objektname', it.objekt_name) +
        '</div>' +
        '<div class="sect"><h3>Auftrag</h3>' +
          line('Tätigkeit', it.taetigkeit) +
          line('Beschreibung', it.beschreibung) +
          line('Kommentar', it.kommentar) +
          line('Frist bis', it.bis, true) +
          '<div class="row"><dt>Friststatus</dt><dd><span class="due ' + d.cls + '">' + esc(d.text) + '</span></dd></div>' +
          line('Zuständig', it.zustaendig) +
        '</div>' +
        '<div class="sect"><h3>Erledigung</h3>' +
          '<div class="tgl-row">' +
            '<div class="t"><b>Erledigt</b><span>Datum und Person werden protokolliert</span></div>' +
            '<button class="tgl" role="switch" aria-checked="' + !!it.erledigt + '" id="panelDone"></button>' +
          '</div>' +
          '<div id="doneFields" style="display:' + (it.erledigt ? 'block' : 'none') + '">' +
            '<div class="row"><dt>Erledigt am</dt><dd id="pDoneAm" class="t-mono">' + esc(it.erledigt_am || '–') + '</dd></div>' +
            '<div class="row"><dt>Erledigt durch</dt><dd id="pDoneBy">' + esc(it.erledigt_durch || '–') + '</dd></div>' +
            '<div class="fld" style="margin-top:12px">' +
              '<label for="panelNote">Notiz / Feststellung</label>' +
              '<textarea class="inp" id="panelNote" placeholder="z. B. RCD defekt">' + esc(it.erledigt_notiz || '') + '</textarea>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="sect"><h3>Anhänge</h3><div id="panelAtt"></div></div>' +
      '</div>' +
      '<div class="foot">' +
        '<button class="btn btn-tertiary" id="panelTermin">' + svg(ICON.calendar, 14) + 'Termin planen</button>' +
        '<span style="flex:1"></span>' +
        '<button class="btn btn-tertiary" data-x>Schließen</button>' +
        '<button class="btn btn-primary" id="panelSave" disabled>Notiz speichern</button>' +
      '</div>' +
    '</div>';

  const close = () => { scrim.remove(); state.panelId = null; document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
  document.addEventListener('keydown', onKey);

  scrim.addEventListener('click', async (e) => {
    if (e.target === scrim || e.target.closest('[data-x]')) return close();
    if (e.target.closest('#panelDone')) {
      const now = !state.items.find(x => String(x.id) === String(id)).erledigt;
      if (now && !await ensureUser()) return;
      if (now) {
        const data = await completionDialog(state.items.find(x => String(x.id) === String(id)));
        if (!data) return;
        await apply(id, data, scrim);
      } else {
        await apply(id, { erledigt: false, erledigt_am: '', erledigt_durch: '' }, scrim);
      }
    }
    if (e.target.closest('#panelSave')) {
      const v = scrim.querySelector('#panelNote').value;
      await finish(id, { erledigt_notiz: v });
      scrim.querySelector('#panelSave').disabled = true;
    }
    if (e.target.closest('#panelTermin')) dispatchTermin(findByKey('w:' + id));
  });

  async function apply(pid, patch, scope) {
    const updated = await finish(pid, patch);
    if (!updated) return;
    scope.querySelector('#panelDone').setAttribute('aria-checked', String(!!updated.erledigt));
    scope.querySelector('#doneFields').style.display = updated.erledigt ? 'block' : 'none';
    scope.querySelector('#pDoneAm').textContent = updated.erledigt_am || '–';
    scope.querySelector('#pDoneBy').textContent = updated.erledigt_durch || '–';
    if (!updated.erledigt) scope.querySelector('#panelNote').value = '';
    scope.querySelector('#panelSave').disabled = true;
  }

  const ta = scrim.querySelector('#panelNote');
  ta.addEventListener('input', () => { scrim.querySelector('#panelSave').disabled = ta.value === (it.erledigt_notiz || ''); });

  $('#overlay').appendChild(scrim);
  renderAttachments(scrim, 'wartung', id);
  setTimeout(() => {
    if (opts.focusNote && it.erledigt) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  }, 30);
}

const fmtBytes = (n) => {
  n = Number(n) || 0;
  return n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(0) + ' kB' : (n / 1048576).toFixed(1) + ' MB';
};

async function renderAttachments(scope, art, id) {
  const host = scope.querySelector('#panelAtt');
  if (!host) return;

  if (!store.supportsAttachments) {
    host.innerHTML = '<div class="t-helper">Anhänge benötigen das SQL-Backend.</div>';
    return;
  }
  host.innerHTML = '<div class="t-helper">Lade Anhänge …</div>';
  let list;
  try { list = (await store.listAttachments(art, id)) || []; } catch (e) { list = []; }

  host.innerHTML = (list.length
    ? '<ul class="atts">' + list.map(a =>
        '<li><a class="att" href="' + esc(store.attachmentUrl(art, id, a.id)) + '" target="_blank" rel="noopener">' +
        svg(ICON.notes, 14) + '<span>' + esc(a.dateiname) + '</span></a>' +
        '<span class="att-meta">' + fmtBytes(a.groesse) + '</span>' +
        '<button class="btn btn-sm btn-ghost" data-attdel="' + esc(a.id) + '">' + svg(ICON.close, 12) + '</button></li>').join('') + '</ul>'
    : '<div class="t-helper">Noch keine Anhänge hinterlegt.</div>') +
    '<label class="btn btn-sm btn-tertiary" style="margin-top:8px">' +
      svg(ICON.plus, 14) + 'Datei anhängen' +
      '<input type="file" id="panelFile" hidden></label>';

  const fileEl = host.querySelector('#panelFile');
  fileEl.addEventListener('change', async e => {
    const f = e.target.files[0];
    if (!f) return;
    try {
      await store.uploadAttachment(art, id, f, '');
      toast('Anhang hinzugefügt', { tone: 'success' });
      renderAttachments(scope, art, id);
    } catch (err) { toast('Fehler beim Hochladen', { tone: 'error' }); }
  });

  host.querySelectorAll('[data-attdel]').forEach(b => b.addEventListener('click', async () => {
    try {
      await store.removeAttachment(art, id, b.dataset.attdel);
      toast('Anhang gelöscht', { tone: 'success' });
      renderAttachments(scope, art, id);
    } catch (err) { toast('Fehler beim Löschen', { tone: 'error' }); }
  }));
}

function comboBox(host, { options = [], selected = [], multi = false, placeholder = 'suchen …', onChange }) {
  if (!host) return;
  if (host.__comboCleanup) host.__comboCleanup();
  const sel = multi ? (Array.isArray(selected) ? selected.slice() : []) : [];
  let single = multi ? '' : (Array.isArray(selected) ? (selected[0] || '') : (selected || ''));
  let query = '', active = -1;

  host.innerHTML =
    '<div class="combo">' +
      '<div class="combo-field">' +
        '<span class="combo-chips"></span>' +
        '<input class="combo-input" type="text" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false">' +
        '<span class="combo-carets">' + svg(ICON.chevD, 14) + '</span>' +
      '</div>' +
      '<div class="combo-list" role="listbox" hidden></div>' +
    '</div>';

  const field = host.querySelector('.combo-field');
  const input = host.querySelector('.combo-input');
  const list = host.querySelector('.combo-list');
  const chips = host.querySelector('.combo-chips');

  const currentValues = () => multi ? sel : (single ? [single] : []);
  const filtered = () => {
    const q = norm(query);
    return options.filter(o => !currentValues().includes(o) && (!q || norm(o).includes(q)));
  };

  const syncValue = () => {
    host.dataset.value = multi ? sel.join(' | ') : single;
    input.placeholder = multi && sel.length ? '' : (single ? '' : placeholder);
  };

  function renderChips() {
    chips.innerHTML = currentValues().map(v =>
      '<span class="combo-chip" data-v="' + esc(v) + '">' + esc(v) +
      '<button type="button" class="combo-x" data-del="' + esc(v) + '">' + svg(ICON.close, 10) + '</button></span>').join('');
  }

  function renderList() {
    const f = filtered();
    active = Math.max(-1, Math.min(f.length - 1, active));
    list.innerHTML = f.length
      ? f.map((o, i) => '<button type="button" class="combo-opt' + (i === active ? ' on' : '') + '" data-i="' + i + '">' + esc(o) + '</button>').join('')
      : '<div style="padding:6px 10px;font-size:11px;color:var(--text-helper)">kein Treffer</div>';
  }

  function open() {
    if (!list.hidden) return;
    list.hidden = false;
    input.setAttribute('aria-expanded', 'true');
    host.dataset.open = '1';
    renderList();
  }
  function close() {
    list.hidden = true;
    input.setAttribute('aria-expanded', 'false');
    host.dataset.open = '';
    query = ''; input.value = ''; active = -1;
  }
  const commit = (vals) => {
    if (multi) { sel.length = 0; sel.push(...vals); }
    else single = vals[0] || '';
    syncValue(); renderChips(); renderList();
    if (onChange) onChange(multi ? sel.slice() : single);
  };

  field.addEventListener('click', e => {
    const del = e.target.closest('[data-del]');
    if (del) { e.stopPropagation(); commit(currentValues().filter(v => v !== del.dataset.del)); return; }
    if (!e.target.closest('.combo-x')) { open(); input.focus(); }
  });
  input.addEventListener('focus', open);
  input.addEventListener('input', () => { query = input.value; active = -1; open(); renderList(); });
  input.addEventListener('keydown', e => {
    const f = filtered();
    if (e.key === 'ArrowDown') { e.preventDefault(); open(); active = Math.min(f.length - 1, active + 1); renderList(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(0, active - 1); renderList(); }
    else if (e.key === 'Enter') {
      e.preventDefault(); e.stopPropagation();
      if (active >= 0 && f[active]) commit(multi ? sel.concat([f[active]]) : [f[active]]);
      else if (input.value.trim()) commit(multi ? sel.concat([input.value.trim()]) : [input.value.trim()]);
      if (!multi) close(); else { query = ''; input.value = ''; renderList(); }
    }
    else if (e.key === 'Escape') { e.stopPropagation(); close(); }
    else if (e.key === 'Backspace' && !input.value && currentValues().length) {
      const v = currentValues(); v.pop(); commit(v);
    }
  });
  list.addEventListener('mousedown', e => {
    const o = e.target.closest('.combo-opt');
    if (!o) return;
    e.preventDefault();
    commit(multi ? sel.concat([filtered()[+o.dataset.i]]) : [filtered()[+o.dataset.i]]);
    if (!multi) close(); else { query = ''; input.value = ''; input.focus(); renderList(); }
  });

  const onDoc = (e) => { if (!host.contains(e.target)) close(); };
  document.addEventListener('mousedown', onDoc);
  host.__comboCleanup = () => document.removeEventListener('mousedown', onDoc);
  syncValue(); renderChips();
}

</script>

<script>
'use strict';
/* Wartungstool · JS · Termin-Disposition (Outlook/ICS) */
/* ==========================================================================
   Termin-Disposition (Outlook Web + ICS für Desktop)
   ========================================================================== */
const localIso = (d) => d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) +
  'T' + p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':00';
const fmtIso = (d) => d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
const icsTime = (d) => d.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
const icsDay = (d) => String(d.getFullYear()) + p2(d.getMonth() + 1) + p2(d.getDate());

function terminBody(it) {
  return [
    'Zuständig: ' + (it.zustaendig || '-'),
    it.kommentar ? 'Hinweis: ' + it.kommentar : null,
    it.intervall ? 'Intervall: ' + it.intervall : null
  ].filter(Boolean).join('\n');
}
const terminOrt = (it) => (it.ort || ((it.objekt_nr || '') + ' ' + (it.objekt_name || ''))).trim();
const terminSubject = (it) => it.subject || it.taetigkeit || 'Wartung';

function outlookWebUrl(it, o) {
  const params = new URLSearchParams({
    path: '/calendar/action/compose', rru: 'addevent',
    subject: terminSubject(it), location: terminOrt(it),
    startdt: o.allDay ? fmtIso(o.start) : localIso(o.start),
    enddt: o.allDay ? fmtIso(o.ende) : localIso(o.ende),
    body: terminBody(it)
  });
  if (o.allDay) params.append('allday', 'true');
  const to = (o.attendees || []).filter(Boolean);
  if (to.length) params.append('to', to.join(';'));
  return 'https://outlook.office.com/calendar/deeplink/compose?' + params.toString();
}

function icsText(it, o) {
  const esc1 = (s) => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
  const uid = ((it.external_id || String(it.id)) + '-' + Date.now()) + '@wartungstool';
  const dtstart = o.allDay ? 'DTSTART;VALUE=DATE:' + icsDay(o.start) : 'DTSTART:' + icsTime(o.start);
  const dtend = o.allDay ? 'DTEND;VALUE=DATE:' + icsDay(o.ende) : 'DTEND:' + icsTime(o.ende);
  return [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Wartungstool//DE', 'CALSCALE:GREGORIAN', 'METHOD:REQUEST',
    'BEGIN:VEVENT', 'UID:' + uid, 'DTSTAMP:' + icsTime(new Date()),
    'SUMMARY:' + esc1(terminSubject(it)), 'LOCATION:' + esc1(terminOrt(it)),
    'DESCRIPTION:' + esc1(terminBody(it)), dtstart, dtend, 'END:VEVENT', 'END:VCALENDAR'
  ].join('\r\n');
}

function terminZielStandort(g) {
  return {
    key: 'loc:' + (g.nr || g.name), subject: 'Wartungsarbeiten Sammeltermin',
    ort: ((g.nr || '') + ' ' + (g.name || '')).trim(),
    zustaendig: uniq(g.items.map(i => i.zustaendig)).join(', '),
    extra: g.items.length + ' Positionen'
  };
}
function terminZielPosition(it) {
  return {
    key: keyOf(it), subject: it.taetigkeit || 'Wartung',
    ort: terminOrt(it), zustaendig: it.zustaendig, kommentar: it.kommentar,
    ab: it.ab, bis: it.bis
  };
}

function terminDialog(ziel) {
  const heute = new Date(); heute.setHours(0, 0, 0, 0);
  const ab = parseDate(ziel.ab);
  const tag = (ab && ab > heute) ? ab : heute;
  const mails = (settings.dispoMail || CONFIG.dispoMail).split(',').map(x => x.trim()).filter(Boolean);

  return new Promise(resolve => {
    const scrim = document.createElement('div');
    scrim.className = 'modal-scrim';
    scrim.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true">' +
        '<header><h3>Termin disponieren</h3><button class="close" data-x>' + svg(ICON.close, 16) + '</button></header>' +
        '<div class="body">' +
          '<div class="fld"><label for="dBetreff">Betreff</label>' +
            '<input class="inp" id="dBetreff" value="' + esc(ziel.subject) + '"></div>' +
          '<div class="row"><dt>Ort</dt><dd class="t-mono">' + esc(ziel.ort || '–') + '</dd></div>' +
          (ziel.zustaendig ? '<div class="row"><dt>Zuständig</dt><dd>' + esc(ziel.zustaendig) + '</dd></div>' : '') +
          '<div class="fld" style="margin-top:12px"><label>Art</label>' +
            '<div class="status-seg" id="dArt">' +
              '<button type="button" class="seg-btn" data-art="all" aria-pressed="true">Ganztägig</button>' +
              '<button type="button" class="seg-btn" data-art="time" aria-pressed="false">Mit Uhrzeit</button>' +
            '</div></div>' +
          '<div class="fld" id="dDayWrap"><label for="dTag">Datum</label>' +
            '<input class="inp" id="dTag" type="date" value="' + fmtIso(tag) + '"></div>' +
          '<div class="fgrid" id="dTimeWrap" hidden>' +
            '<div><label>Beginn</label><input class="inp" id="dStart" type="datetime-local" value="' + toLocalInput(zeitAm(tag)) + '"></div>' +
            '<div><label>Ende</label><input class="inp" id="dEnde" type="datetime-local" value="' + toLocalInput(endeAm(tag)) + '"></div>' +
          '</div>' +
          '<div class="fld"><label>Teilnehmer</label><div class="combo-host" id="dTeil"></div></div>' +
        '</div>' +
        '<div class="foot">' +
          '<button class="btn btn-ghost" data-ics>' + svg(ICON.download, 14) + 'ICS für Outlook</button>' +
          '<span style="flex:1"></span>' +
          '<button class="btn btn-tertiary" data-x>Abbrechen</button>' +
          '<button class="btn btn-primary" data-web>' + svg(ICON.calendar, 14) + 'In Outlook Web öffnen</button>' +
        '</div>' +
      '</div>';

    const art = () => scrim.querySelector('#dArt button[aria-pressed="true"]').dataset.art;
    scrim.querySelector('#dArt').addEventListener('click', e => {
      const b = e.target.closest('[data-art]'); if (!b) return;
      scrim.querySelectorAll('#dArt button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      const isAll = b.dataset.art === 'all';
      scrim.querySelector('#dDayWrap').hidden = !isAll;
      scrim.querySelector('#dTimeWrap').hidden = isAll;
    });

    comboBox(scrim.querySelector('#dTeil'), {
      options: uniq(mails.concat([CONFIG.dispoMail, settings.dispoMail])), selected: mails,
      multi: true, placeholder: 'E-Mail eingeben'
    });

    const collect = () => {
      const att = scrim.querySelector('#dTeil').dataset.value.split('|').map(x => x.trim()).filter(Boolean);
      const isAll = art() === 'all';
      const it = { subject: scrim.querySelector('#dBetreff').value.trim() || ziel.subject, ort: ziel.ort, zustaendig: ziel.zustaendig, kommentar: ziel.kommentar, external_id: ziel.key };
      if (isAll) {
        const d = scrim.querySelector('#dTag').value;
        const start = new Date(d + 'T00:00:00');
        return { allDay: true, start, ende: new Date(start.getTime() + 86400000), attendees: att, it };
      }
      const s1 = new Date(scrim.querySelector('#dStart').value), e1 = new Date(scrim.querySelector('#dEnde').value);
      return { allDay: false, start: s1, ende: e1, attendees: att, it };
    };

    const done = (v) => { scrim.remove(); resolve(v); };
    scrim.addEventListener('click', e => {
      if (e.target === scrim || e.target.closest('[data-x]')) return done(null);
      const isWeb = !!e.target.closest('[data-web]'), isIcs = !!e.target.closest('[data-ics]');
      if (!isWeb && !isIcs) return;
      const o = collect();
      if (o.attendees.length) { settings.dispoMail = o.attendees.join(', '); saveSettings(); }
      done({ action: isWeb ? 'web' : 'ics', o });
    });
    $('#overlay').appendChild(scrim);
  });
}

function zeitAm(tag) { const d = new Date(tag.getTime()); d.setHours(8, 30, 0, 0); return d; }
function endeAm(tag) { const d = new Date(tag.getTime()); d.setHours(11, 30, 0, 0); return d; }
function toLocalInput(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + 'T' + p2(d.getHours()) + ':' + p2(d.getMinutes()); }

async function dispatchTermin(rec) {
  if (!rec) return;
  const ziel = rec.key ? rec : terminZielPosition(rec);
  const res = await terminDialog(ziel);
  if (!res) return;
  const it = res.o.it;
  if (res.action === 'web') {
    window.open(outlookWebUrl(it, res.o), '_blank', 'noopener,noreferrer');
    toast('Outlook Web geöffnet', { tone: 'success' });
  } else {
    download('Termin_' + ((it.ort || '') + '_' + (it.subject || 'Wartung')).replace(/[^\w.-]+/g, '_').slice(0, 50) + '.ics', icsText(it, res.o), 'text/calendar');
    toast('ICS-Datei erstellt', { tone: 'success' });
  }
}

</script>

<script>
'use strict';
/* Wartungstool · JS · To-Do- und Erledigungs-Dialoge */
/* ==========================================================================
   To-Do und Erledigungs-Dialoge
   ========================================================================== */
const TODO_FIELDS = {
  taetigkeit: '', objekt_nr: '', objekt_name: '', kommentar: '', ab: '', bis: '',
  zustaendig: '', erledigt: false, erledigt_am: '', erledigt_durch: '', erledigt_notiz: '',
  objekt_art: 'To-Do'
};
const normalizeTodo = (r) => markToDo(Object.assign({}, TODO_FIELDS, r, {
  id: r.id ?? null,
  erledigt: r.erledigt === true || r.erledigt === 1 || r.erledigt === '1' || r.erledigt === 'true'
}));

const istBereichTodo = () => state.bereich === 'todo';
const istBereichAlle = () => state.bereich === 'alle';

function todoDialog(key) {
  const t = key == null ? null : (findByKey(key) || null);
  const d = t ? Object.assign({}, t) : Object.assign({}, TODO_FIELDS, {
    zustaendig: state.user || '', bis: fmtDate(new Date(Date.now() + 14 * 86400000))
  });
  const objList = objects();

  return modal({
    title: t ? 'To-Do bearbeiten' : 'Neues To-Do',
    tertiary: t ? 'Löschen' : null,
    bodyHtml:
      '<div class="fld"><label for="tText">Aufgabe</label>' +
        '<input class="inp" id="tText" value="' + esc(d.taetigkeit) + '"></div>' +
      '<div class="fld"><label for="tObjekt">Standortbezug (optional)</label>' +
        '<div class="combo-host" id="tObjekt"></div></div>' +
      '<div class="fld"><label for="tFaellig">Frist</label>' +
        '<input class="inp" id="tFaellig" value="' + esc(d.bis) + '"></div>' +
      '<div class="fld"><label for="tPerson">Zuständig</label>' +
        '<div class="combo-host" id="tPerson"></div></div>' +
      '<div class="fld"><label for="tNote">Anmerkung</label>' +
        '<textarea class="inp" id="tNote">' + esc(d.kommentar) + '</textarea></div>',
    primary: t ? 'Speichern' : 'To-Do anlegen',
    collect: (s) => {
      const bezug = s.querySelector('#tObjekt').dataset.value.trim();
      const nr = (bezug.match(/^(\S+)\s*(.*)$/) || ['', '', '']);
      return {
        id: t ? t.id : null,
        taetigkeit: s.querySelector('#tText').value.trim(),
        objekt_nr: nr[1] || '',
        objekt_name: nr[2] || '',
        bis: s.querySelector('#tFaellig').value.trim(),
        zustaendig: s.querySelector('#tPerson').dataset.value.trim(),
        kommentar: s.querySelector('#tNote').value.trim()
      };
    },
    validate: (x) => !x.taetigkeit ? 'Bitte die Aufgabe beschreiben.' : null,
    onMount: (s) => {
      comboBox(s.querySelector('#tObjekt'), {
        options: objList.map(o => o.nr + ' ' + o.name), selected: d.objekt_nr ? d.objekt_nr + ' ' + d.objekt_name : '',
        multi: false, placeholder: 'ohne Bezug'
      });
      comboBox(s.querySelector('#tPerson'), {
        options: uniq([state.user].concat(state.items.map(i => i.zustaendig)).filter(Boolean)),
        selected: d.zustaendig, multi: false, placeholder: 'Nachname, Vorname'
      });
    },
    onTertiary: () => { if (t) deleteTodo(t.id); return false; }
  });
}

function objects() {
  const m = new Map();
  for (const it of state.items) {
    const k = groupKey(it);
    if (!m.has(k)) m.set(k, { nr: it.objekt_nr, name: it.objekt_name });
  }
  return Array.from(m.values()).sort((a, b) => (a.nr || '').localeCompare(b.nr || '', 'de', { numeric: true }));
}

async function saveTodo(data) {
  const saved = await store.saveTodo(data);
  const n = normalizeTodo(saved);
  const i = state.todos.findIndex(x => String(x.id) === String(n.id));
  if (i >= 0) state.todos[i] = n; else state.todos.push(n);
  render();
  return n;
}

async function deleteTodo(id) {
  await store.removeTodo(id);
  state.todos = state.todos.filter(x => String(x.id) !== String(id));
  render();
  toast('To-Do gelöscht', { tone: 'warning' });
}

async function todoDone(key, on) {
  const t = findByKey(key);
  if (!t) return;
  if (on && !await ensureUser()) return;
  await saveTodo(Object.assign({}, t, on
    ? { erledigt: true, erledigt_am: fmtDate(new Date()), erledigt_durch: state.user }
    : { erledigt: false, erledigt_am: '', erledigt_durch: '' }));
  toast(on ? 'To-Do erledigt' : 'To-Do wieder offen', { tone: on ? 'success' : 'warning' });
}

function completionDialog(it) {
  const known = uniq(state.items.map(i => i.zustaendig));
  const persons = uniq([state.user].concat(known).filter(Boolean));
  return modal({
    title: 'Wartung abschließen',
    bodyHtml:
      '<p class="t-body" style="margin-bottom:4px">' + esc(it.objekt_name || '') + '</p>' +
      '<p class="t-helper" style="margin-bottom:12px">' + esc(it.taetigkeit || '') + '</p>' +
      '<div class="fld"><label for="mDate">Erledigt am</label>' +
        '<input class="inp" id="mDate" value="' + esc(fmtDate(new Date())) + '"></div>' +
      '<div class="fld"><label for="mBy">Erledigt durch</label>' +
        '<div class="combo-host" id="mBy" data-value="' + esc(state.user) + '"></div></div>' +
      '<div class="fld"><label for="mNote">Abschlusskommentar</label>' +
        '<textarea class="inp" id="mNote"></textarea></div>',
    primary: 'Abschluss speichern',
    collect: (s) => ({
      erledigt: true,
      erledigt_am: s.querySelector('#mDate').value.trim() || fmtDate(new Date()),
      erledigt_durch: s.querySelector('#mBy').dataset.value.trim() || state.user,
      erledigt_notiz: s.querySelector('#mNote').value.trim()
    }),
    onMount: (s) => {
      comboBox(s.querySelector('#mBy'), { options: persons, selected: state.user, multi: false });
    }
  });
}

async function finish(id, patch) {
  const it = state.items.find(x => String(x.id) === String(id));
  if (!it) return null;
  const before = Object.assign({}, it);
  Object.assign(it, patch);
  render();
  try {
    const saved = await store.complete(id, patch);
    Object.assign(it, saved);
    state.online = true;
  } catch (e) {
    Object.assign(it, before);
    state.online = false;
    render();
    toast('Fehler beim Speichern', { tone: 'error' });
    return null;
  }
  return it;
}

async function markDone(id) {
  const it = state.items.find(x => String(x.id) === String(id));
  if (!it) return;
  if (!await ensureUser()) return;
  const data = await completionDialog(it);
  if (!data) return;
  await finish(id, data);
  toast('Wartung abgeschlossen', { tone: 'success' });
}

async function reopen(id) {
  await finish(id, { erledigt: false, erledigt_am: '', erledigt_durch: '' });
  toast('Erledigung zurückgenommen', { tone: 'warning' });
}

async function ensureUser() {
  if (state.user) return true;
  const r = await userDialog('Name für die Protokollierung', 'Übernehmen',
    'Der Name wird bei jeder Erledigung als „erledigt durch" gespeichert.', CONFIG.currentUser || '');
  if (!r) return false;
  applyUser(r.name);
  return true;
}

function userDialog(title, primary, hint, current) {
  return modal({
    title: title,
    bodyHtml:
      '<p class="t-body" style="margin-bottom:12px">' + hint + '</p>' +
      '<div class="fld"><label for="mUser">Nachname, Vorname</label>' +
      '<input class="inp" id="mUser" value="' + esc(current) + '" placeholder="Nachname, Vorname"></div>',
    primary: primary,
    collect: (s) => ({ name: s.querySelector('#mUser').value.trim() }),
    validate: (d) => d.name ? null : 'Bitte einen Namen angeben.'
  });
}

function applyUser(name) {
  state.user = name;
  try { localStorage.setItem(CONFIG.userKey, name); } catch {}
  render();
}

function settingsDialog() {
  return modal({
    title: 'Einstellungen',
    primary: 'Speichern',
    bodyHtml:
      '<div class="fld"><label>Design</label>' +
        '<div class="status-seg" id="sTheme">' +
          ['light', 'dark', 'auto'].map(t =>
            '<button type="button" class="seg-btn" data-theme="' + t + '" aria-pressed="' + (settings.theme === t) + '">' +
            ({ light: 'Hell', dark: 'Dunkel', auto: 'Automatisch' })[t] + '</button>').join('') +
        '</div></div>' +
      '<div class="fld"><label for="sMail">Standard-Teilnehmer für Termine</label>' +
        '<input class="inp" id="sMail" value="' + esc(settings.dispoMail) + '"></div>' +
      '<div class="fld"><label for="sUser">Mein Name</label>' +
        '<input class="inp" id="sUser" value="' + esc(state.user) + '"></div>',
    collect: (s) => ({
      theme: s.querySelector('#sTheme button[aria-pressed="true"]').dataset.theme,
      dispoMail: s.querySelector('#sMail').value.trim(),
      user: s.querySelector('#sUser').value.trim()
    }),
    onMount: (s) => {
      s.querySelector('#sTheme').addEventListener('click', e => {
        const b = e.target.closest('[data-theme]'); if (!b) return;
        s.querySelectorAll('#sTheme button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
        settings.theme = b.dataset.theme;
        applyTheme();
      });
    }
  }).then((d) => {
    if (!d) return false;
    settings.dispoMail = d.dispoMail || CONFIG.dispoMail;
    settings.theme = d.theme;
    saveSettings();
    applyTheme();
    if (d.user && d.user !== state.user) applyUser(d.user);
    render();
    toast('Einstellungen gespeichert', { tone: 'success' });
    return true;
  });
}

function exportCsv() {
  const list = filtered(state.items);
  const cols = ['id', 'objekt_nr', 'objekt_name', 'taetigkeit', 'kommentar', 'ab', 'bis', 'zustaendig', 'erledigt', 'erledigt_am'];
  const q = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const csv = [cols.join(';')].concat(list.map(i => cols.map(c => q(i[c])).join(';'))).join('\r\n');
  download('wartungen_' + isoStamp() + '.csv', '\uFEFF' + csv, 'text/csv');
}
function exportJson() {
  download('wartungen_' + isoStamp() + '.json', JSON.stringify(filtered(state.items), null, 2));
}

function shortcutsDialog() {
  const rows = [['/', 'Suche fokussieren'], ['↑ ↓', 'Zeilen durchlaufen'], ['Enter', 'Details öffnen'],
    ['E', 'Position abhaken'], ['M', 'Ansicht wechseln'], ['P', 'Drucken'], ['Esc', 'Schließen']];
  modal({
    title: 'Tastenkürzel',
    primary: 'Schließen',
    bodyHtml: '<dl style="display:grid;grid-template-columns:100px 1fr;gap:6px 12px">' + rows.map(r =>
      '<dt class="t-mono" style="font-size:12px;color:var(--text-secondary)">' + esc(r[0]) + '</dt>' +
      '<dd class="t-body">' + esc(r[1]) + '</dd>').join('') + '</dl>'
  });
}
