<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wartungstool – Technik Außeneinsatz</title>
<meta name="color-scheme" content="light dark">
<meta name="description" content="Wartungsdisposition für Techniker im Außeneinsatz – Erledigung und Auskunft">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23161616'/><path d='M8 21.5 13 10.5l3.4 6.6L18.6 14 24 21.5z' fill='none' stroke='%23f4f4f4' stroke-width='2' stroke-linejoin='round'/></svg>">
<style>
/* ==========================================================================
   Wartungstool – Design nach IBM Carbon Design System
   Theme: g100 (dunkel) mit nochmals abgedunkelter Bildfläche ("near black")
   Kennzeichen: 0 px Radius (außer Tags), 1 px Hairlines, IBM Plex Sans,
   48-px-Zeilen, 40-px-Bedienelemente, 2-px-Fokusrahmen.
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
/* Wichtig: eigene display-Regeln (z. B. .btn{display:inline-flex}) überschreiben
   sonst das hidden-Attribut – dann bleiben Elemente sichtbar, die weg sein müssen. */
[hidden]{display:none !important}

:root{
  color-scheme:dark;
  /* Farbtöne – Carbon g100 (dunkel) */
  --bg:#0f0f0f;                 /* Bildfläche */
  --layer-01:#1c1c1c;           /* Kacheln, Werkzeugleiste, Felder */
  --layer-02:#262626;           /* Tabellenkopf, Dialoge */
  --layer-03:#333333;
  --field:#1c1c1c;
  --field-hover:#262626;
  --hover-1:#1c1c1c;            /* dezenter Zeilen-Hover */
  --hover-2:#262626;            /* kräftiger Hover */
  --sel-bg:#1b2a4a;             /* aktive Auswahl */
  --sel-fg:#dbeafe;
  --scrim:rgba(0,0,0,.55);

  /* Kopfzeile (UI-Shell) – folgt dem Design, war vorher fest dunkel */
  --hdr-bg:#161616; --hdr-hover:#353535; --hdr-active:#4c4c4c;

  /* Ergänzende Flächen/Töne. Diese Variablen wurden benutzt, aber nie
     definiert – dadurch waren Suche, Fokusring und Schatten wirkungslos. */
  --panel:var(--field);
  --row-alt:#161616;            /* Zebra-Zeilen (abwechselnde Schattierung) */
  --muted:var(--text-helper);
  --border-2:#393939;
  --support-info:var(--info);
  --ring:0 0 0 1px var(--interactive);
  --shadow-2:0 2px 10px rgba(0,0,0,.45);

  --border-subtle:#2b2b2b;
  --border-strong:#5c5c5c;
  --border-inverse:#f4f4f4;

  --text-primary:#f4f4f4;
  --text-secondary:#c6c6c6;
  --text-helper:#8d8d8d;
  --text-disabled:#525252;
  --text-placeholder:#6f6f6f;
  --text-on-color:#ffffff;

  --link:#78a9ff;
  --interactive:#0f62fe;        /* Carbon Blau 60 */
  --interactive-hover:#0353e9;
  --interactive-active:#002d9c;
  --interactive-light:#4589ff;
  --focus:#ffffff;

  --success:#42be65;
  --warning:#f1c21b;
  --error:#fa4d56;
  --info:#4589ff;

  --tag-green-bg:#044317;  --tag-green-fg:#a7f0ba;
  --tag-red-bg:#750e13;    --tag-red-fg:#ffd7d9;
  --tag-yellow-bg:#684e00; --tag-yellow-fg:#fdd13a;
  --tag-blue-bg:#0043ce;   --tag-blue-fg:#d0e2ff;
  --tag-gray-bg:#393939;   --tag-gray-fg:#f4f4f4;

  --font:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,'Courier New',monospace;

  --row-h:48px;
  --ctl-h:40px;
  --hdr-h:48px;
  --nav-w:256px;
  --z-header:60; --z-nav:50; --z-sticky:20; --z-action:70; --z-overlay:90; --z-toast:100;
}

/* --------------------------------------------------------------------------
   Carbon g10 (hell) – Standard. Auch die Kopfzeile folgt dem Design; sie wird
   über --hdr-bg aufgehellt statt fest dunkel zu bleiben.
   -------------------------------------------------------------------------- */
html[data-theme="light"]{
  --bg:#ffffff;
  --layer-01:#f4f4f4;
  --layer-02:#ffffff;
  --layer-03:#e0e0e0;
  --field:#f4f4f4;
  --field-hover:#e8e8e8;
  --hover-1:#f4f4f4;
  --hover-2:#e8e8e8;
  --sel-bg:#edf5ff;
  --sel-fg:#0043ce;
  --scrim:rgba(22,22,22,.5);

  --border-subtle:#e0e0e0;
  --border-strong:#8d8d8d;
  --border-inverse:#161616;

  --text-primary:#161616;
  --text-secondary:#525252;
  --text-helper:#6f6f6f;
  --text-disabled:#c6c6c6;
  --text-placeholder:#a8a8a8;
  --text-on-color:#ffffff;

  --link:#0f62fe;
  --interactive:#0f62fe;
  --interactive-hover:#0353e9;
  --interactive-active:#002d9c;
  --interactive-light:#0f62fe;
  --focus:#0f62fe;

  --success:#24a148;
  --warning:#8e6a00;
  --error:#da1e28;
  --info:#0043ce;

  --tag-green-bg:#a7f0ba;  --tag-green-fg:#044317;
  --tag-red-bg:#ffd7d9;    --tag-red-fg:#750e13;
  --tag-yellow-bg:#fdd13a; --tag-yellow-fg:#3d2c00;
  --tag-blue-bg:#d0e2ff;   --tag-blue-fg:#0043ce;
  --tag-gray-bg:#d0d0d0;   --tag-gray-fg:#161616;

  color-scheme:light;
  /* Helle Kopfzeile statt festem Dunkel */
  --hdr-bg:#f4f4f4; --hdr-hover:#e8e8e8; --hdr-active:#dcdcdc;
  --row-alt:#eef1f5;            /* Zebra-Zeilen: weiß ⇄ helles Grau */
  --border-2:#c6c6c6;
  --shadow-2:0 2px 10px rgba(22,22,22,.18);
}

html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text-primary);font-family:var(--font);
  font-size:14px;line-height:20px;letter-spacing:.16px;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--link)}
dl,dd,dt,h1,h2,h3,p{margin:0}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
::selection{background:var(--interactive);color:#fff}

/* Typografie (Carbon-Typenskala) */
.t-label{font-size:12px;line-height:16px;letter-spacing:.32px;color:var(--text-secondary)}
.t-helper{font-size:12px;line-height:16px;letter-spacing:.32px;color:var(--text-helper)}
.t-body{font-size:14px;line-height:20px;letter-spacing:.16px}
.t-strong{font-weight:600}
.t-mono{font-family:var(--mono)}

/* ==========================================================================
   UI-Shell: Kopfzeile
   ========================================================================== */
.shell-header{
  height:var(--hdr-h);flex:0 0 auto;background:var(--hdr-bg);border-bottom:1px solid var(--border-subtle);
  display:flex;align-items:stretch;position:relative;z-index:var(--z-header)
}
.hdr-btn{
  width:var(--hdr-h);height:var(--hdr-h);display:grid;place-items:center;color:var(--text-primary);
  flex:0 0 auto;transition:background .11s
}
.hdr-btn:hover{background:var(--hdr-hover)}
.hdr-btn:active{background:var(--hdr-active)}
.hdr-btn[aria-expanded="true"]{background:var(--hdr-hover)}
.hdr-brand{display:flex;align-items:center;gap:12px;padding:0 16px;flex:0 0 auto;min-width:0}
.hdr-name{font-size:14px;font-weight:600;letter-spacing:.16px;white-space:nowrap}
.hdr-sub{font-size:12px;letter-spacing:.32px;color:var(--text-helper);white-space:nowrap}
.hdr-div{width:1px;background:var(--border-subtle);flex:0 0 auto;margin:12px 0}
.hdr-spacer{flex:1 1 auto}
.hdr-status{display:flex;align-items:center;gap:8px;padding:0 16px;flex:0 0 auto}
.hdr-status .led{width:8px;height:8px;border-radius:50%;background:var(--success);flex:0 0 auto}
.hdr-status.api .led{background:var(--info)}
.hdr-status.offline .led{background:var(--error)}
.hdr-status.busy .led{background:var(--warning)}
.hdr-status span{font-size:12px;letter-spacing:.32px;color:var(--text-secondary);white-space:nowrap}

/* Datenquelle: dezent in der Fußzeile, mittig – statt prominent im Kopf */
.app-foot{flex:0 0 auto;height:26px;display:flex;align-items:center;justify-content:center;
  background:var(--bg);border-top:1px solid var(--border-subtle)}
.app-foot .hdr-status{padding:0;gap:6px}
.app-foot .hdr-status .led{width:6px;height:6px}
.app-foot .hdr-status span{font-size:11px;color:var(--text-helper)}
.hdr-user{display:flex;align-items:center;gap:8px;height:var(--hdr-h);padding:0 16px;flex:0 0 auto;
  font-size:12px;letter-spacing:.32px;color:var(--text-secondary);max-width:220px}
.hdr-user:hover{background:var(--hdr-hover);color:var(--text-primary)}
.hdr-user span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Menü (Overflow) */
.menu{position:absolute;top:var(--hdr-h);right:0;min-width:256px;background:var(--layer-02);
  border:1px solid var(--border-subtle);z-index:var(--z-header);padding:4px 0}
.menu button{display:flex;align-items:center;gap:12px;width:100%;height:40px;padding:0 16px;
  font-size:14px;letter-spacing:.16px;color:var(--text-primary);text-align:left}
.menu button:hover{background:var(--hdr-hover)}
.menu button svg{flex:0 0 auto;color:var(--text-secondary)}
.menu .sep{height:1px;background:var(--border-subtle);margin:4px 0}

/* ==========================================================================
   UI-Shell: Inhaltsbereich (ohne Seitennavigation – die App hat einen Zweck)
   ========================================================================== */
.shell-body{flex:1 1 auto;display:flex;min-height:0;position:relative}

/* ==========================================================================
   Inhalt
   ========================================================================== */
.content{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;min-height:0}
.content-head{flex:0 0 auto;background:var(--bg)}
.content-body{flex:1 1 auto;overflow:auto;scrollbar-gutter:stable}

/* Seitenzeile: Bereich, Suche (im Vordergrund), Ansichten, Fortschritt */
.page-line{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:12px 16px;border-bottom:1px solid var(--border-subtle)}
.page-line .spacer{flex:1 1 auto}
.progress{width:120px;height:4px;background:var(--layer-03);flex:0 0 auto}
.progress > i{display:block;height:100%;background:var(--interactive);transition:width .25s}
.progress.full > i{background:var(--success)}
.page-line .pct{font-size:12px;letter-spacing:.32px;color:var(--text-secondary);
  font-variant-numeric:tabular-nums;flex:0 0 auto}
.hintline{flex:1 1 100%;font-size:12px;line-height:16px;letter-spacing:.32px;color:var(--warning)}

/* Die Suche ist das wichtigste Bedienelement – daher größer, breiter und mit Rahmen */
.search.search-main{height:48px;flex:1 1 480px;max-width:760px;background:var(--panel);
  border:1px solid var(--border-strong);border-bottom-width:2px}
.search.search-main:focus-within{border-color:var(--interactive);box-shadow:var(--ring)}
.search.search-main input{font-size:16px}
.search.search-main > svg{margin:0 10px 0 14px}
.searchkey{font:600 11px var(--mono);color:var(--muted);background:var(--layer-01);
  border:1px solid var(--border-2);border-radius:5px;padding:2px 6px;margin-right:10px;flex:0 0 auto}
.searchkey.hide{display:none}
/* Filterzeile: schmale Auswahlfelder, damit alles in eine Zeile passt */
.filter-row .sel select{max-width:132px}
.filter-row .combo-filter{width:170px}
/* Der Bereichs-Umschalter sitzt jetzt bei den Filtern und wird dort ausgerichtet */
.filter-row .switcher.bereich{margin:8px 0}

.toolbar-spacer{flex:1 1 auto}

/* Suchfeld (Carbon Search) */
.search{display:flex;align-items:center;height:var(--ctl-h);background:var(--field);
  border-bottom:1px solid var(--border-strong);flex:1 1 auto;max-width:400px;min-width:180px}
.search:focus-within{outline:2px solid var(--focus);outline-offset:-2px}
.search > svg{margin:0 8px 0 16px;flex:0 0 auto;color:var(--text-secondary)}
.search input{flex:1 1 auto;height:100%;border:0;background:none;outline:none;font-size:14px;
  letter-spacing:.16px;min-width:0;color:var(--text-primary)}
.search input::placeholder{color:var(--text-placeholder)}
.search input::-webkit-search-cancel-button{display:none}
.search .clr{width:40px;height:100%;display:grid;place-items:center;color:var(--text-secondary);flex:0 0 auto}
.search .clr:hover{background:var(--layer-03);color:var(--text-primary)}

/* Content Switcher */
.switcher{display:flex;height:var(--ctl-h);border:1px solid var(--border-subtle);background:var(--layer-01);flex:0 0 auto}
.switcher button{display:flex;align-items:center;gap:8px;padding:0 16px;font-size:14px;letter-spacing:.16px;
  color:var(--text-secondary);border-right:1px solid var(--border-subtle)}
.switcher button:last-child{border-right:0}
.switcher button:hover{background:var(--hover-2);color:var(--text-primary)}
.switcher button[aria-pressed="true"]{background:var(--layer-03);color:var(--text-primary);font-weight:600}
.switcher.bereich{margin-left:4px;height:32px}
.switcher.bereich button{font-size:12px;letter-spacing:.32px;padding:0 12px}
.switcher.bereich .n{font-variant-numeric:tabular-nums;color:var(--text-helper)}
.switcher.bereich button[aria-pressed="true"] .n{color:var(--text-secondary)}

/* Filterzeile: Schnellfilter als Chips, Feinfilter als Dropdowns */
.filter-row{display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--bg);
  border-bottom:1px solid var(--border-subtle);flex-wrap:wrap}
.filter-row .lbl{padding:12px 12px 12px 0;font-size:12px;letter-spacing:.32px;color:var(--text-helper);
  display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;margin:8px 8px 8px 0;
  background:var(--layer-01);border:1px solid var(--border-subtle);font-size:12px;letter-spacing:.32px;
  color:var(--text-secondary);white-space:nowrap}
.chip:hover{border-color:var(--border-strong);color:var(--text-primary)}
.chip .n{font-variant-numeric:tabular-nums;color:var(--text-helper)}
.chip.on{background:var(--interactive);border-color:var(--interactive);color:var(--text-on-color)}
.chip.on .n{color:var(--sel-fg)}
.chip.mine.on{background:var(--layer-03);border-color:var(--interactive-light);color:var(--text-primary)}
.chip.mine.on .n{color:var(--interactive-light)}
.chips-div{width:1px;height:24px;background:var(--border-subtle);margin:8px 16px 8px 0;flex:0 0 auto}

/* Auswahlfeld (Carbon Dropdown) – schmal, damit alles in eine Zeile passt */
.sel{position:relative;display:inline-flex;align-items:center;margin:8px 0;flex:0 0 auto}
.sel select{
  appearance:none;height:32px;padding:0 28px 0 10px;background:var(--layer-01);
  border:1px solid var(--border-subtle);font-size:12px;letter-spacing:.32px;color:var(--text-secondary);
  cursor:pointer;max-width:152px;text-overflow:ellipsis
}
.sel select:hover{border-color:var(--border-strong);color:var(--text-primary)}
.sel select:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.sel select.set{border-color:var(--interactive-light);background:var(--sel-bg);color:var(--sel-fg)}
.sel svg{position:absolute;right:7px;pointer-events:none;color:var(--text-secondary)}
.sel.wide select{max-width:190px}
/* Rechte Gruppe bleibt zusammen und rechtsbündig – auch beim Umbruch */
.meta-group{display:flex;align-items:center;gap:12px;margin-left:auto;flex:0 0 auto}

/* ==========================================================================
   Datentabelle (Carbon DataTable)
   ========================================================================== */
.tbl-wrap{padding:0 0 96px}
table.cds{width:100%;border-collapse:collapse;background:var(--bg)}
table.cds thead th{
  position:sticky;top:0;z-index:var(--z-sticky);background:var(--layer-02);
  border-bottom:1px solid var(--border-subtle);text-align:left;white-space:nowrap;
  height:var(--row-h);padding:0 16px;font-size:14px;font-weight:600;letter-spacing:.16px;
  color:var(--text-primary);vertical-align:middle
}
table.cds thead th.sortable{cursor:pointer;user-select:none}
table.cds thead th.sortable:hover{background:var(--hover-2)}
table.cds thead th .sortic{margin-left:8px;vertical-align:-2px;color:var(--text-helper);opacity:0;transition:opacity .1s}
table.cds thead th.sortable:hover .sortic{opacity:1}
table.cds thead th[aria-sort] .sortic{opacity:1;color:var(--text-primary)}
table.cds tbody tr{background:var(--bg);border-bottom:1px solid var(--border-subtle)}
table.cds tbody tr:nth-child(even){background:var(--row-alt)}
table.cds tbody tr:hover{background:var(--hover-1)}
.done .c-main,.done .c-sub{color:var(--text-disabled)}
.focus-row{outline:2px solid var(--focus);outline-offset:-2px}
table.cds td{height:var(--row-h);padding:0 16px;vertical-align:middle;font-size:14px;letter-spacing:.16px}
table.cds th.c-tick,table.cds td.c-tick{width:56px;padding:0 0 0 16px}
table.cds td.c-act{width:56px;text-align:right;padding-right:16px}
/* Zweizeilige Zellen und Standortzeilen (global, da in allen Ansichten genutzt) */
.c-main{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-sub{display:block;font-size:12px;line-height:16px;letter-spacing:.32px;color:var(--text-helper);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
table.cds td.c-obj{min-width:200px;max-width:280px}
table.cds td.c-task{min-width:220px;max-width:420px}
table.cds td.c-user,table.cds td.c-due{white-space:nowrap}
table.cds td.c-done{min-width:190px;white-space:normal;padding-top:6px;padding-bottom:6px}
table.cds .obj-nr{font-family:var(--mono);font-size:12px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ==========================================================================
   Carbon Tag
   ========================================================================== */
.tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:12px;
  font-size:12px;line-height:1;letter-spacing:.32px;white-space:nowrap;max-width:100%}
.tag svg{flex:0 0 auto;width:12px;height:12px}
.tag.green{background:var(--tag-green-bg);color:var(--tag-green-fg)}
.tag.red{background:var(--tag-red-bg);color:var(--tag-red-fg)}
.tag.yellow{background:var(--tag-yellow-bg);color:var(--tag-yellow-fg)}
.tag.blue{background:var(--tag-blue-bg);color:var(--tag-blue-fg)}
.tag.gray{background:var(--tag-gray-bg);color:var(--tag-gray-fg)}
.tag.outline{background:transparent;border:1px solid var(--border-strong);color:var(--text-secondary)}
.tag.mini{height:18px;font-size:11px;letter-spacing:.2px;padding:0 6px;margin-right:6px;vertical-align:1px}
/* To-Dos behalten in gemischten Listen ihre eigene Kennung */
.loc-row.ist-todo{box-shadow:inset 2px 0 0 var(--border-strong)}
.loc-head[role="button"]{cursor:pointer}
.td-actions{width:40px;height:40px;display:grid;place-items:center;color:var(--text-secondary);flex:0 0 auto}
.td-actions:hover{background:var(--hover-2);color:var(--text-primary)}

/* Restlaufzeit */
.due{font-variant-numeric:tabular-nums}
.due.late{color:var(--error)}
.due.soon{color:var(--warning)}
.due.ok{color:var(--text-secondary)}

/* ==========================================================================
   Abhaken – die eine Aktion, ganz links (To-do-Prinzip).
   Es gibt genau EIN Kästchen pro Zeile: dieses. Bei „erledigt" kippt der
   Haken beim Überfahren in einen Rücknehm-Pfeil.
   ========================================================================== */
.tick{
  width:30px;height:30px;flex:0 0 auto;display:grid;place-items:center;
  border:1px solid #8d8d8d;background:transparent;color:#8d8d8d;
  transition:background .11s,border-color .11s,color .11s
}
.tick svg{grid-area:1/1}
.tick:hover{border-color:var(--text-primary);color:var(--text-primary);background:var(--hover-2)}
.tick:active{background:var(--hover-2)}
.tick.on{background:var(--interactive);border-color:var(--interactive);color:#fff}
.tick.on:hover{background:var(--interactive-hover)}
.tick .tk-undo{display:none}
.tick.on:hover .tk-check{display:none}
.tick.on:hover .tk-undo{display:block;color:#fff}

/* Erledigt-Information (Datum, Person, Notiz) – reine Anzeige */
.ecell{display:flex;flex-direction:column;gap:2px;align-items:flex-start;min-width:0;max-width:100%}
.ecell-sub{font-size:12px;line-height:16px;letter-spacing:.32px;color:var(--text-helper);
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ecell-note{font-size:12px;line-height:16px;letter-spacing:.32px;color:var(--text-secondary);
  border-left:2px solid var(--support-info);padding-left:8px;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-note{height:24px;padding:0 6px;font-size:12px;letter-spacing:.32px;color:var(--link);
  display:inline-flex;align-items:center;gap:6px;border:1px solid transparent}
.btn-note:hover{background:var(--hover-2);color:var(--text-primary);border-color:var(--border-subtle)}

/* ==========================================================================
   Standort-Arbeitsliste (Standardansicht): Fortschritt je Standort,
   anklicken zum Aufklappen, Aufgaben darunter mit Abhak-Knopf links.
   ========================================================================== */
.locs{padding-bottom:32px}
.loc{border-bottom:1px solid var(--border-subtle)}
.loc-head{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:8px 16px;
  background:var(--bg);text-align:left;border-left:3px solid transparent}
.locs > .loc:nth-child(even) > .loc-head{background:var(--row-alt)}
.loc-head:hover{background:var(--hover-2)}
.loc.open .loc-head{border-left-color:var(--interactive-light);background:var(--layer-02)}
.loc.finished .loc-head{opacity:.65}
.loc-caret{display:grid;place-items:center;color:var(--text-secondary);flex:0 0 auto;transition:transform .15s}
.loc.open .loc-caret{transform:rotate(90deg)}
.loc-nr{font-family:var(--mono);font-size:12px;background:var(--layer-03);color:var(--text-secondary);
  padding:2px 8px;flex:0 0 auto}
.loc-name{font-size:16px;line-height:22px;font-weight:600;flex:0 1 auto;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loc-spacer{flex:1 1 auto}
.loc-progress{width:150px;height:4px;background:var(--layer-03);flex:0 0 auto}
.loc-progress > i{display:block;height:100%;background:var(--interactive-light);transition:width .25s}
.loc-progress.full > i{background:var(--success)}
.loc-count{font-size:12px;line-height:16px;letter-spacing:.32px;color:var(--text-secondary);
  font-variant-numeric:tabular-nums;white-space:nowrap;flex:0 0 auto;text-align:right}
/* Vorschau der offenen Tätigkeiten – füllt die Zeile und erspart das Aufklappen */
.loc-preview{flex:1 1 auto;min-width:60px;font-size:12px;line-height:16px;letter-spacing:.32px;
  color:var(--text-helper);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  border-left:1px solid var(--border-subtle);padding-left:12px}
.loc-preview .more{color:var(--text-secondary);font-variant-numeric:tabular-nums}
.loc-rows{background:var(--bg)}
.loc-row{display:flex;align-items:center;gap:16px;min-height:48px;padding:8px 16px 8px 44px;
  border-bottom:1px solid var(--border-subtle)}
.loc-rows > .loc-row:nth-child(even){background:var(--row-alt)}
.loc-row:last-child{border-bottom:0}
.loc-row:hover{background:var(--hover-1)}
.loc-row.done .loc-task .c-main{color:var(--text-disabled)}
.loc-task{flex:0 1 auto;min-width:140px;max-width:38%;display:flex;flex-direction:column}
.loc-note{flex:1 1 auto;min-width:0;font-size:12px;line-height:16px;letter-spacing:.32px;
  color:var(--text-helper);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loc-user{flex:0 0 130px;font-size:12px;line-height:16px;letter-spacing:.32px;color:var(--text-secondary);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loc-due{flex:0 0 118px;display:flex;flex-direction:column;gap:2px;
  font-size:12px;line-height:16px;letter-spacing:.32px;color:var(--text-secondary);font-variant-numeric:tabular-nums}
.loc-state{flex:0 0 auto;display:flex;align-items:center;gap:12px}
.loc-row .ecell{flex:0 0 182px;overflow:hidden}
@media (max-width:900px){
  .loc-user{display:none}
  .loc-progress{display:none}
  .loc-due{flex:0 0 96px}
}

/* ==========================================================================
   Kartenansicht
   ========================================================================== */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1px;
  background:var(--border-subtle);border-top:1px solid var(--border-subtle)}
.card{background:var(--layer-01);padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;
  transition:background .11s}
.card:hover{background:var(--hover-2)}
.card.done{opacity:.7}
.card .c-top{display:flex;align-items:flex-start;gap:12px}
.card .c-title{font-size:16px;line-height:22px;font-weight:600}
.card .c-nr{font-family:var(--mono);font-size:12px;color:var(--text-helper);margin-top:2px}
.card .c-task{font-size:14px;line-height:20px}
.card .c-note{font-size:12px;line-height:16px;color:var(--text-helper);border-left:2px solid var(--border-strong);
  padding-left:8px}
.card .c-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;
  border-top:1px solid var(--border-subtle);padding-top:12px;margin-top:auto}
.card .c-foot .meta{display:flex;flex-direction:column;gap:2px;min-width:0}

/* Anhänge */
.atts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.atts li{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--layer-01);
  border:1px solid var(--border-subtle);flex-wrap:wrap}
.att{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--link);min-width:0;flex:1 1 auto}
.att span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att:hover{color:var(--text-primary)}
.att-meta{font-size:12px;letter-spacing:.32px;color:var(--text-helper);white-space:nowrap;flex:0 0 auto}
.att-kom{flex:1 1 100%;min-width:0}
.att-kom-inp{height:32px;font-size:12px;letter-spacing:.32px;background:var(--panel);border-bottom:1px solid var(--border-subtle)}
.att-thumb{flex:0 0 auto;display:block;width:56px;height:56px;overflow:hidden;border:1px solid var(--border-subtle)}
.att-thumb img{width:100%;height:100%;object-fit:cover;display:block}
label.btn{cursor:pointer}

/* ==========================================================================
   Combobox (durchsuchbares Auswahlfeld)
   ========================================================================== */
.combo{position:relative;width:100%}
.combo-filter{display:inline-block;width:190px;flex:0 0 auto;margin:8px 0}
.combo-filter .combo-field{min-height:32px;padding:3px 28px 3px 10px;font-size:12px}
.combo-filter .combo-input{font-size:12px;letter-spacing:.32px}
.combo-filter .combo-chip{height:22px;font-size:12px}
.combo-filter .combo-carets{right:9px}
.combo-field{display:flex;align-items:center;flex-wrap:wrap;gap:6px;min-height:var(--ctl-h);
  padding:6px 40px 6px 12px;background:var(--field);border-bottom:1px solid var(--border-strong);
  cursor:text;transition:background .11s}
.combo-field:hover{background:var(--field-hover)}
.combo-field.is-open,.combo-field:focus-within{outline:2px solid var(--focus);outline-offset:-2px}
.combo-input{flex:1 1 90px;min-width:70px;border:0;background:none;outline:none;
  font-size:14px;letter-spacing:.16px;color:var(--text-primary)}
.combo-input::placeholder{color:var(--text-placeholder)}
.combo-chips{display:flex;flex-wrap:wrap;gap:6px}
.combo-chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 4px 0 8px;
  background:var(--interactive);color:var(--text-on-color);font-size:12px;letter-spacing:.32px;border-radius:12px}
.combo-x{display:grid;place-items:center;width:16px;height:16px;border-radius:50%;color:inherit}
.combo-x:hover{background:rgba(0,0,0,.35)}
.combo-carets{position:absolute;right:14px;display:grid;place-items:center;color:var(--text-secondary);pointer-events:none}
.combo-list{position:absolute;left:0;right:0;top:100%;z-index:20;max-height:264px;overflow:auto;
  background:var(--layer-02);border:1px solid var(--border-subtle);box-shadow:var(--shadow-2)}
.combo-opt{display:block;width:100%;text-align:left;padding:10px 16px;font-size:14px;letter-spacing:.16px;
  color:var(--text-primary)}
.combo-opt:hover,.combo-opt.on{background:var(--hover-2)}
.combo-opt.on{font-weight:600}
.combo-empty{padding:10px 16px;font-size:12px;letter-spacing:.32px;color:var(--text-helper)}
.combo-empty b{color:var(--text-secondary)}

/* Abschlusskommentar-Vorschläge */
.presets{display:flex;flex-wrap:wrap;gap:8px;margin-top:-4px}
.preset{height:32px;padding:0 12px;background:var(--layer-03);border:1px solid var(--border-subtle);
  font-size:12px;letter-spacing:.32px;color:var(--text-secondary);text-align:left}
.preset:hover{border-color:var(--interactive-light);color:var(--text-primary)}
.preset.on{background:var(--sel-bg);border-color:var(--interactive-light);color:var(--sel-fg)}

/* ==========================================================================
   Zeitplan-Ansicht (Gruppen nach Dringlichkeit)
   ========================================================================== */
.plan{padding-bottom:32px}
.plan-sec{border-bottom:1px solid var(--border-subtle)}
.plan-head{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 16px;
  background:var(--layer-01);text-align:left;border-left:3px solid transparent}
.plan-head:hover{background:var(--hover-2)}
.plan-sec.open .plan-head{border-left-color:var(--interactive-light);background:var(--layer-02)}
.plan-caret{display:grid;place-items:center;color:var(--text-secondary);flex:0 0 auto;transition:transform .15s}
.plan-sec.open .plan-caret{transform:rotate(90deg)}
.plan-head h3{font-size:16px;line-height:22px;font-weight:600;flex:0 0 auto}
.plan-head .plan-sub{font-size:12px;letter-spacing:.32px;color:var(--text-helper);flex:1 1 auto}
.plan.leer{padding:48px 16px;text-align:center;color:var(--text-helper)}

/* ==========================================================================
   Aktionen, Leerzustand, Ladezustand
   ========================================================================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--ctl-h);
  padding:0 16px;font-size:14px;letter-spacing:.16px;border:1px solid transparent;white-space:nowrap;
  transition:background .11s,border-color .11s,color .11s}
.btn:active{transform:none}
.btn-primary{background:var(--interactive);color:var(--text-on-color)}
.btn-primary:hover{background:var(--interactive-hover)}
.btn-primary:active{background:var(--interactive-active)}
.btn-secondary{background:var(--layer-03);color:var(--text-on-color)}
.btn-secondary:hover{background:var(--hover-2)}
.btn-tertiary{background:transparent;border-color:var(--interactive-light);color:var(--link)}
.btn-tertiary:hover{background:var(--interactive);border-color:var(--interactive);color:var(--text-on-color)}
.btn-ghost{background:transparent;color:var(--link)}
.btn-ghost:hover{background:var(--hover-2);color:var(--text-primary)}
.btn-danger{background:#da1e28;color:#fff}
.btn-danger:hover{background:#ba1b23}
.btn-sm{height:32px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn-icon{width:var(--ctl-h);padding:0}

.empty{padding:64px 16px;text-align:center;color:var(--text-helper);display:flex;flex-direction:column;
  align-items:center;gap:8px}
.empty h2{font-size:20px;line-height:26px;font-weight:400;color:var(--text-primary)}
.empty p{font-size:14px;line-height:20px;max-width:52ch}
.empty .acts{margin-top:8px;display:flex;gap:8px}

.skel-row{height:var(--row-h);border-bottom:1px solid var(--border-subtle);
  background:linear-gradient(90deg,var(--layer-01) 0%,var(--layer-03) 50%,var(--layer-01) 100%);
  background-size:200% 100%;animation:skel 1.1s linear infinite}
@keyframes skel{from{background-position:200% 0}to{background-position:-200% 0}}

/* ==========================================================================
   Seitenleiste (Detailansicht, schreibgeschützt)
   ========================================================================== */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:var(--z-overlay)}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--layer-01);
  border-left:1px solid var(--border-subtle);z-index:calc(var(--z-overlay) + 1);display:flex;flex-direction:column}
.panel > header{height:var(--hdr-h);flex:0 0 auto;display:flex;align-items:center;gap:12px;
  padding:0 16px;border-bottom:1px solid var(--border-subtle);background:var(--layer-01)}
.panel > header h2{font-size:16px;line-height:22px;font-weight:600;flex:1 1 auto;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel .body{flex:1 1 auto;overflow:auto;padding:16px}
.panel .foot{flex:0 0 auto;border-top:1px solid var(--border-subtle);padding:16px;display:flex;gap:8px;
  align-items:center;background:var(--layer-01)}
.panel .foot .spacer{flex:1 1 auto}
.sect{margin-bottom:24px}
.sect > h3{font-size:12px;line-height:16px;letter-spacing:.32px;color:var(--text-helper);
  text-transform:none;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.sect > h3::after{content:"";flex:1 1 auto;height:1px;background:var(--border-subtle)}
.row{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:8px 0;border-bottom:1px solid var(--border-subtle)}
.row:last-child{border-bottom:0}
.row dt{font-size:12px;line-height:16px;letter-spacing:.32px;color:var(--text-helper)}
.row dd{font-size:14px;line-height:20px;letter-spacing:.16px;word-break:break-word}
.row dd.empty-val{color:var(--text-placeholder)}
.notice{display:flex;gap:12px;padding:12px 16px;background:var(--hover-1);border-left:3px solid var(--info);
  font-size:12px;line-height:16px;letter-spacing:.32px;color:var(--text-secondary);margin-bottom:16px}
.notice svg{flex:0 0 auto;color:var(--info);margin-top:1px}

/* Formularelemente (Carbon) */
.fld{margin-bottom:16px}
.fld > label{display:block;font-size:12px;line-height:16px;letter-spacing:.32px;color:var(--text-secondary);
  margin-bottom:8px}
.inp{width:100%;height:var(--ctl-h);padding:0 16px;background:var(--field);
  border:0;border-bottom:1px solid var(--border-strong);color:var(--text-primary);
  font-size:14px;letter-spacing:.16px;outline:none}
.inp:hover{background:var(--field-hover)}
.inp:focus{outline:2px solid var(--focus);outline-offset:-2px}
.inp::placeholder{color:var(--text-placeholder)}
textarea.inp{height:auto;min-height:80px;padding:11px 16px;resize:vertical;line-height:20px}
.fld .hint{margin-top:4px;font-size:12px;line-height:16px;letter-spacing:.32px;color:var(--text-helper)}

/* Umschalter (Carbon Toggle) */
.tgl-row{display:flex;align-items:flex-start;gap:16px;padding:16px 0}
.tgl-row .t{flex:1 1 auto}
.tgl-row .t b{display:block;font-size:14px;line-height:20px;font-weight:600}
.tgl-row .t span{font-size:12px;line-height:16px;letter-spacing:.32px;color:var(--text-helper)}
.tgl{position:relative;width:48px;height:24px;background:var(--layer-03);border-radius:12px;flex:0 0 auto;
  transition:background .15s;margin-top:2px}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
  background:var(--text-primary);transition:transform .15s}
.tgl[aria-checked="true"]{background:var(--interactive)}
.tgl[aria-checked="true"]::after{transform:translateX(24px)}

/* ==========================================================================
   Dialoge und Hinweise
   ========================================================================== */
.modal-scrim{position:fixed;inset:0;background:var(--scrim);z-index:calc(var(--z-overlay) + 2);
  display:grid;place-items:center;padding:16px}
.modal{background:var(--layer-02);border:1px solid var(--border-subtle);width:min(520px,100%);
  display:flex;flex-direction:column;position:relative;z-index:1;max-height:100%}
.modal > header{display:flex;align-items:flex-start;gap:16px;padding:16px;border-bottom:1px solid var(--border-subtle)}
.modal > header h3{font-size:20px;line-height:26px;font-weight:400;flex:1 1 auto}
.modal .body{padding:16px;overflow:auto}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;padding:16px;border-top:1px solid var(--border-subtle)}
.modal.danger > header{border-left:3px solid var(--error)}
.modal .close{width:32px;height:32px;display:grid;place-items:center;color:var(--text-secondary);flex:0 0 auto}
.modal .close:hover{background:var(--hover-2);color:var(--text-primary)}

.toasts{position:fixed;right:16px;bottom:16px;z-index:var(--z-toast);display:flex;flex-direction:column;
  gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;width:min(400px,calc(100vw - 32px));background:var(--layer-02);
  border:1px solid var(--border-subtle);border-left:3px solid var(--info);padding:12px 16px;
  display:flex;gap:12px;align-items:flex-start}
.toast .ti{flex:0 0 auto;margin-top:1px}
.toast.success{border-left-color:var(--success)} .toast.success .ti{color:var(--success)}
.toast.warning{border-left-color:var(--warning)} .toast.warning .ti{color:var(--warning)}
.toast.error{border-left-color:var(--error)}   .toast.error .ti{color:var(--error)}
.toast.info .ti{color:var(--info)}
.toast .txt{flex:1 1 auto;font-size:14px;line-height:20px;letter-spacing:.16px}
.toast .txt small{display:block;font-size:12px;line-height:16px;letter-spacing:.32px;color:var(--text-helper);margin-top:2px}
.toast .act{font-size:14px;letter-spacing:.16px;color:var(--link);white-space:nowrap;flex:0 0 auto}
.toast .act:hover{color:var(--text-primary)}
.toast .x{color:var(--text-secondary);flex:0 0 auto;width:20px;height:20px;display:grid;place-items:center}
.toast .x:hover{color:var(--text-primary)}

/* ==========================================================================
   Responsiv
   ========================================================================== */
@media (max-width:900px){
  .page-line{padding:12px 12px 10px;gap:8px}
  .progress{width:80px}
  .hdr-sub{display:none}
  .hdr-div.opt{display:none}
  table.cds td.c-done,table.cds th.c-done{display:none}
  table.cds td.c-obj{min-width:150px}
  .panel{width:100%}
  .loc-row{padding-left:44px;gap:10px}
  .loc-due{display:none}
}@media (max-width:600px){
  table.cds td.c-user,table.cds th.c-user{display:none}
  .search{max-width:none;flex-basis:100%}
  .chip{margin:6px 6px 6px 0}
  .sel{margin:6px 0}
  .sel select{max-width:132px}
  .sel.wide select{max-width:160px}
  .loc-preview,.loc-note{display:none}
  .loc-row{padding-left:16px}
  .loc-row .ecell{flex:0 0 auto}
  .loc-count{font-size:12px}
  .loc-head{gap:8px;padding:8px 12px;min-height:56px}
  .loc-name{font-size:15px}
  .page-line{padding:12px 12px 10px;gap:10px}
  .progress{width:80px}
  .hdr-status{padding:0 8px}
  .hdr-status span{display:none}
  .hdr-user{padding:0 10px;max-width:104px}
  .search-main{max-width:none;flex-basis:100%}
}

/* ==========================================================================
   Druck (helle Ausgabe auf A4 quer)
   ========================================================================== */
@media print{
  :root{--bg:#fff;--layer-01:#fff;--layer-02:#eee;--layer-03:#ddd;--field:#fff;
        --border-subtle:#c6c6c6;--border-strong:#8d8d8d;--text-primary:#161616;
        --text-secondary:#393939;--text-helper:#6f6f6f;--text-disabled:#8d8d8d;--link:#0f62fe}
  body{overflow:visible;display:block;background:#fff}
  .shell-header,.filter-row,.toasts,.panel,.scrim,.modal-scrim,.app-foot,
  .c-act,.tick,.btn-note,.no-print{display:none !important}
  .shell-body{display:block}
  .content,.content-body{overflow:visible;display:block}
  .page-line{border-bottom:2px solid #161616;padding:0 0 8px}
  .tbl-wrap,.locs{padding:0}
  table.cds thead th{position:static;background:#eee;color:#161616;border-bottom:1px solid #8d8d8d}
  table.cds tbody tr{break-inside:avoid}
  .loc-head{background:#f4f4f4;break-inside:avoid}
  .loc{break-inside:avoid}
  .tag{border:1px solid currentColor}
  .c-sub{color:#525252 !important}
  @page{size:A4 landscape;margin:10mm}
}
</style>
</head>

  </div>
  <span class="hdr-spacer"></span>

    <span id="userName">Name hinterlegen</span>
  </button>
  <span class="hdr-div opt"></span>

    <svg width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M28 10v9h-4v6H8v-6H4v-9h6V4h12v6zM10 6v4h12V6zm12 17v-8H10v8zm4-6v-5H6v5h2v-4h16v4z"/><path d="M25 12h2v2h-2z"/></svg>
  </button>
  <button class="hdr-btn" id="btnMenu" aria-haspopup="menu" aria-expanded="false" title="Weitere Aktionen" aria-label="Weitere Aktionen">
    <svg width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><circle cx="16" cy="8" r="2.2"/><circle cx="16" cy="16" r="2.2"/><circle cx="16" cy="24" r="2.2"/></svg>
  </button>

  dots   : '<circle cx="16" cy="8" r="2.2"/><circle cx="16" cy="16" r="2.2"/><circle cx="16" cy="24" r="2.2"/>'
};
const svg = (d, size = 16, cls = '') =>
  '<svg class="' + cls + '" width="' + size + '" height="' + size + '" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true">' + d + '</svg>';

/** Vergleichsschlüssel: Kleinschreibung, Umlaute/Akzente aufgelöst. */
const norm = (v) => String(v ?? '').toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .replace(/ß/g, 'ss').replace(/[^a-z0-9]+/g, ' ').trim();

function matchesQuery(it, q) {
  if (!q) return true;
  const hay = norm([it.objekt_art, it.objekt_nr, it.objekt_name, it.beschreibung, it.taetigkeit,
    it.kommentar, it.zustaendig, it.erledigt ? 'erledigt abgeschlossen' : 'offen',
    it.erledigt_am, it.erledigt_durch, it.erledigt_notiz].join(' '));
  return q.split(/\s+/).filter(Boolean).every(t => hay.includes(t));
}

/* Datum: intern immer TT.MM.JJJJ (wie im Altsystem und im Export) */
function parseDate(s) {
  const m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(String(s ?? '').trim());
  if (!m) return null;
  const d = new Date(+m[3], +m[2] - 1, +m[1]);
  return (d.getFullYear() === +m[3] && d.getMonth() === +m[2] - 1 && d.getDate() === +m[1]) ? d : null;
}
const p2 = (n) => String(n).padStart(2, '0');
const fmtDate = (d) => d ? p2(d.getDate()) + '.' + p2(d.getMonth() + 1) + '.' + d.getFullYear() : '';
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const dayDiff = (a, b) => Math.round((a - b) / 86400000);
const isoStamp = () => { const d = new Date(); return d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()); };

/** Eingabe automatisch zu TT.MM.JJJJ formatieren. */
function maskDate(v) {
  const d = String(v).replace(/[^\d]/g, '').slice(0, 8);
  let out = d.slice(0, 2);
  if (d.length > 2) out += '.' + d.slice(2, 4);
  if (d.length > 4) out += '.' + d.slice(4, 8);
  return out;
}

function dueInfo(bis) {
  const d = parseDate(bis);
  if (!d) return { text: bis ? 'bis ' + bis : 'ohne Frist', cls: 'ok' };
  const n = dayDiff(d, today());
  if (n < 0)  return { text: 'überfällig seit ' + Math.abs(n) + ' Tag' + (Math.abs(n) === 1 ? '' : 'en'), cls: 'late' };
  if (n === 0) return { text: 'heute fällig', cls: 'late' };
  if (n === 1) return { text: 'morgen fällig', cls: 'soon' };
  if (n <= CONFIG.soonDays) return { text: 'noch ' + n + ' Tage', cls: 'soon' };
  return { text: 'noch ' + n + ' Tage', cls: 'ok' };
}

/** Status: done | over | soon | open | plan */
function statusOf(it) {
  if (it.erledigt) return 'done';
  const bis = parseDate(it.bis), ab = parseDate(it.ab), t = today();
  if (bis && bis < t) return 'over';
  if (bis && dayDiff(bis, t) <= CONFIG.soonDays) return 'soon';
  if (ab && ab > t) return 'plan';
  return 'open';
}
const STATUS = {
  done: { label: 'Erledigt',    tone: 'green'  },
  over: { label: 'Überfällig',  tone: 'red'    },
  soon: { label: 'Bald fällig', tone: 'yellow' },
  open: { label: 'Offen',       tone: 'blue'   },
  plan: { label: 'Geplant',     tone: 'gray'   }
};
const STATUS_ORDER = { over: 0, soon: 1, open: 2, plan: 3, done: 4 };
const tag = (text, tone, icon) =>
  '<span class="tag ' + tone + '">' + (icon ? svg(icon, 12) : '') + esc(text) + '</span>';

const uniq = (a) => Array.from(new Set(a.filter(v => v !== undefined && v !== null && String(v).trim() !== '')))
  .sort((x, y) => String(x).localeCompare(String(y), 'de'));

function download(name, text, mime = 'application/json') {
  const url = URL.createObjectURL(new Blob([text], { type: mime + ';charset=utf-8' }));
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

/* ------------------------------------------------- Hinweise und Dialoge */
function toast(text, { tone = 'info', detail = '', ms = 5000, action, actionLabel } = {}) {
  const el = document.createElement('div');
  el.className = 'toast ' + tone;
  el.setAttribute('role', tone === 'error' ? 'alert' : 'status');
  const ico = { success: ICON.check, warning: ICON.warn, error: ICON.danger, info: ICON.info }[tone] || ICON.info;
  el.innerHTML = '<span class="ti">' + svg(ico, 16) + '</span>' +
    '<span class="txt">' + esc(text) + (detail ? '<small>' + esc(detail) + '</small>' : '') + '</span>';
  if (action) {
    const b = document.createElement('button');
    b.className = 'act'; b.textContent = actionLabel || 'Rückgängig';
    b.onclick = () => { action(); el.remove(); };
    el.appendChild(b);
  }
  const x = document.createElement('button');
  x.className = 'x'; x.setAttribute('aria-label', 'Hinweis schließen');
  x.innerHTML = svg(ICON.close, 12);
  x.onclick = () => el.remove();
  el.appendChild(x);
  $('#toasts').appendChild(el);
  if (ms) setTimeout(() => el.remove(), ms);
}

/** Carbon-Modal – gibt ein Promise mit dem Ergebnis zurück. */
function modal({ title, bodyHtml, primary = 'Speichern', secondary = 'Abbrechen', danger = false,
                 width, collect, validate, onMount, tertiary, onTertiary }) {
  return new Promise(resolve => {
    const scrim = document.createElement('div');
    scrim.className = 'modal-scrim';
    scrim.innerHTML =
      '<div class="modal' + (danger ? ' danger' : '') + '" role="dialog" aria-modal="true" aria-label="' + esc(title) + '"' +
        (width ? ' style="width:min(' + width + 'px,100%)"' : '') + '>' +
        '<header><h3>' + esc(title) + '</h3>' +
          '<button class="close" data-x aria-label="Schließen">' + svg(ICON.close, 16) + '</button></header>' +
        '<div class="body">' + bodyHtml + '</div>' +
        '<div class="foot">' +
          (tertiary ? '<button class="btn btn-ghost" data-tertiary>' + esc(tertiary) + '</button>' : '') +
          '<span class="spacer"></span>' +
          (secondary ? '<button class="btn btn-tertiary" data-cancel>' + esc(secondary) + '</button>' : '') +
          '<button class="btn ' + (danger ? 'btn-danger' : 'btn-primary') + '" data-ok>' + esc(primary) + '</button>' +
        '</div>' +
      '</div>';
    const done = (v) => { scrim.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
    const tryOk = () => {
      const data = collect ? collect(scrim) : null;
      const err = validate ? validate(data) : null;
      if (err) { toast(err, { tone: 'warning' }); return; }
      done(data);
    };
    const onKey = (e) => {
      if (e.key === 'Escape') { e.stopPropagation(); done(null); }
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); tryOk(); }
    };
    scrim.addEventListener('click', e => {
      if (e.target === scrim || e.target.closest('[data-x]') || e.target.closest('[data-cancel]')) done(null);
      else if (e.target.closest('[data-tertiary]')) {
        if (onTertiary && onTertiary(scrim) === false) return;
        tryOk();
      }
      else if (e.target.closest('[data-ok]')) tryOk();
    });
    document.addEventListener('keydown', onKey);
    $('#overlay').appendChild(scrim);
    if (onMount) onMount(scrim);
    else { const f = scrim.querySelector('input,textarea'); if (f) setTimeout(() => f.focus(), 30); }
  });
}

/* ============================================================ 3. Datenzugriff
   Zwei austauschbare Adapter. Beide können ausschließlich LESEN und die
   Erledigung schreiben – die Stammdaten bleiben unverändert.
   ========================================================================== */
const DEFAULT_FIELDS = {
  objekt_art: 'Standorte', objekt_nr: '', objekt_name: '', beschreibung: '', taetigkeit: '',
  kommentar: '', intervall: '', ab: '', bis: '', zustaendig: '', erledigt: false, erledigt_am: '',
  erledigt_durch: '', erledigt_notiz: '', external_id: '', hash_key: ''
};

/** ISO-Datum (2026-12-31) → TT.MM.JJJJ */
const isoToDe = (s) => {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s ?? '').trim());
  return m ? m[3] + '.' + m[2] + '.' + m[1] : '';
};
const intervallText = (monate, typ) => {
  if (!monate) return '';
  let t = monate % 12 === 0 ? (monate / 12) + (monate === 12 ? ' Jahr' : ' Jahre') : monate + ' Monate';
  return 'alle ' + t + (typ === 'fest' ? ' (fest)' : ' (variabel)');
};

/** Verschachteltes Exportformat (schemaVersion 1.0) → flaches Arbeitsmodell. */
function fromExport(r, idx) {
  const site = r.site || {}, task = r.task || {}, sch = r.schedule || {}, ex = r.execution || {};
  const done = String(ex.status || 'OPEN').toUpperCase() !== 'OPEN';
  return Object.assign({}, DEFAULT_FIELDS, {
    id: (typeof idx === 'number' ? idx : 0) + 1,
    external_id: r.id || '',
    hash_key: r.hashKey || '',
    objekt_art: site.type || 'Standorte',
    objekt_nr: site.id || '',
    objekt_name: site.name || '',
    taetigkeit: task.activity || '',
    kommentar: task.maintenanceComment || '',
    intervall: intervallText(task.intervalMonths, task.intervalType),
    ab: isoToDe(sch.dueDateStart),
    bis: isoToDe(sch.dueDateEnd),
    zustaendig: sch.assignedTo || '',
    erledigt: done,
    erledigt_am: isoToDe(ex.completedAt),
    erledigt_durch: ex.completedBy || '',
    erledigt_notiz: ex.completionComment || ''
  });
}

const normalize = (r, idx) => {
  // Verschachteltes Exportformat erkennen und umsetzen
  if (r && r.site && r.task && r.schedule) return fromExport(r, idx);
  return Object.assign({}, DEFAULT_FIELDS, r, {
    id: r.id ?? null,
    erledigt: r.erledigt === true || r.erledigt === 1 || r.erledigt === '1' || r.erledigt === 'true'
  });
};

/** Nimmt ein Array (flach oder Export-Records) oder das Export-Objekt entgegen. */
const asRecords = (x) => Array.isArray(x) ? x : (x && Array.isArray(x.records) ? x.records : null);

const seedData = () => {
  // 1. Externe Stammdatendatei (daten.js) hat Vorrang vor dem Testbestand
  const ext = asRecords(globalThis.WARTUNGSDATEN);
  if (ext && ext.length) return ext.map(normalize);
  // 2. eingebauter Testbestand
  try { return JSON.parse($('#seed').textContent).map(normalize); }
  catch (e) { console.error('Stammdaten konnten nicht gelesen werden', e); return []; }
};
const hasDataFile = () => { const e = asRecords(globalThis.WARTUNGSDATEN); return !!(e && e.length); };

const LocalStore = {
  label: 'Lokaler Testbestand',
  async load() {
    try {
      const raw = localStorage.getItem(CONFIG.storageKey);
      if (raw) {
        const p = JSON.parse(raw);
        // Nur weiterverwenden, wenn derselbe Stammdatenbestand zugrunde liegt
        if (Array.isArray(p.items) && p.quelle === quelleTag()) return { items: p.items.map(normalize), fresh: false };
      }
    } catch (e) { console.warn('Lokaler Bestand unlesbar – Stammdaten werden neu geladen.', e); }
    return { items: seedData(), fresh: true };
  },
  async complete(id, patch) {
    const raw = localStorage.getItem(CONFIG.storageKey);
    let p;
    try { p = JSON.parse(raw); } catch { p = null; }
    if (!p || !Array.isArray(p.items) || p.quelle !== quelleTag()) p = { items: seedData() };
    const it = p.items.find(x => String(x.id) === String(id));
    if (!it) throw new Error('Position nicht gefunden');
    Object.assign(it, patch);
    localStorage.setItem(CONFIG.storageKey, JSON.stringify({
      v: 3, quelle: quelleTag(), saved: new Date().toISOString(), items: p.items
    }));
    return normalize(it);
  },

  /* ---- Eigene To-Dos: eigener Speicher, getrennt von den Stammdaten ---- */
  async loadTodos() {
    try {
      const a = JSON.parse(localStorage.getItem(CONFIG.storageKey + '.todos') || '[]');
      if (Array.isArray(a)) return a.map(normalizeTodo);
    } catch (e) { console.warn('Eigene To-Dos unlesbar.', e); }
    return [];
  },
  async saveTodo(t) {
    const list = await this.loadTodos();
    const i = list.findIndex(x => String(x.id) === String(t.id));
    const rec = Object.assign({}, t);
    if (t.id == null || i < 0) {
      rec.id = list.reduce((m, x) => Math.max(m, Number(x.id) || 0), 0) + 1;
      list.push(rec);
    } else {
      list[i] = Object.assign(list[i], rec);
    }
    localStorage.setItem(CONFIG.storageKey + '.todos', JSON.stringify(list));
    return list.find(x => String(x.id) === String(rec.id));
  },
  async removeTodo(id) {
    const list = (await this.loadTodos()).filter(x => String(x.id) !== String(id));
    localStorage.setItem(CONFIG.storageKey + '.todos', JSON.stringify(list));
    return true;
  }
};

/** Kennzeichnet die Herkunft der Stammdaten, damit alte Browserbestände nicht mischen. */
const quelleTag = () => (hasDataFile() ? 'datei' : 'test');

const ApiStore = {
  label: 'SQL-Backend',
  url: (p) => CONFIG.apiBase.replace(/\/$/, '') + p,
  async req(path, opts = {}) {
    const res = await fetch(this.url(path), { headers: { 'Content-Type': 'application/json' }, ...opts });
    if (!res.ok) throw new Error('API ' + res.status + ' ' + res.statusText);
    return res.status === 204 ? null : res.json();
  },
  async load() {
    const items = await this.req('/items');
    return { items: (Array.isArray(items) ? items : []).map(normalize), fresh: false };
  },
  /** Nur die Erledigungsfelder – Stammdaten sind über diesen Endpunkt nicht änderbar. */
  async complete(id, patch) {
    const r = await this.req('/items/' + encodeURIComponent(id) + '/erledigung',
      { method: 'PATCH', body: JSON.stringify(patch) });
    return normalize(r);
  },

  /* ---- Anhänge (nur mit Backend; im lokalen Testbetrieb abgeschaltet) ---- */
  supportsAttachments: true,
  listAttachments(art, id) { return this.req('/' + (art === 'todo' ? 'todos' : 'items') + '/' + encodeURIComponent(id) + '/anhaenge'); },
  uploadAttachment(art, id, file, kommentar) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onerror = () => reject(new Error('Datei konnte nicht gelesen werden'));
      fr.onload = () => {
        const daten = String(fr.result).split(',')[1] || '';
        this.req('/' + (art === 'todo' ? 'todos' : 'items') + '/' + encodeURIComponent(id) + '/anhaenge', {
          method: 'POST',
          body: JSON.stringify({ dateiname: file.name, mime: file.type || 'application/octet-stream', daten: daten, kommentar: kommentar || '' })
        }).then(resolve, reject);
      };
      fr.readAsDataURL(file);
    });
  },
  removeAttachment(art, id, anhangId) {
    return this.req('/' + (art === 'todo' ? 'todos' : 'items') + '/' + encodeURIComponent(id) +
      '/anhaenge/' + encodeURIComponent(anhangId), { method: 'DELETE' });
  },
  /** Kommentar zu einem Anhang setzen */
  commentAttachment(anhangId, kommentar) {
    return this.req('/anhaenge/' + encodeURIComponent(anhangId), { method: 'PATCH', body: JSON.stringify({ kommentar: kommentar }) });
  },
  attachmentUrl(art, id, anhangId) {
    return this.url('/' + (art === 'todo' ? 'todos' : 'items') + '/' + encodeURIComponent(id) +
      '/anhaenge/' + encodeURIComponent(anhangId) + '/datei');
  },

  /* ---- Eigene To-Dos: eigener Endpunkt, volle Rechte für den Techniker ---- */
  async loadTodos() {
    const a = await this.req('/todos');
    return (Array.isArray(a) ? a : []).map(normalizeTodo);
  },
  async saveTodo(t) {
    const body = JSON.stringify(t);
    const r = t.id == null
      ? await this.req('/todos', { method: 'POST', body })
      : await this.req('/todos/' + encodeURIComponent(t.id), { method: 'PUT', body });
    return normalizeTodo(r);
  },
  async removeTodo(id) {
    return this.req('/todos/' + encodeURIComponent(id), { method: 'DELETE' });
  }
};

  query: '', status: 'alle', art: '', objekt: '', taetigkeit: '', personen: [],

/* ------------------------------------------------- 4. Ableitung/Auswahl */
function filtered() {
  const q = norm(state.query);
  let list = state.items.filter(it => {
    if (!matchesQuery(it, q)) return false;
    if (state.art && it.objekt_art !== state.art) return false;
    if (state.objekt && it.objekt_name !== state.objekt) return false;
    if (state.taetigkeit && it.taetigkeit !== state.taetigkeit) return false;
    if (state.personen.length && !state.personen.includes(it.zustaendig)) return false;
    if (state.mine && (!state.user || norm(it.zustaendig) !== norm(state.user))) return false;
    if (state.status === 'done' && !it.erledigt) return false;
    if (state.status !== 'alle' && state.status !== 'done' && statusOf(it) !== state.status) return false;
    return true;
  });
  const [key, dir] = state.sort.split('-');
  const sign = dir === 'desc' ? -1 : 1;
  const FAR = new Date(8640000000000000);
  const cmp = {
    // Offene Positionen stehen immer vorn – abgeschlossene haben keine Frist mehr.
    due   : (a, b) => {
      const da = a.erledigt ? null : parseDate(a.bis);
      const db = b.erledigt ? null : parseDate(b.bis);
      if (!da && !db) return (parseDate(a.erledigt_am) || FAR) - (parseDate(b.erledigt_am) || FAR);
      if (!da) return 1;
      if (!db) return -1;
      return (da - db) * sign;
    },
    obj   : (a, b) => (a.objekt_nr || '').localeCompare(b.objekt_nr || '', 'de', { numeric: true }) * sign,
    name  : (a, b) => (a.objekt_name || '').localeCompare(b.objekt_name || '', 'de') * sign ||
                      (a.objekt_nr || '').localeCompare(b.objekt_nr || '', 'de', { numeric: true }),
    task  : (a, b) => (a.taetigkeit || '').localeCompare(b.taetigkeit || '', 'de') * sign,
    user  : (a, b) => (a.zustaendig || '').localeCompare(b.zustaendig || '', 'de') * sign,
    status: (a, b) => (STATUS_ORDER[statusOf(a)] - STATUS_ORDER[statusOf(b)]) * sign
  }[key] || ((a, b) => (Number(a.id) || 0) - (Number(b.id) || 0));
  list.sort(cmp);
  return list;
}

function counts() {
  const c = { alle: state.items.length, done: 0, over: 0, soon: 0, open: 0, plan: 0, mine: 0 };
  for (const it of state.items) {
    const s = statusOf(it);
    c[s]++;
    if (!it.erledigt && state.user && norm(it.zustaendig) === norm(state.user)) c.mine++;
  }
  c.pct = c.alle ? Math.round(c.done / c.alle * 100) : 0;
  return c;
}

const groupKey = (it) => (it.objekt_nr || '') + '|' + (it.objekt_name || '');
function objects() {
  const m = new Map();
  for (const it of state.items) {
    const k = groupKey(it);
    if (!m.has(k)) m.set(k, { nr: it.objekt_nr, name: it.objekt_name, total: 0, done: 0 });
    const g = m.get(k); g.total++; if (it.erledigt) g.done++;
  }
  return Array.from(m.values()).sort((a, b) =>
    (a.nr || '').localeCompare(b.nr || '', 'de', { numeric: true }));
}
