/* --- Flache Liste (Disposition) ---------------------------------------- */
function viewTable(list) {
  const sortMap = { objekt_name: 'name', taetigkeit: 'task', zustaendig: 'user', bis: 'due', done: 'status' };
  const [sk, sd] = state.sort.split('-');
  const th = (label, cls, key) => {
    if (!key) return '<th scope="col" class="' + cls + '">' + label + '</th>';
    const next = sortMap[key] === sk && sd === 'asc' ? sortMap[key] + '-desc' : sortMap[key] + '-asc';
    const active = sortMap[key] === sk;
    return '<th scope="col" class="' + cls + ' sortable" data-sort="' + next + '"' +
      (active ? ' aria-sort="' + (sd === 'asc' ? 'ascending' : 'descending') + '"' : '') + '>' + label +
      '<span class="sortic">' + svg(active && sd === 'desc' ? ICON.sortDn : ICON.sortUp, 14) + '</span></th>';
  };

  const rows = list.map(it => {
    const k = esc(keyOf(it));
    return '<tr data-id="' + k + '" class="' + (it.erledigt ? 'done' : '') + (istToDo(it) ? ' ist-todo' : '') + '">' +
    '<td class="c-tick">' + tickControl(it) + '</td>' +
    '<td class="c-obj"><span class="c-main">' + esc(it.objekt_name || '–') + '</span>' +
      '<span class="c-sub"><span class="obj-nr">' + esc(it.objekt_nr || '–') + '</span> · ' + esc(it.objekt_art || '') + '</span></td>' +
    '<td class="c-task"><span class="c-main" title="' + esc(it.taetigkeit) + '">' + todoBadge(it) + esc(it.taetigkeit || '–') + '</span>' +
      (it.kommentar ? '<span class="c-sub" title="' + esc(it.kommentar) + '">' + esc(it.kommentar) + '</span>' : '') + '</td>' +
    '<td class="c-user">' + esc(it.zustaendig || '–') + '</td>' +
    '<td class="c-due">' + dueCell(it) + '</td>' +
    '<td class="c-done">' + erledigtInfo(it) + '</td>' +
    '<td class="c-act"><button class="td-actions" data-term="' + k + '" title="Termin disponieren" aria-label="Termin disponieren">' +
      svg(ICON.calendar, 16) + '</button></td>' +
    '<td class="c-act">' + (istToDo(it)
      ? '<button class="td-actions" data-todoedit="' + k + '" title="To-Do bearbeiten" aria-label="To-Do bearbeiten">' + svg(ICON.edit, 16) + '</button>'
      : '<button class="td-actions" data-open="' + k + '" title="Details anzeigen" aria-label="Details anzeigen">' + svg(ICON.chevR, 16) + '</button>') + '</td>' +
    '</tr>';
  }).join('');

  return '<div class="tbl-wrap"><table class="cds"><caption class="sr-only">Wartungspositionen</caption><thead><tr>' +
    '<th scope="col" class="c-tick"><span class="sr-only">Erledigen</span></th>' +
    th('Objekt', 'c-obj', 'objekt_name') +
    th('Tätigkeit', 'c-task', 'taetigkeit') +
    th('Zuständig', 'c-user', 'zustaendig') +
    th('Frist', 'c-due', 'bis') +
    th('Erledigt', 'c-done', 'done') +
      '<th scope="col" class="c-act no-print"><span class="sr-only">Termin</span></th>' +
      '<th scope="col" class="c-act no-print"><span class="sr-only">Details</span></th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div>';
}

/* --- Standort-Arbeitsliste (Standardansicht) ---------------------------
   Kritische Standorte zuerst; Klick klappt die Positionen auf und macht
   sie direkt abhakbar.
   ------------------------------------------------------------------------ */
/* --- Gruppierung: Standorte --------------------------------------------
   Datensätze ohne Standortbezug (z. B. allgemeine To-Dos) bekommen eine
   eigene Gruppe, damit sie nicht zwischen echten Standorten untergehen. */
function filteredGroups(list) {
  const m = new Map();
  for (const it of list) {
    const k = (it.objekt_nr || it.objekt_name) ? groupKey(it) : '\u007eohne';
    if (!m.has(k)) m.set(k, { nr: it.objekt_nr || '', name: it.objekt_name || 'Ohne Standortbezug', items: [] });
    m.get(k).items.push(it);
  }
  return Array.from(m.entries());
}

function locRank(g) {
  let over = 0, soon = 0, open = 0;
  for (const it of g.items) {
    if (it.erledigt) continue;
    const s = statusOf(it);
    if (s === 'over') over++; else if (s === 'soon') soon++; else open++;
  }
  return { over, soon, open };
}

function viewLocations(list) {
  const groups = filteredGroups(list);
  const byNr = (a, b) => (a[1].nr || '').localeCompare(b[1].nr || '', 'de', { numeric: true }) ||
                         (a[1].name || '').localeCompare(b[1].name || '', 'de');
  if (state.sort === 'loc-nr') groups.sort(byNr);
  else groups.sort((a, b) => {                       // kritische zuerst
    const ra = locRank(a[1]), rb = locRank(b[1]);
    return (rb.over - ra.over) || (rb.soon - ra.soon) || (rb.open - ra.open) || byNr(a, b);
  });

  const sections = groups.map(([k, g]) => {
    const r = locRank(g);
    const done = g.items.length - r.open - r.over - r.soon;
    const pct = Math.round(done / g.items.length * 100);
    const complete = done === g.items.length;
    const isOpen = state.expanded.has(k);
    const sorted = g.items.slice().sort((a, b) =>
      (Number(a.erledigt) - Number(b.erledigt)) ||
      (STATUS_ORDER[statusOf(a)] - STATUS_ORDER[statusOf(b)]) ||
      (a.taetigkeit || '').localeCompare(b.taetigkeit || '', 'de'));

    const rows = sorted.map(it => workRow(it, false)).join('');

    const openTasks = g.items.filter(i => !i.erledigt && i.taetigkeit).map(i => i.taetigkeit);
    const todos = g.items.filter(istToDo).length;
    const preview = openTasks.length
      ? esc(openTasks.slice(0, 3).join(' · ')) +
        (openTasks.length > 3 ? ' <span class="more">+' + (openTasks.length - 3) + '</span>' : '')
      : '';

    return '<section class="loc' + (isOpen ? ' open' : '') + (complete ? ' finished' : '') + '">' +
      '<div class="loc-head" data-loc="' + esc(k) + '" role="button" tabindex="0" aria-expanded="' + isOpen + '" ' +
        'title="' + esc(openTasks.length ? openTasks.join(' · ') : 'alle Positionen erledigt') + '">' +
        '<span class="loc-caret">' + svg(ICON.chevR, 16) + '</span>' +
        '<span class="loc-nr">' + esc(g.nr || '–') + '</span>' +
        '<span class="loc-name">' + esc(g.name || 'Unbenannt') + '</span>' +
        (r.over ? tag(r.over + ' überfällig', 'red') : '') +
        (r.soon ? tag(r.soon + ' bald fällig', 'yellow') : '') +
        (todos ? tag(todos + ' To-Do' + (todos === 1 ? '' : 's'), 'gray') : '') +
        (complete ? tag('abgeschlossen', 'green', ICON.check) : '') +
        '<span class="loc-preview">' + preview + '</span>' +
        '<span class="loc-progress' + (pct === 100 ? ' full' : '') + '"><i style="width:' + pct + '%"></i></span>' +
        '<span class="loc-count">' + done + ' von ' + g.items.length + ' erledigt</span>' +
        '<button class="td-actions" data-termloc="' + esc(k) + '" ' +
          'title="Termin für diesen Standort disponieren" aria-label="Termin für diesen Standort disponieren">' +
          svg(ICON.calendar, 16) + '</button>' +
      '</div>' +
      (isOpen ? '<div class="loc-rows">' + rows + '</div>' : '') +
    '</section>';
  }).join('');

  return '<div class="locs">' + sections + '</div>';
}

/* --- Gemeinsame Arbeitszeile (Standortliste und Zeitplan) --------------- */
function workRow(it, showObject) {
  const k = esc(keyOf(it));
  const task = showObject
    ? '<span class="loc-task"><span class="c-main" title="' + esc(it.taetigkeit) + '">' + todoBadge(it) + esc(it.taetigkeit || '–') + '</span>' +
      '<span class="c-sub"><span class="obj-nr">' + esc(it.objekt_nr || '–') + '</span> ' + esc(it.objekt_name || '') + '</span></span>'
    : '<span class="loc-task"><span class="c-main" title="' + esc(it.taetigkeit) + '">' + todoBadge(it) + esc(it.taetigkeit || '–') + '</span></span>';
  return '<div class="loc-row' + (it.erledigt ? ' done' : '') + (istToDo(it) ? ' ist-todo' : '') + '" data-id="' + k + '">' +
    tickControl(it) + task +
    '<span class="loc-note" title="' + esc(it.kommentar) + '">' + esc(it.kommentar || '') + '</span>' +
    '<span class="loc-due">' + dueCell(it) + '</span>' +
    '<span class="loc-user">' + esc(it.zustaendig || '–') + '</span>' +
    erledigtInfo(it) +
    '<button class="td-actions" data-term="' + k + '" title="Termin disponieren" aria-label="Termin disponieren">' +
      svg(ICON.calendar, 16) + '</button>' +
    (istToDo(it)
      ? '<button class="td-actions" data-todoedit="' + k + '" title="To-Do bearbeiten" aria-label="To-Do bearbeiten">' + svg(ICON.edit, 16) + '</button>'
      : '<button class="td-actions" data-open="' + k + '" title="Details anzeigen" aria-label="Details anzeigen">' + svg(ICON.chevR, 16) + '</button>') +
  '</div>';
}

/* --- Zeitplan: Positionen nach Dringlichkeit gruppiert ------------------
   Beantwortet "Was ist zuerst dran?" – die Standortliste beantwortet
   "Was liegt auf meiner Strecke?". Innerhalb der Gruppe gilt die gewählte
   Sortierung, weil die bereits sortierte Liste nur einsortiert wird.
   ------------------------------------------------------------------------ */
const PLAN_GROUPS = [
  { key: 'over', label: 'Überfällig', tone: 'red' },
  { key: 'soon', label: 'Bald fällig', tone: 'yellow' },
  { key: 'open', label: 'Im Zeitraum', tone: 'blue' },
  { key: 'plan', label: 'Später geplant', tone: 'gray' },
  { key: 'done', label: 'Erledigt', tone: 'green' }
];

function viewTimeline(list) {
  const buckets = new Map();
  for (const it of list) {
    const k = statusOf(it);
    if (!buckets.has(k)) buckets.set(k, []);
    buckets.get(k).push(it);
  }
  const groups = PLAN_GROUPS.filter(g => buckets.has(g.key));
  if (!groups.length) return '<div class="plan leer">Keine Positionen im aktuellen Filter.</div>';

  return '<div class="plan">' + groups.map(g => {
    const items = buckets.get(g.key);
    const open = !state.collapsed.has('plan:' + g.key);
    const sub = g.key === 'done'
      ? items.length + ' abgeschlossen'
      : items.length + ' Position' + (items.length === 1 ? '' : 'en') + ' offen';
    return '<section class="plan-sec' + (open ? ' open' : '') + '">' +
      '<button class="plan-head" data-plan="' + g.key + '" aria-expanded="' + open + '">' +
        '<span class="plan-caret">' + svg(ICON.chevR, 16) + '</span>' +
        tag(g.label, g.tone) +
        '<span class="plan-sub">' + sub + '</span>' +
      '</button>' +
      (open ? '<div class="loc-rows">' + items.map(i => workRow(i, true)).join('') + '</div>' : '') +
    '</section>';
  }).join('') + '</div>';
}

/* ------------------------------------------------- 6. Detail-Seitenleiste */
function openPanel(id, opts = {}) {
  const it = state.items.find(x => String(x.id) === String(id));
  if (!it) return;
  state.panelId = String(id);

  const s = statusOf(it), d = dueInfo(it.bis);
  const val = (v, mono) => v ? '<dd' + (mono ? ' class="t-mono"' : '') + '>' + esc(v) + '</dd>'
                             : '<dd class="empty-val">nicht angegeben</dd>';
  const line = (label, v, mono) => '<div class="row"><dt>' + label + '</dt>' + val(v, mono) + '</div>';

  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML =
    '<div class="panel" role="dialog" aria-modal="true" aria-label="Details zur Wartungsposition">' +
      '<header>' +
        '<h2>' + esc(it.objekt_name || 'Wartungsposition') + '</h2>' +
        tag(STATUS[s].label, STATUS[s].tone) +
        '<button class="td-actions" data-x aria-label="Schließen">' + svg(ICON.close, 16) + '</button>' +
      '</header>' +
      '<div class="body">' +
        '<div class="notice">' + svg(ICON.info, 16) + '<span>Stammdaten sind schreibgeschützt und werden in der ' +
          'Datenbank gepflegt. Änderbar sind ausschließlich Erledigung und Notiz.</span></div>' +

        '<div class="sect"><h3>Objekt</h3>' +
          line('Objektart', it.objekt_art) +
          line('Objekt-Nr.', it.objekt_nr, true) +
          line('Objektname', it.objekt_name) +
        '</div>' +

        '<div class="sect"><h3>Auftrag</h3>' +
          line('Tätigkeit', it.taetigkeit) +
          line('Beschreibung', it.beschreibung) +
          line('Kommentar', it.kommentar) +
          line('Gültig ab', it.ab, true) +
          line('Frist bis', it.bis, true) +
          '<div class="row"><dt>Friststatus</dt><dd><span class="due ' + d.cls + '">' + esc(d.text) + '</span></dd></div>' +
          line('Zuständig', it.zustaendig) +
        '</div>' +

        '<div class="sect"><h3>Erledigung</h3>' +
          '<div class="tgl-row">' +
            '<div class="t"><b>Erledigt</b><span>Datum und Person werden mitprotokolliert</span></div>' +
            '<button class="tgl" role="switch" aria-checked="' + !!it.erledigt + '" id="panelDone" ' +
              'aria-label="Erledigt umschalten"></button>' +
          '</div>' +
          '<div id="doneFields" style="display:' + (it.erledigt ? 'block' : 'none') + '">' +
            '<div class="row"><dt>Erledigt am</dt><dd id="pDoneAm" class="t-mono">' + esc(it.erledigt_am || '–') + '</dd></div>' +
            '<div class="row"><dt>Erledigt durch</dt><dd id="pDoneBy">' + esc(it.erledigt_durch || '–') + '</dd></div>' +
            '<div class="fld" style="margin-top:16px">' +
              '<label for="panelNote">Notiz / Feststellung</label>' +
              '<textarea class="inp" id="panelNote" placeholder="z. B. RCD defekt, Ersatz bestellt">' + esc(it.erledigt_notiz || '') + '</textarea>' +
              '<div class="hint">Wird zur Position gespeichert – z. B. Auffälligkeiten für die Disposition.</div>' +
            '</div>' +
          '</div>' +
          '<div id="notDoneHint" class="t-helper" style="display:' + (it.erledigt ? 'none' : 'block') + '">' +
            'Diese Position ist noch offen. Notizen sind nach der Erledigung möglich.</div>' +
        '</div>' +

        '<div class="sect"><h3>Anhänge</h3><div id="panelAtt"></div></div>' +
      '</div>' +
      '<div class="foot">' +
        '<button class="btn btn-tertiary" id="panelTermin">' + svg(ICON.calendar, 14) + 'Termin planen</button>' +
        '<span class="spacer"></span>' +
        '<button class="btn btn-tertiary" data-x>Schließen</button>' +
        '<button class="btn btn-primary" id="panelSave" disabled>Notiz speichern</button>' +
      '</div>' +
    '</div>';

  const close = () => { scrim.remove(); state.panelId = null; document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
  document.addEventListener('keydown', onKey);
  scrim.addEventListener('click', async (e) => {
    if (e.target === scrim || e.target.closest('[data-x]')) return close();
    if (e.target.closest('#panelDone')) return doToggle();
    if (e.target.closest('#panelSave')) return saveNote();
    if (e.target.closest('#panelTermin')) return dispatchTermin(findByKey('w:' + id));
  });

  const noteEl = () => scrim.querySelector('#panelNote');
  const saveBtn = () => scrim.querySelector('#panelSave');

  async function doToggle() {
    const now = !state.items.find(x => String(x.id) === String(id)).erledigt;
    if (now && !await ensureUser()) return;
    if (now) {
      const data = await completionDialog(state.items.find(x => String(x.id) === String(id)));
      if (!data) return;
      await apply(id, data, scrim);
    } else {
      await apply(id, { erledigt: false, erledigt_am: '', erledigt_durch: '' }, scrim);
    }
  }

  async function apply(pid, patch, scope) {
    const updated = await finish(pid, patch);
    if (!updated) return;
    const it2 = updated;
    scope.querySelector('#panelDone').setAttribute('aria-checked', String(!!it2.erledigt));
    scope.querySelector('#doneFields').style.display = it2.erledigt ? 'block' : 'none';
    scope.querySelector('#notDoneHint').style.display = it2.erledigt ? 'none' : 'block';
    scope.querySelector('#pDoneAm').textContent = it2.erledigt_am || '–';
    scope.querySelector('#pDoneBy').textContent = it2.erledigt_durch || '–';
    const tagHost = scope.querySelector('.panel > header .tag');
    if (tagHost) { const st = statusOf(it2); tagHost.className = 'tag ' + STATUS[st].tone; tagHost.textContent = STATUS[st].label; }
    if (!it2.erledigt) scope.querySelector('#panelNote').value = '';
    scope.querySelector('#panelSave').disabled = true;
  }

  function saveNote() {
    const v = noteEl().value;
    finish(id, { erledigt_notiz: v }).then(() => { saveBtn().disabled = true; });
  }

  const ta = noteEl();
  if (ta) ta.addEventListener('input', () => { saveBtn().disabled = ta.value === (it.erledigt_notiz || ''); });
  if (ta) ta.addEventListener('blur', () => { if (!saveBtn().disabled) saveNote(); });

  $('#overlay').appendChild(scrim);
  renderAttachments(scrim, 'wartung', id);
  // Bei Aufruf über „+ Notiz": Notizfeld direkt anspringen
  setTimeout(() => {
    if (opts.focusNote && it.erledigt && ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    else { const f = scrim.querySelector('#panelDone'); if (f) f.focus(); }
  }, 30);
}

/* ------------------------------------------------- Anhänge (mit Kommentaren) */
const fmtBytes = (n) => {
  n = Number(n) || 0;
  return n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(0) + ' kB' : (n / 1048576).toFixed(1) + ' MB';
};
const istBild = (a) => /^image\//.test(a.mime || '');
const anhangIcon = (a) => istBild(a) ? ICON.image : ICON.link;

/**
 * Anhangliste rendern – für Wartungspositionen (art='wartung') und
 * eigene To-Dos (art='todo'). Zu jedem Anhang ist ein Kommentar möglich.
 */
async function renderAttachments(scope, art, id, opts = {}) {
  const host = scope.querySelector('#panelAtt');
  if (!host) return;

  if (!store.supportsAttachments) {
    host.innerHTML = '<div class="t-helper">Anhänge (z. B. Messprotokoll als PDF oder Foto) benötigen das SQL-Backend. ' +
      'Die Schnittstelle ist vorbereitet: <span class="t-mono">POST /api/' +
      (art === 'todo' ? 'todos' : 'items') + '/:id/anhaenge</span>.</div>';
    return;
  }

  host.innerHTML = '<div class="t-helper">Lade Anhänge …</div>';
  let list;
  try { list = (await store.listAttachments(art, id)) || []; }
  catch (e) {
    host.innerHTML = '<div class="t-helper">Anhänge konnten nicht geladen werden: ' + esc(e.message) + '</div>';
    return;
  }

  host.innerHTML =
    (list.length
      ? '<ul class="atts">' + list.map(a =>
          '<li>' +
            '<a class="att" href="' + esc(store.attachmentUrl(art, id, a.id)) + '" target="_blank" rel="noopener" ' +
              'title="Anhang öffnen">' + svg(anhangIcon(a), 14) + '<span>' + esc(a.dateiname) + '</span></a>' +
            '<span class="att-meta">' + fmtBytes(a.groesse) + (a.hochgeladen_am ? ' · ' + esc(a.hochgeladen_am) : '') + '</span>' +
            '<button class="btn-note" data-attdel="' + esc(a.id) + '" title="Anhang löschen" ' +
              'aria-label="Anhang löschen">' + svg(ICON.close, 12) + '</button>' +
            '<span class="att-kom">' +
              '<input class="inp att-kom-inp" data-attkom="' + esc(a.id) + '" ' +
                'value="' + esc(a.kommentar || '') + '" placeholder="Kommentar zum Anhang …">' +
            '</span>' +
            (istBild(a)
              ? '<a class="att-thumb" href="' + esc(store.attachmentUrl(art, id, a.id)) + '" target="_blank" rel="noopener">' +
                '<img src="' + esc(store.attachmentUrl(art, id, a.id)) + '" alt="' + esc(a.dateiname) + '" loading="lazy"></a>'
              : '') +
          '</li>').join('') + '</ul>'
      : '<div class="t-helper">Noch keine Anhänge hinterlegt.</div>') +
    '<label class="btn btn-sm btn-tertiary" style="margin-top:10px">' +
      svg(ICON.plus, 14) + 'Bild oder Datei anhängen' +
      '<input type="file" id="panelFile" hidden></label>' +
    '<div class="hint">z. B. Foto, Messprotokoll oder Prüfbericht (max. 10 MB)</div>';

  const fileEl = host.querySelector('#panelFile');
  fileEl.addEventListener('change', async e => {
    const f = e.target.files[0];
    if (!f) return;
    if (f.size > 10 * 1024 * 1024) return toast('Datei zu groß', { tone: 'warning', detail: 'Maximal 10 MB je Anhang.' });
    try {
      await store.uploadAttachment(art, id, f, '');
      toast('Anhang hinzugefügt', { tone: 'success', detail: f.name });
      renderAttachments(scope, art, id, opts);
    } catch (err) {
      toast('Anhang konnte nicht gespeichert werden', { tone: 'error', detail: err.message });
    }
  });

  host.querySelectorAll('[data-attdel]').forEach(b => b.addEventListener('click', async () => {
    try {
      await store.removeAttachment(art, id, b.dataset.attdel);
      toast('Anhang gelöscht', { tone: 'success' });
      renderAttachments(scope, art, id, opts);
    } catch (err) {
      toast('Anhang konnte nicht gelöscht werden', { tone: 'error', detail: err.message });
    }
  }));

  // Kommentar speichern, wenn das Feld verlassen wird
  host.querySelectorAll('[data-attkom]').forEach(i => i.addEventListener('change', async () => {
    try {
      await store.commentAttachment(i.dataset.attkom, i.value.trim());
      toast('Kommentar zum Anhang gespeichert', { tone: 'success', ms: 2500 });
    } catch (err) {
      toast('Kommentar konnte nicht gespeichert werden', { tone: 'error', detail: err.message });
    }
  }));
}

/* ==========================================================================
   Combobox – durchsuchbares Auswahlfeld (ersetzt einfache Dropdowns).
   multi=false: Einzelauswahl, Wert steht in host.dataset.value
   multi=true : Mehrfachauswahl, Werte stehen als Chips im Feld
   Tippen filtert (umlauttolerant), Pfeiltasten/Enter wählen, Esc schließt.
   ========================================================================== */
function comboBox(host, { options = [], selected = [], multi = false, placeholder = 'suchen …', onChange }) {
  if (!host) return;
  if (host.__comboCleanup) host.__comboCleanup();      // alten Listener entfernen
  const sel = multi ? (Array.isArray(selected) ? selected.slice() : []) : [];
  let single = multi ? '' : (Array.isArray(selected) ? (selected[0] || '') : (selected || ''));
  let query = '', active = -1;

  host.innerHTML =
    '<div class="combo">' +
      '<div class="combo-field">' +
        '<span class="combo-chips"></span>' +
        '<input class="combo-input" type="text" autocomplete="off" spellcheck="false" ' +
          'role="combobox" aria-expanded="false" aria-autocomplete="list">' +
        '<span class="combo-carets">' + svg(ICON.chevD, 14) + '</span>' +
      '</div>' +
      '<div class="combo-list" role="listbox" hidden></div>' +
    '</div>';

  const field = host.querySelector('.combo-field');
  const input = host.querySelector('.combo-input');
  const list = host.querySelector('.combo-list');
  const chips = host.querySelector('.combo-chips');

  const currentValues = () => multi ? sel : (single ? [single] : []);
  const filtered = () => {
    const q = norm(query);
    return options.filter(o => !currentValues().includes(o) && (!q || norm(o).includes(q)));
  };

  const syncValue = () => {
    host.dataset.value = multi ? sel.join(' | ') : single;
    input.placeholder = multi && sel.length ? '' : (single ? '' : placeholder);
  };

  function renderChips() {
    chips.innerHTML = currentValues().map(v =>
      '<span class="combo-chip" data-v="' + esc(v) + '">' + esc(v) +
      '<button type="button" class="combo-x" data-del="' + esc(v) + '" aria-label="' + esc(v) + ' entfernen">' +
      svg(ICON.close, 10) + '</button></span>').join('');
  }

  function renderList() {
    const f = filtered();
    active = Math.max(-1, Math.min(f.length - 1, active));
    list.innerHTML = f.length
      ? f.map((o, i) => '<button type="button" class="combo-opt' + (i === active ? ' on' : '') +
          '" role="option" data-i="' + i + '">' + esc(o) + '</button>').join('')
      : '<div class="combo-empty">kein Treffer' +
        (query ? ' – <b>' + esc(query) + '</b> frei übernehmen mit Enter' : '') + '</div>';
  }

  function open() {
    if (!list.hidden) return;
    list.hidden = false;
    input.setAttribute('aria-expanded', 'true');
    field.classList.add('is-open');
    host.dataset.open = '1';
    renderList();
  }
  function close() {
    list.hidden = true;
    input.setAttribute('aria-expanded', 'false');
    field.classList.remove('is-open');
    host.dataset.open = '';
    query = ''; input.value = ''; active = -1;
  }
  const commit = (vals) => {
    if (multi) { sel.length = 0; sel.push(...vals); }
    else single = vals[0] || '';
    syncValue(); renderChips(); renderList();
    if (onChange) onChange(multi ? sel.slice() : single);
  };
  /** Freie Eingabe übernehmen (Person, die nicht in der Liste steht) */
  function takeFree() {
    const v = input.value.trim();
    if (!v) return false;
    commit(multi ? sel.concat([v]) : [v]);
    close();
    return true;
  }

  field.addEventListener('click', e => {
    const del = e.target.closest('[data-del]');
    if (del) { e.stopPropagation(); commit(currentValues().filter(v => v !== del.dataset.del)); return; }
    if (!e.target.closest('.combo-x')) { open(); input.focus(); }
  });
  input.addEventListener('focus', open);
  input.addEventListener('input', () => { query = input.value; active = -1; open(); renderList(); });
  input.addEventListener('keydown', e => {
    const f = filtered();
    if (e.key === 'ArrowDown') { e.preventDefault(); open(); active = Math.min(f.length - 1, active + 1); renderList(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(0, active - 1); renderList(); }
    else if (e.key === 'Enter') {
      e.preventDefault(); e.stopPropagation();
      if (active >= 0 && f[active]) commit(multi ? sel.concat([f[active]]) : [f[active]]);
      else takeFree();
      if (!multi) { close(); } else { query = ''; input.value = ''; renderList(); }
    }
    else if (e.key === 'Escape') { e.stopPropagation(); close(); }
    else if (e.key === 'Backspace' && !input.value && currentValues().length) {
      const v = currentValues(); v.pop(); commit(v);
    }
  });
  list.addEventListener('mousedown', e => {
    const o = e.target.closest('.combo-opt');
    if (!o) return;
    e.preventDefault();
    const v = filtered()[+o.dataset.i];
    if (v == null) return;
    commit(multi ? sel.concat([v]) : [v]);
    if (!multi) close(); else { query = ''; input.value = ''; input.focus(); renderList(); }
  });
  field.addEventListener('mousedown', e => e.stopPropagation());

  // Klick außerhalb schließt die Liste
  const onDoc = (e) => { if (!host.contains(e.target)) close(); };
  document.addEventListener('mousedown', onDoc);
  host.__comboCleanup = () => document.removeEventListener('mousedown', onDoc);

  syncValue(); renderChips();
}

/* ==========================================================================
   8. Termin-Disposition (Outlook Web + ICS für Desktop-Outlook)
   Vorgaben: Ort = "{objekt_nr} {objekt_name}", Betreff = Tätigkeit,
   Standard ganztägig, Teilnehmer voreingestellt (Einstellungen) und änderbar.
   ========================================================================== */
const fmtIso = (d) => d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());      // yyyy-mm-dd
const zeitAm = (tag) => { const d = new Date(tag.getTime()); d.setHours(8, 30, 0, 0); return d; };
const endeAm = (tag) => { const d = new Date(tag.getTime()); d.setHours(11, 30, 0, 0); return d; };
const icsDay = (d) => String(d.getFullYear()) + p2(d.getMonth() + 1) + p2(d.getDate());          // yyyymmdd

/** Termin-Beschreibung nach Vorgabe */
function terminBody(it) {
  return [
    'Zuständig: ' + (it.zustaendig || '-'),
    it.kommentar ? 'Hinweis: ' + it.kommentar : null,
    it.intervall ? 'Intervall: ' + it.intervall : null,
    it.extra && !it.intervall ? 'Umfang: ' + it.extra : null
  ].filter(Boolean).join('\n');
}
const terminOrt = (it) => (it.ort || ((it.objekt_nr || '') + ' ' + (it.objekt_name || ''))).trim();
const terminSubject = (it) => it.subject || it.taetigkeit || 'Wartung';

/** Lokale Zeit ohne Zeitzone – Outlook Web erwartet die Zeit in der Zeitzone des Nutzers */
const localIso = (d) => d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) +
  'T' + p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':00';
/** UTC-Zeitstempel für iCalendar: YYYYMMDDTHHMMSSZ */
const icsTime = (d) => d.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';

function outlookWebUrl(it, o) {
  const params = new URLSearchParams({
    path: '/calendar/action/compose', rru: 'addevent',
    subject: terminSubject(it),
    location: terminOrt(it),
    startdt: o.allDay ? fmtIso(o.start) : localIso(o.start),
    enddt: o.allDay ? fmtIso(o.ende) : localIso(o.ende),
    body: terminBody(it)
  });
  if (o.allDay) params.append('allday', 'true');
  const to = (o.attendees || []).filter(Boolean);
  if (to.length) params.append('to', to.join(';'));
  return 'https://outlook.office.com/calendar/deeplink/compose?' + params.toString();
}

/** iCalendar (RFC 5545) – mit UID und DTSTAMP, sonst lehnen viele Clients die Datei ab. */
function icsText(it, o) {
  const esc1 = (s) => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
  const uid = ((it.external_id || String(it.id)) + '-' + Date.now()) + '@wartungstool';
  const dtstart = o.allDay ? 'DTSTART;VALUE=DATE:' + icsDay(o.start) : 'DTSTART:' + icsTime(o.start);
  const dtend = o.allDay ? 'DTEND;VALUE=DATE:' + icsDay(o.ende) : 'DTEND:' + icsTime(o.ende);
  const lines = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Wartungstool//DE', 'CALSCALE:GREGORIAN', 'METHOD:REQUEST',
    'BEGIN:VEVENT',
    'UID:' + uid,
    'DTSTAMP:' + icsTime(new Date()),
    'SEQUENCE:0',
    'SUMMARY:' + esc1(terminSubject(it)),
    'LOCATION:' + esc1(terminOrt(it)),
    'DESCRIPTION:' + esc1(terminBody(it)),
    ...(o.attendees || []).filter(Boolean).map(m =>
      'ATTENDEE;ROLE=REQ-PARTICIPANT;PARTSTAT=NEEDS-ACTION;RSVP=TRUE:mailto:' + m),
    dtstart, dtend,
    'BEGIN:VALARM', 'TRIGGER:-PT24H', 'ACTION:DISPLAY', 'DESCRIPTION:Erinnerung Wartung', 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR'
  ];
  return lines.join('\r\n');
}

/** Datum + Uhrzeit als lokale Date-Objekte aus Eingabefeldern */
function readDateTime(s, id) {
  const v = s.querySelector('#' + id).value;
  const d = new Date(v);
  return isNaN(d.getTime()) ? null : d;
}
const toLocalInput = (d) => d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) +
  'T' + p2(d.getHours()) + ':' + p2(d.getMinutes());

/** Ziel für die Termin-Disposition: entweder eine Position oder ein Standort. */
function terminZielStandort(g) {
  const offen = g.items.filter(i => !i.erledigt).length;
  return {
    key: 'loc:' + (g.nr || g.name),
    subject: 'Wartungsarbeiten',
    ort: ((g.nr || '') + ' ' + (g.name || '')).trim(),
    zustaendig: uniq(g.items.map(i => i.zustaendig)).join(', '),
    kommentar: '',
    intervall: '',
    ab: '', bis: '',
    extra: g.items.length + ' Positionen, davon ' + offen + ' offen' +
      (g.nr ? '' : ' (Sammeltermin)')
  };
}
function terminZielPosition(it) {
  return {
    key: keyOf(it),
    subject: it.taetigkeit || 'Wartung',
    ort: terminOrt(it),
    zustaendig: it.zustaendig,
    kommentar: it.kommentar,
    intervall: it.intervall,
    ab: it.ab, bis: it.bis,
    extra: it.intervall || ''
  };
}

/** Dialog zur Termin-Disposition. Gibt eine Aktion zurück (web | ics) oder null.
 *  Standard ist ein GANZTÄGIGER Termin am heutigen Tag; Datum, Betreff, Uhrzeit
 *  und Teilnehmer sind jederzeit änderbar. */
function terminDialog(ziel) {
  const heute = new Date(); heute.setHours(0, 0, 0, 0);
  const ab = parseDate(ziel.ab);
  const tag = (ab && ab > heute) ? ab : heute;                 // Vorbelegung: heutiger Tag
  const mails = (settings.dispoMail || CONFIG.dispoMail).split(',').map(x => x.trim()).filter(Boolean);

  return new Promise(resolve => {
    const scrim = document.createElement('div');
    scrim.className = 'modal-scrim';
    scrim.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true" aria-label="Termin disponieren">' +
        '<header><h3>Termin disponieren</h3>' +
          '<button class="close" data-x aria-label="Schließen">' + svg(ICON.close, 16) + '</button></header>' +
        '<div class="body">' +
          '<div class="fld"><label for="dBetreff">Betreff</label>' +
            '<input class="inp" id="dBetreff" value="' + esc(ziel.subject) + '" placeholder="Wartungsarbeiten">' +
            (ziel.key.startsWith('loc:')
              ? '<div class="hint">Pauschaler Termin für den Standort – der Betreff ist frei wählbar.</div>' : '') +
          '</div>' +
          '<div class="row"><dt>Ort</dt><dd class="t-mono">' + esc(ziel.ort || '–') + '</dd></div>' +
          (ziel.zustaendig ? '<div class="row"><dt>Zuständig</dt><dd>' + esc(ziel.zustaendig) + '</dd></div>' : '') +
          (ziel.bis ? '<div class="row"><dt>Wartungsfenster</dt><dd>' +
            esc(ziel.ab || '–') + ' bis ' + esc(ziel.bis) + '</dd></div>' : '') +
          (ziel.extra ? '<div class="row"><dt>Umfang</dt><dd>' + esc(ziel.extra) + '</dd></div>' : '') +

          '<div class="fld" style="margin-top:16px"><label>Art</label>' +
            '<div class="switcher" id="dArt" role="group" aria-label="Art des Termins">' +
              '<button type="button" data-art="all" aria-pressed="true">Ganztägig</button>' +
              '<button type="button" data-art="time" aria-pressed="false">Mit Uhrzeit</button>' +
            '</div></div>' +

          '<div class="fld" id="dDayWrap"><label for="dTag">Datum</label>' +
            '<input class="inp" id="dTag" type="date" value="' + fmtIso(tag) + '"></div>' +

          '<div class="fgrid" id="dTimeWrap" hidden>' +
            '<div><label class="lbl" for="dStart">Beginn</label>' +
              '<input class="inp" id="dStart" type="datetime-local" value="' + toLocalInput(zeitAm(tag)) + '"></div>' +
            '<div><label class="lbl" for="dEnde">Ende</label>' +
              '<input class="inp" id="dEnde" type="datetime-local" value="' + toLocalInput(endeAm(tag)) + '"></div>' +
          '</div>' +

          '<div class="fld"><label for="dTeil">Teilnehmer</label>' +
            '<div class="combo-host" id="dTeil"></div>' +
            '<div class="hint">Voreingestellt aus den Einstellungen. Neue Adresse eintippen und mit Enter ' +
            'übernehmen; Chips lassen sich einzeln entfernen.</div></div>' +
        '</div>' +
        '<div class="foot">' +
          '<button class="btn btn-ghost" data-ics>' + svg(ICON.download, 14) + 'ICS für Outlook</button>' +
          '<span class="spacer"></span>' +
          '<button class="btn btn-tertiary" data-x>Abbrechen</button>' +
          '<button class="btn btn-primary" data-web>' + svg(ICON.calendar, 14) + 'In Outlook Web öffnen</button>' +
        '</div>' +
      '</div>';

    const art = () => scrim.querySelector('#dArt button[aria-pressed="true"]').dataset.art;
    const isAllDay = () => art() === 'all';
    const subject = () => scrim.querySelector('#dBetreff').value.trim() || ziel.subject;

    function applyArt() {
      const all = isAllDay();
      scrim.querySelector('#dDayWrap').hidden = !all;
      scrim.querySelector('#dTimeWrap').hidden = all;
    }
    scrim.querySelector('#dArt').addEventListener('click', e => {
      const b = e.target.closest('[data-art]');
      if (!b) return;
      scrim.querySelectorAll('#dArt button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      applyArt();
    });
    applyArt();

    comboBox(scrim.querySelector('#dTeil'), {
      options: uniq(mails.concat([CONFIG.dispoMail, settings.dispoMail])), selected: mails,
      multi: true, placeholder: 'E-Mail eintippen und Enter'
    });

    // Gemeinsame Felder für die Termin-Erzeugung
    const basis = () => ({
      subject: subject(), ort: ziel.ort, kommentar: ziel.kommentar, intervall: ziel.intervall, zustaendig: ziel.zustaendig,
      extra: ziel.extra, taetigkeit: subject(), objekt_nr: '', objekt_name: '',
      external_id: ziel.key
    });

    const collect = () => {
      const att = scrim.querySelector('#dTeil').dataset.value.split('|').map(x => x.trim()).filter(Boolean);
      const it = basis();
      if (isAllDay()) {
        const d = scrim.querySelector('#dTag').value;
        const start = new Date(d + 'T00:00:00');
        if (isNaN(start.getTime())) { toast('Bitte ein Datum wählen.', { tone: 'warning' }); return null; }
        return { allDay: true, start: start, ende: new Date(start.getTime() + 86400000), attendees: att, it: it };
      }
      const s1 = readDateTime(scrim, 'dStart'), e1 = readDateTime(scrim, 'dEnde');
      if (!s1 || !e1) { toast('Bitte Beginn und Ende angeben.', { tone: 'warning' }); return null; }
      if (e1 <= s1) { toast('Das Ende muss nach dem Beginn liegen.', { tone: 'warning' }); return null; }
      return { allDay: false, start: s1, ende: e1, attendees: att, it: it };
    };
    const done = (v) => { scrim.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); done(null); } };

    scrim.addEventListener('click', e => {
      if (e.target === scrim || e.target.closest('[data-x]')) return done(null);
      const isWeb = !!e.target.closest('[data-web]'), isIcs = !!e.target.closest('[data-ics]');
      if (!isWeb && !isIcs) return;
      const o = collect(); if (!o) return;
      if (o.attendees.length) { settings.dispoMail = o.attendees.join(', '); saveSettings(); }
      done({ action: isWeb ? 'web' : 'ics', o: o });
    });
    document.addEventListener('keydown', onKey);
    $('#overlay').appendChild(scrim);
    setTimeout(() => {
      const f = scrim.querySelector('#dTag');
      if (f && typeof f.focus === 'function') f.focus();
    }, 30);
  });
}

/** Termin-Disposition anstoßen (Zeile, Detailleiste oder Standortkopf) */
async function dispatchTermin(rec) {
  if (!rec) return;
  const ziel = rec.key ? rec : terminZielPosition(rec);
  const res = await terminDialog(ziel);
  if (!res) return;
  const it = res.o.it;
  if (res.action === 'web') {
    window.open(outlookWebUrl(it, res.o), '_blank', 'noopener,noreferrer');
    toast('Outlook Web geöffnet', {
      tone: 'success',
      detail: (res.o.allDay ? 'Ganztägig am ' + fmtDate(res.o.start)
                            : fmtDate(res.o.start) + ' ' + p2(res.o.start.getHours()) + ':' + p2(res.o.start.getMinutes())) +
        ' · ' + res.o.attendees.length + ' Teilnehmer · bitte in Outlook speichern'
    });
  } else {
    const name = 'Termin_' + ((it.ort || '') + '_' + (it.taetigkeit || 'Wartung'))
      .replace(/[^\w.-]+/g, '_').slice(0, 60) + '.ics';
    download(name, icsText(it, res.o), 'text/calendar');
    toast('ICS-Datei erstellt', {
      tone: 'success',
      detail: (res.o.allDay ? 'Ganztägig am ' + fmtDate(res.o.start) : fmtDate(res.o.start)) +
        ' · Öffnen legt den Termin in Outlook an.'
    });
  }
}

/* ==========================================================================
   9. Eigene To-Dos (To-Dos)
   Bewusst GETRENNT von den Wartungspunkten: eigene Liste, eigene Zählung,
   eigene Speicherung. Wartungspunkte sind Stammdaten (nur Administration),
   Eigene To-Dos gehören dem Techniker und sind hier anlegbar.
   Es werden dieselben Feldnamen benutzt, damit Frist-, Status- und
   Zeilenlogik unverändert wiederverwendet werden können.
   ========================================================================== */
const TODO_FIELDS = {
  taetigkeit: '', objekt_nr: '', objekt_name: '', kommentar: '', ab: '', bis: '',
  zustaendig: '', erledigt: false, erledigt_am: '', erledigt_durch: '', erledigt_notiz: '',
  erstellt_am: '', erstellt_von: '', external_id: '', hash_key: '', intervall: '', beschreibung: '',
  objekt_art: 'To-Do'
};
const normalizeTodo = (r) => markToDo(Object.assign({}, TODO_FIELDS, r, {
  id: r.id ?? null,
  erledigt: r.erledigt === true || r.erledigt === 1 || r.erledigt === '1' || r.erledigt === 'true'
}));

/* To-Dos und Wartungen teilen sich die Ansichten – daher brauchen die
   Datensätze eine unterscheidbare Kennung im DOM. Die Markierung ist
   absichtlich nicht aufzählbar, damit sie nicht in Exporte gelangt. */
const TODO_MARK = '__toDo';
function markToDo(t) {
  if (t) Object.defineProperty(t, TODO_MARK, { value: true, enumerable: false, writable: true, configurable: true });
  return t;
}
const istToDo = (x) => !!(x && x[TODO_MARK]);
const keyOf = (x) => (istToDo(x) ? 't' : 'w') + ':' + x.id;
function findByKey(key) {
  const s = String(key || '');
  const id = s.slice(2);
  return s.slice(0, 1) === 't'
    ? state.todos.find(x => String(x.id) === id)
    : state.items.find(x => String(x.id) === id);
}

/** Frist der To-Do: "bis" ist der Stichtag. */
/** Bezugsobjekt für die Ansichten: Wartungen, To-Dos oder beides gemischt. */
const istBereichTodo = () => state.bereich === 'todo';
const istBereichAlle = () => state.bereich === 'alle';

/** Gemeinsame Sortierung: Dringlichkeit, dann Frist. */
function sortByUrgency(list) {
  const FAR = new Date(8640000000000000);
  return list.sort((a, b) =>
    (STATUS_ORDER[statusOf(a)] - STATUS_ORDER[statusOf(b)]) ||
    ((parseDate(a.erledigt ? a.erledigt_am : a.bis) || FAR) - (parseDate(b.erledigt ? b.erledigt_am : b.bis) || FAR)) ||
    String(keyOf(a)).localeCompare(String(keyOf(b))));
}

/** Alle Datensätze des aktuellen Bereichs, gefiltert und sortiert. */
function aktuelleListe() {
  if (istBereichTodo()) return filteredTodos();
  if (istBereichAlle()) return sortByUrgency(filtered().concat(filteredTodos()));
  return filtered();
}

/** Zähler des aktuellen Bereichs. */
function aktuelleZahlen() {
  if (istBereichTodo()) return todoCounts();
  if (istBereichAlle()) {
    const c = { alle: 0, done: 0, over: 0, soon: 0, open: 0, plan: 0, mine: 0 };
    for (const x of state.items.concat(state.todos)) {
      c.alle++; c[statusOf(x)]++;
      if (!x.erledigt && state.user && norm(x.zustaendig) === norm(state.user)) c.mine++;
    }
    c.pct = c.alle ? Math.round(c.done / c.alle * 100) : 0;
    return c;
  }
  return counts();
}

function filteredTodos() {
  const q = norm(state.query);
  const FAR = new Date(8640000000000000);
  const list = state.todos.filter(t => {
    if (q && !matchesQuery(t, q)) return false;
    if (state.personen.length && !state.personen.includes(t.zustaendig)) return false;
    if (state.mine && (!state.user || norm(t.zustaendig) !== norm(state.user))) return false;
    if (state.status === 'done' && !t.erledigt) return false;
    if (state.status !== 'alle' && state.status !== 'done' && statusOf(t) !== state.status) return false;
    return true;
  });
  list.sort((a, b) => (Number(a.erledigt) - Number(b.erledigt)) ||
    ((parseDate(a.bis) || FAR) - (parseDate(b.bis) || FAR)) ||
    String(a.id).localeCompare(String(b.id)));
  return list;
}

function todoCounts() {
  const c = { alle: state.todos.length, done: 0, over: 0, soon: 0, open: 0, plan: 0 };
  for (const t of state.todos) c[statusOf(t)]++;
  c.pct = c.alle ? Math.round(c.done / c.alle * 100) : 0;
  return c;
}

/* Die To-Do-Zeile (todoRow) und die eigene To-Do-Übersicht (viewTodos) sind
   entfallen: To-Dos nutzen dieselben Ansichten (Standorte / Liste / Zeitplan)
   wie die Wartungen und werden nur durch das To-Do-Kennzeichen unterschieden. */

/** Dialog zum Anlegen/Bearbeiten einer To-Do. */
function todoDialog(key) {
  const t = key == null ? null : (findByKey(key) || null);
  const d = t ? Object.assign({}, t) : Object.assign({}, TODO_FIELDS, {
    zustaendig: state.user || '',
    bis: fmtDate(new Date(Date.now() + 14 * 86400000)),
    erstellt_am: fmtDate(new Date()),
    erstellt_von: state.user || ''
  });
  const objList = objects();

  return modal({
    title: t ? 'To-Do bearbeiten' : 'Neues To-Do',
    danger: false,
    tertiary: t ? 'Löschen' : null,
    bodyHtml:
      '<div class="notice">' + svg(ICON.info, 16) + '<span>Eigene To-Dos sind keine Wartungsstammdaten: ' +
        'sie gehören zur Arbeit vor Ort und dürfen hier angelegt und geändert werden.</span></div>' +

      (t ? '<div class="fld"><label>Anhänge</label><div id="panelAtt"></div></div>' : '') +

        (d.erstellt_von ? ' von ' + esc(d.erstellt_von) : '') + '</div>' : ''),
    primary: t ? 'Speichern' : 'To-Do anlegen',
    collect: (s) => {
      const bezug = s.querySelector('#tObjekt').dataset.value.trim();
      const nr = (bezug.match(/^(\S+)\s*(.*)$/) || ['', '', '']);
      return {
        id: t ? t.id : null,
        taetigkeit: s.querySelector('#tText').value.trim(),
        objekt_nr: nr[1] || '',
        objekt_name: nr[2] || '',
        bis: s.querySelector('#tFaellig').value.trim(),
        ab: '',
        zustaendig: s.querySelector('#tPerson').dataset.value.trim(),
        kommentar: s.querySelector('#tNote').value.trim(),
        erstellt_am: d.erstellt_am,
        erstellt_von: d.erstellt_von
      };
    },
    validate: (x) => !x.taetigkeit ? 'Bitte die Aufgabe beschreiben.'
      : (x.bis && !parseDate(x.bis) ? 'Bitte ein gültiges Datum im Format TT.MM.JJJJ angeben.' : null),
    onMount: (s) => {
      comboBox(s.querySelector('#tObjekt'), {
        options: objList.map(o => o.nr + ' ' + o.name), selected: d.objekt_nr ? d.objekt_nr + ' ' + d.objekt_name : '',
        multi: false, placeholder: 'ohne Bezug'
      });
      comboBox(s.querySelector('#tPerson'), {
        options: uniq([state.user].concat(state.items.map(i => i.zustaendig)).filter(Boolean)),
        selected: d.zustaendig, multi: false, placeholder: 'Name, Vorname'
      });
      const f = s.querySelector('#tFaellig');
      f.addEventListener('input', () => { f.value = maskDate(f.value); });
      s.querySelector('#tText').focus();
      if (t) renderAttachments(s, 'todo', t.id);      // Anhänge nur bei bestehenden To-Dos
    },
    onTertiary: () => { if (t) deleteTodo(t.id); return false; }   // false = Dialog schließen
  });
}

async function saveTodo(data) {
  try {
    const saved = await store.saveTodo(data);
    const norm = normalizeTodo(saved);
    const i = state.todos.findIndex(x => String(x.id) === String(norm.id));
    if (i >= 0) state.todos[i] = norm; else state.todos.push(norm);
    render();
    return norm;
  } catch (e) {
    toast('To-Do konnte nicht gespeichert werden', { tone: 'error', detail: e.message });
    return null;
  }
}

async function deleteTodo(id) {
  const t = state.todos.find(x => String(x.id) === String(id));
  if (!t) return;
  try {
    await store.removeTodo(id);
    state.todos = state.todos.filter(x => String(x.id) !== String(id));
    render();
    toast('To-Do gelöscht', {
      tone: 'warning', detail: t.taetigkeit,
      actionLabel: 'Rückgängig',
      action: async () => { await saveTodo(t); toast('Wiederhergestellt', { tone: 'success' }); }
    });
  } catch (e) {
    toast('Löschen fehlgeschlagen', { tone: 'error', detail: e.message });
  }
}

/** Erledigt-Häkchen für Eigene To-Dos */
async function todoDone(key, on) {
  const t = findByKey(key);
  if (!t) return;
  if (on && !await ensureUser()) return;
  await saveTodo(Object.assign({}, t, on
    ? { erledigt: true, erledigt_am: fmtDate(new Date()), erledigt_durch: state.user }
    : { erledigt: false, erledigt_am: '', erledigt_durch: '' }));
  toast(on ? 'To-Do erledigt' : 'To-Do wieder offen', {
    tone: on ? 'success' : 'warning', detail: t.taetigkeit
  });
}

}

    if (Array.isArray(a)) state.collapsed = new Set(a);

}

async function ensureUser() {
  if (state.user) return true;

/** Erledigung schreiben (lokal oder über die API) und Oberfläche aktualisieren. */
async function finish(id, patch) {
  const it = state.items.find(x => String(x.id) === String(id));
  if (!it) return null;
  const before = { erledigt: it.erledigt, erledigt_am: it.erledigt_am, erledigt_durch: it.erledigt_durch, erledigt_notiz: it.erledigt_notiz };
  Object.assign(it, patch);              // optimistisch
  render();
  try {
    const saved = await store.complete(id, patch);
    Object.assign(it, saved);
    state.online = true;
  } catch (e) {
    Object.assign(it, before);           // zurückrollen
    state.online = false;
    renderSource();
    render();
    toast('Erledigung konnte nicht gespeichert werden', { tone: 'error', detail: e.message });
    return null;
  }
  renderSource();
  return it;
}

/** Abhaken: schließt die Wartung ab und fragt dabei nach dem Abschlusskommentar. */
async function markDone(id) {
  const it = state.items.find(x => String(x.id) === String(id));
  if (!it) return;
  if (!await ensureUser()) return;
  const data = await completionDialog(it);
  if (!data) return;
  const updated = await finish(id, data);
  if (!updated) return;
  toast('Wartung abgeschlossen', {
    tone: 'success',
    detail: (it.objekt_name || '') + ' · ' + (it.taetigkeit || '') + ' · ' + data.erledigt_am +
      (data.erledigt_notiz ? ' · Kommentar gespeichert' : '')
  });
}

/** Häufige Abschlusskommentare – ein Tipp genügt. */
const COMMENT_PRESETS = [
  'Prüfung abgeschlossen, Protokoll abgelegt',
  'Wartung ohne Befund abgeschlossen',
  'Durchgeführt, Protokoll im Ordner abgelegt',
  'Mängel festgestellt – siehe Notiz',
  'Ausgeführt, Nacharbeit erforderlich'
];

async function reopen(id) {
  const it = state.items.find(x => String(x.id) === String(id));
  if (!it) return;
  const before = { erledigt: true, erledigt_am: it.erledigt_am, erledigt_durch: it.erledigt_durch };
  await finish(id, { erledigt: false, erledigt_am: '', erledigt_durch: '' });
  toast('Erledigung zurückgenommen', {
    tone: 'warning',
    detail: (it.objekt_name || '') + ' · ' + (it.taetigkeit || ''),
    actionLabel: 'Rückgängig',
    action: async () => { await finish(id, before); toast('Erledigung wiederhergestellt.', { tone: 'success' }); }
  });
}

function resetFilters() {
  Object.assign(state, { query: '', status: 'alle', objekt: '', taetigkeit: '', personen: [], mine: false });

  render();
}

/** Alle Gruppen der aktuellen Ansicht auf- oder zuklappen. */
function setAllExpanded(open) {
  const list = aktuelleListe();
  if (state.view === 'plan') {
    const keys = PLAN_GROUPS.map(g => 'plan:' + g.key).filter(k => list.some(i => statusOf(i) === k.slice(5)));
    state.collapsed = open ? new Set() : new Set(keys);
    saveCollapsed();
  } else if (state.view === 'objects') {
    state.expanded = open ? new Set(filteredGroups(list).map(([k]) => k)) : new Set();
    saveExpanded();
  }
  render();
}

function setBereich(b) {
  state.bereich = b;
  state.query = ''; state.status = 'alle'; state.objekt = ''; state.taetigkeit = '';
  state.personen = []; state.mine = false;
  const s = $('#search'); if (s) s.value = '';
  // Sinnvolle Startansicht je Bereich
  if (b === 'todo' && state.view === 'objects') state.view = 'objects';
  render();
}

function exportCsv() {
  const list = filtered();
  const cols = ['id', 'objekt_art', 'objekt_nr', 'objekt_name', 'beschreibung', 'taetigkeit', 'kommentar',
    'ab', 'bis', 'zustaendig', 'erledigt', 'erledigt_am', 'erledigt_durch', 'erledigt_notiz'];
  const q = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const csv = [cols.join(';')].concat(list.map(i => cols.map(c =>
    c === 'erledigt' ? q(i[c] ? 'ja' : 'nein') : q(i[c])).join(';'))).join('\r\n');
  download('wartungen_' + isoStamp() + '.csv', '\uFEFF' + csv, 'text/csv');
  toast('CSV-Datei erstellt', { tone: 'success', detail: list.length + ' Positionen · in Excel direkt öffnbar' });
}

/* ------------------------------------------------------------- Ereignisse */
$('#tableHost').addEventListener('click', async e => {
  if (e.target.closest('[data-act="reset"]')) return resetFilters();

  /* Standort-Termin zuerst prüfen: der Kalender-Knopf liegt INNERHALB des
     Standortkopfs ([data-loc]) – sonst würde nur aufgeklappt statt disponiert. */
  const termLoc = e.target.closest('[data-termloc]');
  if (termLoc) {
    e.stopPropagation();
    const g = filteredGroups(aktuelleListe()).find(([k]) => k === termLoc.dataset.termloc);
    if (g) return dispatchTermin(terminZielStandort(g[1]));
    return null;
  }
  const loc = e.target.closest('[data-loc]');
  if (loc) {
    const k = loc.dataset.loc;
    state.expanded.has(k) ? state.expanded.delete(k) : state.expanded.add(k);
    saveExpanded();
    return render();
  }
  const plan = e.target.closest('[data-plan]');
  if (plan) {
    const k = 'plan:' + plan.dataset.plan;
    state.collapsed.has(k) ? state.collapsed.delete(k) : state.collapsed.add(k);
    saveCollapsed();
    return render();
  }

  const tick = e.target.closest('[data-tick]');
  const term = e.target.closest('[data-term]');
  const todoEdit = e.target.closest('[data-todoedit]');
  const note = e.target.closest('[data-note]');
  const open = e.target.closest('[data-open]');

  if (tick) {
    e.stopPropagation();
    const rec = findByKey(tick.dataset.tick);
    if (!rec) return null;
    if (istToDo(rec)) return todoDone(keyOf(rec), !rec.erledigt);
    return rec.erledigt ? reopen(rec.id) : markDone(rec.id);
  }
  if (term) { e.stopPropagation(); return dispatchTermin(findByKey(term.dataset.term)); }
  if (todoEdit) {
    e.stopPropagation();
    const data = await todoDialog(todoEdit.dataset.todoedit);
    if (data) { await saveTodo(data); toast('To-Do gespeichert', { tone: 'success' }); }
    return;
  }
  if (note) {
    e.stopPropagation();
    const rec = findByKey(note.dataset.note);
    if (!rec) return null;
    return istToDo(rec) ? todoDialog(keyOf(rec)) : openPanel(rec.id, { focusNote: true });
  }
  if (open) { e.stopPropagation(); return openPanel(findByKey(open.dataset.open).id); }

  const row = e.target.closest('[data-id]');
  if (row) {
    const rec = findByKey(row.dataset.id);
    if (!rec) return null;
    if (istToDo(rec)) { const d = await todoDialog(keyOf(rec)); if (d) await saveTodo(d); return; }
    return openPanel(rec.id);
  }
});

$('#search').addEventListener('input', debounce(e => {
  state.query = e.target.value;
  render();
}, 110));
$('#searchClear').addEventListener('click', () => { $('#search').value = ''; state.query = ''; render(); $('#search').focus(); });

$('#bereichSwitch').addEventListener('click', e => {
  const b = e.target.closest('[data-bereich]');
  if (b) setBereich(b.dataset.bereich);
});
$('#btnNewTodo').addEventListener('click', async () => {
  const data = await todoDialog(null);
  if (data) { const t = await saveTodo(data); if (t) toast('To-Do angelegt', { tone: 'success', detail: t.taetigkeit }); }
});

$('#viewSwitch').addEventListener('click', e => {
  const b = e.target.closest('[data-view]');
  if (!b) return;
  setView(b.dataset.view);
});
/* Chips, Auf-/Zuklappen und Filter sitzen in zwei Leisten – daher am gemeinsamen Kopf hören */
$('.content-head').addEventListener('click', e => {
  if (e.target.closest('#chipMine')) return toggleMine();
  const chip = e.target.closest('[data-status]');
  if (chip) { state.status = chip.dataset.status; return render(); }
  const expand = e.target.closest('[data-expand]');
  if (expand) return setAllExpanded(expand.dataset.expand === 'all');
});
$('.content-head').addEventListener('change', e => {
  const map = { fltTask: 'taetigkeit', fltSort: 'sort' };
  const k = map[e.target.id];
  if (k) { state[k] = e.target.value; render(); }
});
$('#btnReset').addEventListener('click', resetFilters);

async function toggleMine() {
  if (!state.mine && !await ensureUser()) return;
  state.mine = !state.mine;
  render();
}

/** Ansicht wechseln – Sortierung passend umschalten. */
function setView(v) {
  state.view = v;
  const locSorts = ['loc-critical', 'loc-nr'];
  if (v === 'objects' && !locSorts.includes(state.sort)) state.sort = 'loc-critical';
  if (v !== 'objects' && locSorts.includes(state.sort)) state.sort = 'due-asc';
  $$('#viewSwitch button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.view === v)));
  render();
}
/* Kopfzeile */
$('#btnUser').addEventListener('click', changeUser);
$('#btnPrint').addEventListener('click', () => window.print());

const menu = $('#menuPop');
$('#btnMenu').addEventListener('click', e => {
  e.stopPropagation();
  const open = menu.hidden;
  menu.hidden = !open;
  $('#btnMenu').setAttribute('aria-expanded', String(open));
});
document.addEventListener('click', e => {
  if (!e.target.closest('#btnMenu') && !e.target.closest('#menuPop')) {
    menu.hidden = true; $('#btnMenu').setAttribute('aria-expanded', 'false');
  }
});
menu.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  menu.hidden = true; $('#btnMenu').setAttribute('aria-expanded', 'false');
  const a = b.dataset.act;
  if (a === 'csv') exportCsv();
  if (a === 'json') exportJson();
  if (a === 'keyboard') shortcutsDialog();
  if (a === 'settings') settingsDialog();
});

/* Zeilenfokus per Pfeiltasten */
let cursor = -1;
function moveCursor(delta) {
  const rows = $$('#tableHost [data-id]');
  if (!rows.length) return;
  rows.forEach(r => { r.removeAttribute('aria-selected'); r.classList.remove('focus-row'); });
  cursor = Math.max(0, Math.min(rows.length - 1, cursor < 0 ? 0 : cursor + delta));
  const el = rows[cursor];
  el.classList.add('focus-row');
  el.setAttribute('aria-selected', 'true');
  el.scrollIntoView({ block: 'nearest' });
}
const focusRow = () => $$('#tableHost [data-id]')[cursor];

document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
  if (e.key === 'Escape') {
    if (typing) { e.target.blur(); return; }
    if ($('#overlay').children.length) return;      // Dialog/Detailleiste schließt selbst
    const any = state.query || state.objekt || state.taetigkeit ||
                state.zustaendig || state.status !== 'alle' || state.mine;
    if (any) return resetFilters();
    return;
  }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); $('#search').focus(); return; }
  if (e.key === 'ArrowDown') { e.preventDefault(); return moveCursor(1); }
  if (e.key === 'ArrowUp')   { e.preventDefault(); return moveCursor(-1); }
  // Auf echten Bedienelementen die Standardaktivierung nicht wegnehmen
  const onControl = !!e.target.closest('button, a, [role="checkbox"], [role="switch"]');
  if (e.key === 'Enter') { if (onControl) return; const r = focusRow(); if (r) openPanel(r.dataset.id); return; }
  const k = e.key.toLowerCase();
  if (k === 'm') {
    const order = ['objects', 'plan', 'table'];
    const next = order[(order.indexOf(state.view) + 1) % order.length];
    setView(next);
    return;
  }
  if (k === 'p') { window.print(); return; }
  if (k === 'n') { const r = focusRow(); if (r) return openPanel(r.dataset.id, { focusNote: true }); return; }
  if (k === 'e') {
    const r = focusRow(); if (!r) return;
    const it = state.items.find(x => String(x.id) === String(r.dataset.id));
    if (it) (it.erledigt ? reopen : markDone)(r.dataset.id);
  }
});

/* ------------------------------------------------------------------ Start */
async function init() {
  document.documentElement.dataset.theme = settings.theme === 'auto'
    ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : settings.theme;
  try { state.user = localStorage.getItem(CONFIG.userKey) || CONFIG.currentUser || settings.user || ''; } catch {}
  loadExpanded();
  loadCollapsed();

  store = CONFIG.dataSource === 'api' ? ApiStore : LocalStore;
  state.loading = true; renderSource(); render();

  try {
    const { items, fresh } = await store.load();
    state.items = items;
    state.online = true;
    state.freshSeed = !!fresh;
    try { state.todos = await store.loadTodos(); } catch (e2) { state.todos = []; }
  } catch (e) {
    // Backend nicht erreichbar: mit dem lokalen Testbestand weiterarbeiten
    store = LocalStore;
    const { items } = await LocalStore.load();
    state.items = items;
    state.todos = await LocalStore.loadTodos();
    state.online = false;
    toast('Backend nicht erreichbar', {
      tone: 'warning', ms: 7000,
      detail: 'Es wird der lokale Testbestand angezeigt. Änderungen werden dort gespeichert.'
    });
  }

  state.loading = false;
  renderSource();
  render();
  if (state.freshSeed && store === LocalStore) {
    toast(hasDataFile() ? 'Stammdaten geladen' : 'Testbestand geladen', {
      tone: 'info',
      detail: state.items.length + ' Wartungspositionen bereit' +
        (hasDataFile() ? ' (Quelle: daten.js)' : ' (50 Musterdatensätze)'),
      ms: 4500
    });
  }
}

init();
</script>
