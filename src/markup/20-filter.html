<!-- Ausklappbarer Filter-Drawer -->
<div class="filter-drawer" id="filterDrawer" hidden>
  <span class="combo-host" id="fltUser" style="width:160px"></span>
  <span class="sel"><select id="fltTask"><option value="">alle Tätigkeiten</option></select></span>
  <span class="sel"><select id="fltSort">
    <optgroup label="Standorte">
      <option value="loc-critical">kritische zuerst</option>
      <option value="loc-nr">nach Objekt-Nr.</option>
    </optgroup>
    <optgroup label="Positionen">
      <option value="due-asc">Frist: nächste zuerst</option>
      <option value="due-desc">Frist: späteste zuerst</option>
      <option value="obj-asc">Objekt-Nr. aufsteigend</option>
      <option value="name-asc">Objektname A–Z</option>
      <option value="task-asc">Tätigkeit A–Z</option>
      <option value="user-asc">Zuständig A–Z</option>
      <option value="status-asc">Status: offen zuerst</option>
    </optgroup>
  </select></span>
  <button class="btn btn-sm btn-ghost" id="btnReset" hidden>Filter zurücksetzen</button>
  <span class="summary-info" id="resultInfo"></span>
</div>
