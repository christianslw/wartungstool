<!-- Filter-Popover (an der Filter-Pille in der Toolbar verankert) -->
<aside class="view-panel" id="viewPanel" hidden role="dialog" aria-label="Filter">
  <header class="fd-head">
    <h2 id="filterTitle">Filter</h2>
    <button class="td-act" id="filterClose" aria-label="Filter schließen">
      <svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor"><path d="M24 9.4 22.6 8 16 14.6 9.4 8 8 9.4 14.6 16 8 22.6 9.4 24 16 17.4 22.6 24 24 22.6 17.4 16z"/></svg>
    </button>
  </header>

  <div class="fd-body">
    <div class="fd-sect">
      <h3 class="fd-title">Status</h3>
      <div class="status-seg" id="statusChips" role="group" aria-label="Statusfilter"></div>
      <button class="btn-mine" id="chipMine" title="Nur mir zugewiesene Positionen">
        <svg width="12" height="12" viewBox="0 0 32 32" fill="currentColor"><path d="M16 4a6 6 0 1 1 0 12 6 6 0 0 1 0-12m0 2a4 4 0 1 0 0 8 4 4 0 0 0 0-8m0 12c6.6 0 10 3.3 10 5v3H6v-3c0-1.7 3.4-5 10-5m0 2c-2.2 0-4.1.4-5.5 1.1S8.2 22.4 8 23v1h16v-1c-.2-.6-1.1-1.2-2.5-1.9S18.2 20 16 20"/></svg>
        Meine <span class="n" id="chipMineN" hidden>0</span>
      </button>
    </div>

    <div class="fd-sect">
      <h3 class="fd-title">Person</h3>
      <span class="combo-host" id="fltUser"></span>
    </div>

    <div class="fd-sect">
      <h3 class="fd-title">Tätigkeit</h3>
      <select id="fltTask" aria-label="Tätigkeit"><option value="">alle Tätigkeiten</option></select>
    </div>

    <div class="fd-sect">
      <h3 class="fd-title">Zeitraum</h3>
      <span class="vp-range">
        <select id="fltJahr" aria-label="Zeitraum Jahr"></select>
        <span class="vp-range-row">
          <input class="inp inp-sm" id="fltVon" inputmode="numeric" placeholder="TT.MM.JJJJ" aria-label="Zeitraum von">
          <span class="vp-range-sep" aria-hidden="true">–</span>
          <input class="inp inp-sm" id="fltBis" inputmode="numeric" placeholder="TT.MM.JJJJ" aria-label="Zeitraum bis">
        </span>
      </span>
    </div>
  </div>

  <footer class="fd-foot">
    <button class="btn btn-sm btn-ghost" id="btnReset" hidden>Filter zurücksetzen</button>
  </footer>
</aside>
