<!-- Chrome Zeile 1: App Bar -->
<header class="shell-header">
  <div class="hdr-brand">
    <svg width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><rect width="32" height="32" rx="4" fill="#0f62fe"/><path d="M8 21.5 13 10.5l3.4 6.6L18.6 14 24 21.5z" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/></svg>
    <span class="hdr-name">Wartungstool</span>
    <span class="hdr-sub">Technik Außeneinsatz</span>
  </div>

  <div class="hdr-search">
    <svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M13 4a9 9 0 1 0 5.66 16l6.17 6.17 1.41-1.41L20 18.59A9 9 0 0 0 13 4m0 2a7 7 0 1 1 0 14 7 7 0 0 1 0-14"/></svg>
    <input id="search" type="text" autocomplete="off" spellcheck="false" placeholder="Suchen: Objekt, Nummer, Tätigkeit, Person..." aria-label="Suche">
    <button class="clr" id="searchClear" aria-label="Suche leeren"><svg width="12" height="12" viewBox="0 0 32 32" fill="currentColor"><path d="M24 9.4 22.6 8 16 14.6 9.4 8 8 9.4 14.6 16 8 22.6 9.4 24 16 17.4 22.6 24 24 22.6 17.4 16z"/></svg></button>
    <kbd class="searchkey" id="searchHint">/</kbd>
  </div>

  <div class="hdr-spacer"></div>

  <button class="hdr-user" id="btnUser" title="Namen für die Protokollierung ändern">
    <svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M16 4a6 6 0 1 1 0 12 6 6 0 0 1 0-12m0 2a4 4 0 1 0 0 8 4 4 0 0 0 0-8m0 12c6.6 0 10 3.3 10 5v3H6v-3c0-1.7 3.4-5 10-5m0 2c-2.2 0-4.1.4-5.5 1.1S8.2 22.4 8 23v1h16v-1c-.2-.6-1.1-1.2-2.5-1.9S18.2 20 16 20"/></svg>
    <span class="uname" id="userName">Name hinterlegen</span>
    <span class="user-nudge" id="userNudge" hidden title="Bitte Namen für Protokollierung hinterlegen">!</span>
  </button>

  <button class="hdr-btn" id="btnPrint" title="Drucken (P)" aria-label="Drucken">
    <svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M28 10v9h-4v6H8v-6H4v-9h6V4h12v6zM10 6v4h12V6zm12 17v-8H10v8zm4-6v-5H6v5h2v-4h16v4z"/><path d="M25 12h2v2h-2z"/></svg>
  </button>
  <button class="hdr-btn" id="btnMenu" aria-haspopup="menu" aria-expanded="false" title="Weitere Aktionen" aria-label="Weitere Aktionen">
    <svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><circle cx="16" cy="8" r="2.2"/><circle cx="16" cy="16" r="2.2"/><circle cx="16" cy="24" r="2.2"/></svg>
  </button>
  <div class="menu" id="menuPop" role="menu" hidden>
    <button role="menuitem" data-act="csv"><svg width="14" height="14" viewBox="0 0 32 32" fill="currentColor"><path d="M19 21h-6v2h6zm0-4h-6v2h6zm-6-4v2h6v-2z"/><path d="M6 28V4h14l6 6v18zM8 6v20h16V11h-5V6z"/></svg>CSV exportieren (Excel)</button>
    <button role="menuitem" data-act="json"><svg width="14" height="14" viewBox="0 0 32 32" fill="currentColor"><path d="M9 22V10h2v12zm12-12h2v12h-2zm-6 3 2-3h2l-3 4.5 3 4.5h-2l-2-3-2 3h-2l3-4.5L11 10h2z"/></svg>JSON-Sicherung (gesamt)</button>
    <button role="menuitem" data-act="jsonview"><svg width="14" height="14" viewBox="0 0 32 32" fill="currentColor"><path d="M9 22V10h2v12zm12-12h2v12h-2zm-6 3 2-3h2l-3 4.5 3 4.5h-2l-2-3-2 3h-2l3-4.5L11 10h2z"/></svg>JSON der aktuellen Ansicht</button>
    <div class="sep"></div>
    <button role="menuitem" data-act="settings"><svg width="14" height="14" viewBox="0 0 32 32" fill="currentColor"><path d="M16 10a6 6 0 1 0 0 12 6 6 0 0 0 0-12m0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8"/></svg>Einstellungen</button>
    <button role="menuitem" data-act="keyboard"><svg width="14" height="14" viewBox="0 0 32 32" fill="currentColor"><path d="M28 24H4V8h24zM6 22h20V10H6z"/></svg>Tastenkürzel</button>
  </div>
</header>
