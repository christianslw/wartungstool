<!-- Chrome Zeile 2: Toolbar (Tabs + zusammengefasste Steuerung) -->
<div class="toolbar-row">
  <div class="scope-tabs" id="tabBar" role="tablist" aria-label="Ansichten"></div>

  <div class="tb-right">
    <span id="viewAction"></span>
    <button class="btn-filter-toggle" id="btnViewPanel" aria-expanded="false" title="Filter, Gruppierung, Sortierung und Ansicht">
      <svg width="13" height="13" viewBox="0 0 32 32" fill="currentColor"><path d="M4 6h24v3l-9 9v8l-6 3v-11L4 9z"/></svg>
      <span>Ansicht &amp; Filter</span>
      <span class="dot" id="viewActiveDot" hidden></span>
    </button>
    <button class="btn-cta" id="btnNewTodo">
      <svg width="14" height="14" viewBox="0 0 32 32" fill="currentColor"><path d="M15 6h2v9h9v2h-9v9h-2v-9H6v-2h9z"/></svg>
      <span>Neues To-Do</span>
    </button>
  </div>
</div>
